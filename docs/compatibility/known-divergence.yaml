- id: docker/remote-manifest-404-negative-cache
  surface: docker remote manifest 404 负缓存（C14）
  classification: BUG
  rationale: >-
    L004-2 双臂探针定谳（2026-09-11，reports/compatibility/L004-negative-cache-probe.md）：**消失是幻象**——
    docker /v2 面 manifest 冷 miss 负缓存自 T-363（d2746341）诞生即不存在（404 写入恒包 standing 守卫，git log -S
    实证）；L000-B「40-70ms 本地负缓存」系本地上游 RTT 误读（同量级时延不可分）。参照侧双面兑现
    missedRetrievalCachePeriodSecs（M-a tag miss 1/3 回源+TTL 到期回源；M-b 未知 image 0/3 确定性本地）——
    E6-3「参照未生效」双双证伪闭账。分歧实锤：BinFlow M-a 3/3、M-b 3/3 回源。**ADR-0048 自带 Errata 触发条件
    （复测翻转→ADR 自动作废、C14 按对齐收）已触发**——blob 臂 B1/B2 维持现状（门控+无条件负缓存+TTL 过期全过）。
  authority: { type: differential, ref: reports/compatibility/L004-negative-cache-probe.md }
  review_gate: LOOP 005 实现票（manifest 冷 miss 臂补负缓存写入——M-a/M-b 同一缺口；键法设计归 dev，参照 Path 形态可参考）
  resolved:
    date: '2026-09-12'
    evidence: >-
      reports/compatibility/L005-c14-d1-diff.md §3（L005-1 实现票修后重跑，uat.l0051-792c347c）：M-a tag miss
      双端 1/3 回源同形（参照 try1 HEAD / BinFlow try1 GET，try2/3 本地）——L004-2 的 BinFlow 3/3 分歧关闭；
      missedTTL 60s 到期回源 +1 + 行重写 + 再冻结（BinFlow sqlite 行直证：重写时刻=复问时刻、窗长恰 60s）；
      M-b 未知 image 名双端 1/3 同形。authority 链：本报告 + L004-negative-cache-probe.md + ADR-0048 Errata。
    note: >-
      M-b 复现条件差存证：L004-2 的参照侧 0/3（未知名零回源、确定性本地）本轮未复现——干净专属仓与 _catalog
      聚合后两态均为首问一次（HEAD）后窗口内本地，与 M-a 同形；「未知名不外问」强读法按第一手双证据废弃，
      疑 L004-2 §2.1 M-b 子臂计数过滤或前置状态所致（同其 §1.3 自记误读类），登记供 conductor 复核。
      真实 CLI 腿：docker CLI 拉缺失 tag 上游恰 1 往返（HEAD 落行、GET 本地应答），manifest-unknown 错误族渲染。
      契约 docker/remote-manifest-404-no-negative-cache expect 已按「首问一次→窗口内本地→到期回源」重写并翻 VERIFIED。
  evidence: reports/compatibility/L004-negative-cache-probe.md（代码定谳+双臂矩阵+TTL 复核；原始观察 L000-docker-remote-evidence.md E6-3/E3-4 已被证伪归档）

  classification: BUG
  rationale: >-
    L006-1 票 A 双端实测（reports/compatibility/L006-a-b-diff.md §1.4，2026-09-12）：参照 POST 更新省略字段
    =保留存量（remote 四域 keep 实测）；BinFlow remote 更新=全量替换回落默认（hardFail/missed 等全字段同族，
    四域修复前已如此）、local 更新=调用方 blob 整体替换。族级既有差异（影响全部 remote 字段，非四域
    round-trip 特例）——客户端省略字段即静默丢配置，行为面实质分歧。矩阵 D02-R03/R04 翻绿不吸收本账
    （行 note 指针互锚）。L007-3 边界取证（reports/compatibility/L007-3-update-merge-evidence.md）扩证：
    ① 省略=保留为全族行为（credential/period/notes/description/数组/对象一致，url 更新面亦可省）；
    ② 清空通道三列互异（标量=null/""、数组无通道、对象={} 整族复位）；③ **PUT-on-existing=400 create-only**
    （参照更新拼写只有 POST）vs BinFlow PUT-on-existing=更新 200——相抵臂并入本账裁定范围（冻结行
    「key 冲突 400/409 已对齐」旧注记随之失效）；④ 0-as-absent（period 族显式 0 存 0 vs BinFlow 视为缺省）
    为 create/update 共有相邻差异，随 merge 票联裁；⑤ T-80「全量替换=Artifactory PUT 模型」旧认知勘误
    （service.go 注释随实现票改）。ADR 候选稿=docs/design/repo-update-merge.md（省略=保留 patch 模型，
    patch 基建已在：remoteConfigInput 全指针席位）。
  authority: { type: differential, ref: "reports/compatibility/L006-a-b-diff.md §1.4 + L007-3-update-merge-evidence.md" }
  review_gate: LOOP 008 ADR 流程（docs/design/repo-update-merge.md 过 DECISIONS.md）+ 实现票（merge/PUT-on-existing/0-as-absent 三臂联裁）
  evidence: reports/compatibility/L006-a-b-diff.md §1.4 + L007-3-update-merge-evidence.md（+ADR 候选稿 docs/design/repo-update-merge.md）
- id: rest/repo-config-invalid-value-family
  surface: 仓配置标量非法值形态族（maxUniqueSnapshots 非数字 / blackedOut 宽容布尔 / repoLayoutRef 未知名）
  classification: UNKNOWN
  rationale: >-
    L006-1 §1.3 三臂（2026-09-12）：① maxUniqueSnapshots:"seven"——参照 500（Java 转换器报文）vs BinFlow
    400（decode 报文带字段名——全域统一 decode 姿态，非四域特例）；② blackedOut:"yes"——参照接受且转 true
    （commons-lang 布尔宽容，Java 库癖性）vs BinFlow 400；③ repoLayoutRef 未知名——参照 400 "Unable to find
    repository layout by the name: <n>" vs BinFlow 接受并存读（无布局注册表；K73 已定谳 presentation-only，
    参照 /api/repo_layouts 在本实例亦 404）。L007-3 §6 逐字报文补证：参照自身姿态不均——String→Integer 撞
    500、String→Boolean 不可转（"maybe"）拒 400、布局名拒 400、宽容布尔可落库（"yes"/"on"/"TRUE"→true，
    "off"→false）；即「对齐参照」≠统一错误模型而是复刻其不一致。三臂均客户端可见分歧，对齐方向需
    产品裁（管理面 client 影响以重试语义为主：500 诱发规范客户端重试确定性错误——RFC 9110 §15.5/15.6）。
    裁定素材=docs/prd/ruling-invalid-value-family.md（architect 两案对比+建议立场：维持 400/INTENTIONAL；
    供 PM 折入 pending-rulings 建议编号 R-10）。
  authority: { type: pending, ref: "产品/架构裁（非法值姿态：统一 decode 400 vs 复刻参照 500/宽容转换——R-10）" }
  review_gate: LOOP 008 限期升级（R-10 authority 终裁；INTENTIONAL 需 ADR/用户裁决，裁对齐则开实现票）
  evidence: reports/compatibility/L006-a-b-diff.md §1.3 + L007-3-update-merge-evidence.md §6（+裁定素材 docs/prd/ruling-invalid-value-family.md，R-10 折入建议）
- id: rest/permissions-v1-response-shape-residuals
  surface: v1 permissions 面残余渲染族（DELETE 码+文 / GET 未知名体裁 / POST 死动词）
  classification: BUG
  rationale: >-
    L006-1 票 B 别名挂载（D04-R17/R18 面）后残余三臂（§2.1，2026-09-12）：① DELETE
    /api/security/permissions/{name}——参照 200 纯文本 "Successfully deleted permission Target 'x'" vs
    BinFlow 204（与现行 v1 面 handler 同体）；② GET 未知名——参照 404 errors-envelope "Not Found" vs
    BinFlow 404 纯文本（本面既定姿态）；③ POST 死动词——参照 400 "Bad Request"（参照自身不可用）vs
    BinFlow 404（E-26 不挂载——挂载任一形态都非对齐，留痕）。GET/PUT 主臂已 SAME（letters 动作/扁平
    patterns、PUT 201 两态+409 逐字同）。
  authority: { type: differential, ref: "reports/compatibility/L006-a-b-diff.md §2.1" }
  review_gate: LOOP 007 实现票（一票三臂收口；resolved 后矩阵 D04-R18 随翻——L007-4 已预登记翻绿条件）
  resolved:
    date: '2026-09-12'
    evidence: >-
      reports/compatibility/L007-residuals-users-diff.md §1（L007-1 实现收官，独立验证实例 binflow-l0071-verify /
      uat-l0071-c1193f5f）：三臂全闭合——① DELETE 200 text/plain "Successfully deleted permission Target
      'l007-del'" 逐字同；② 未知名 404 errors-envelope 同体同文（GET/DELETE 双腿）；③ admin 主体 400 文案
      逐字同（含参照自带双单引号癖性）+ 两优先序佐证腿（admin 扫描先于 unknown-user、仓校验先于 admin）。
      连带收口：PUT 未识组 400 "Permission target contains a reference to a non-existing group 'x'."
      （原 "Unable to find group by name" 已改，组名前无冒号与 user 臂异——留痕）。
    note: >-
      裁量记录（L007-1 §3）：400 系载体维持 BinFlow 纯文本姿态（参照全 envelope——载体差低于阈值、与同面
      各腿一致避免体裁混排；L006 差分按文案逐字判 SAME 口径沿）；404 未知名臂按台账口径升级 envelope。
      BinFlow 自有 /api/v1/permissions/{name} DELETE 204 冻结面不动（单元测试钉死，参照无此面）。
      矩阵 D04-R18 随翻 compatible（L007 收官联动）。
  evidence: reports/compatibility/L006-a-b-diff.md §2.1
- id: rest/security-read-family-readonly-admin-gate
  surface: 经典 security 读族 GET 管理面门（/api/security/permissions[/{name}]、/api/security/users、/api/security/groups 等列表/详情）
  classification: UNKNOWN
  rationale: >-
    BinFlow 门=CapSecurityRead（admin ∨ readonly_admin 可读——internal/httpapi/router.go security/permissions
    GET 族、security/users、security/groups 列表族实测挂载）；参照实例级无 read-only admin（docs/reverse/
    rbac-model.md #2 高置信：实例级只有 admin 布尔，最接近物为 project 域 Viewer），经典读族参照侧 admin-only。
    对参照存在的调用者类（admin 200/普通 user 403/匿名 401）双端一致——分歧仅在 BinFlow 自有 readonly_admin
    角色轴上显现（参照无此主体，L006-1 差分以 admin 凭据执行未触该轴；L006 Review B 范围外上报）。先例核对
    结论：known-divergence 无家族条目、DECISIONS 各 Errata 亦无此裁定——ADR-0026 决策 1 已立 readonly_admin
    管理面含 security:read（架构位），但「经典 security 读族对该角色放行 vs 参照 admin-only」的兼容姿态未经
    终裁。候选 INTENTIONAL（模型级超集角色，参照存在主体面零差；与 docker/remote-v2-ping-revoked-arm-
    unreachable 同为「参照主体缺位」款）；裁对齐则需经典读族收窄 admin-only（翻转既有 readonly_admin
    200→403 组合，M9「新增不破坏」基调冲突面，影响面=readonly_admin 全部管理面读消费——console 只读视图）。
  authority: { type: pending, ref: "产品/用户裁决（readonly_admin 经典 security 读面姿态：维持 CapSecurityRead 超集 vs 收窄 admin-only）" }

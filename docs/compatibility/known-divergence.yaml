    元数据面不计数）。根因：计数器随内容面 Get 直乘（ADR-0044 K69「direct」臂的附带伤害）；?stats
    面已有 statsNode 非计数解算先例可循。本轮差分夹具以「属性只放在有下载的文件」规避，32/32 不受
    影响——但该污染会在脏实例上阻 A30 类臂收敛（坑登记）。
  authority: { type: differential, ref: "reports/compatibility/L010-list-p2-diff.md §6-a（UAT 隔离探针）" }
  review_gate: LOOP 011 修复票（httpapi 元数据面非计数解算——List-based 精确匹配臂 + 各面拼写回退语义；virtual 解算语义验证前置）

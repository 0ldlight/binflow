- id: docker/remote-v2-ping-revoked-arm-unreachable
  surface: 'docker /v2/ ping revoked bearer 第四臂消息（"Token failed verification: revoked"，L004-1 P4b）'
  classification: UNKNOWN
  rationale: >-
    参照 token 吊销保留吊销态可验（第四臂消息独立：Token failed verification: revoked——产品 revoke API 活体
    坐实）；BinFlow revoke=删行模型，revoked 验定恒走 unknown 臂 → 客户端恒见 "Props Authentication Token
    not found"——第四臂在 BinFlow 模型下不可达。INTENTIONAL 候选（模型级）：若裁对齐参照需引入吊销态可验
    模型（表结构+验定链改动）。P1/P2/P3 三臂已逐字节一致（分型挂账已清偿）。
  authority: { type: pending, ref: "产品/用户裁决（token 吊销模型：删行 vs 吊销态可验）" }
  review_gate: LOOP 005 限期升级（INTENTIONAL 终裁需 authority；裁对齐则开实现票）
  evidence: reports/compatibility/L004-304-ping-diff.md §4 P4b（含参照侧复现要点：mint 须带 scope/吊销剩余寿命阈值 6h）
- id: docker/remote-blob-expired-revalidation
  surface: docker remote 过期 blob 回源行为（retrievalCachePeriodSecs 窗口到期，L004-1 X3/X4）
  classification: BUG
  rationale: >-
    BinFlow 对已缓存 blob 的检索窗到期即回源重取（+1、滑窗、行重写——TTL 兑现精确）；参照对已缓存 blob
    **零回源**。L007-2 定向探针四臂铁证（reports/compatibility/L007-d3-virtual-probe.md §1，uat.l0072-c1193f5f）：
    1×TTL ×3 / INM / **10×TTL（~14 min）** / 真实 docker pull 全臂参照上游计数 0、filestore mtime 全程未动
    ——「参照在某窗后回源」假说被排除；参照的区分不是窗口长短而是 **manifest（可变 tag，恒 +1 重验）/blob
    （内容寻址不可变，豁免检索窗）语义二分**。客户端可见面全臂双端全同（200/304/内容/digest/etag），
    纯上游行为分歧。conductor LOOP 007 终裁（2026-09-12）：**BUG 对齐收**——探针 §1.7 的 INTENTIONAL
    候选未采纳，对齐路径=已验证 blob 豁免检索窗重取（blob GET 结果不可能变化，到期重取语义空转、
    每窗白付一次上游往返+带宽；参照即此语义）。
  authority: { type: conductor_ruling, ref: "reports/compatibility/L007-d3-virtual-probe.md（conductor LOOP 007 终裁 2026-09-12：BUG 对齐收——blob 豁免检索窗）" }
  review_gate: LOOP 008 小票（已验证 blob 豁免检索窗重取；实现后双端复核上游计数归零——L007-2 §1.2/1.3/1.4 臂为复验基线）
  evidence: reports/compatibility/L007-d3-virtual-probe.md §1（四臂铁证+裁决素材 §1.7）；源头 L004-304-ping-diff.md §3 X3/X4

  classification: UNKNOWN
  rationale: >-
    L026-5 A 侧规格探针+B 对照（2026-09-17）。**A 参照行为规格（holder+noperm 双夹具，读面与权限
    解耦）**：当客户端为任意认证非 admin 用户 GET /api/repositories/{key}——服务端返回 200 四键投影

- id: docker/remote-manifest-inm-unquoted
  surface: docker remote manifest 条件请求 unquoted If-None-Match 拼写（L004-1 新窗口矩阵 M2/M2c/M2d）
  classification: BUG
  rationale: >-
    参照 manifest 面按值不区分引号匹配（unquoted 匹配→304 裸头本地应答；unquoted 非匹配在场→封死日期臂 200）；
    BinFlow manifestClientNotModified 只解析带引号 entity-tag，unquoted 拼写解析为零标签被丢弃落日期臂——
    M2/M2d（200 全量 vs 304）、M2c（304 vs 200）三臂反转。blob 面两侧同构不受影响（B2/B5 SAME）。
    真实 docker/containerd/oras 客户端均发 quoted etag（RFC 9110），实际客户端影响面低——矩阵口径可观察面分歧。
  authority: { type: differential, ref: "reports/compatibility/L004-304-ping-diff.md §2（SAME 15/DIVERGENT 3，STABLE×2）" }
  review_gate: LOOP 005 实现票（unquoted 按值匹配 + 任意 INM 在场封死日期臂）→ 契约 docker/remote-manifest-conditional-get 复验翻绿。**修复后必须重跑全 304-matrix：M6/M2b 现判 SAME 系经「丢弃→日期臂」路径的偶合，语义统一后可能翻面**（L004-304-ping-diff.md Risks ③/Next ①）；随票修 client_conditional.go:8-11/:95-96 与测试文件头三处以参照口吻陈述已证伪行为的注释（Review A N1）

    date: '2026-09-12'
    evidence: >-
      T-L011-1（uat-l0111-293a754c-wip 活体）：九面隔离探针全 0（iso.txt 上传 stats=0 → PUT/GET/DELETE
      props=0 → item-info=0 → ?permissions+?list=0 → virtual 面 item-info+props 成员行=0）→ **真内容
      GET=1——计数器健在**（de-probe 的是面不是计数器）；virtual 前置确认修复（修复前 virtual 面同名读
      使成员 0→1→2→3）；remote 面顺带第二处 parity：未缓存 remote 路径 item-info 404 不回源（修复前
      200+整制品拉取+落地+计数；参照同臂 404）；A30 脏实例收敛：干净文件键缺席 / 真下载一次键在@真实
      时刻 / 参照对照臂（未下载缺席→真 GET 键在→metadata 三面后计数稳定 1）。
    note: >-
      **历史污染行不回写=事实保留**（vp.txt 修复前污染行=3 与参照真下载行同形——不清洗存量数据，账面

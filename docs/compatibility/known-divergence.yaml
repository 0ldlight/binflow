- id: docker/remote-token-response-shape
  surface: docker remote /v2/token 签发响应字段集与 TTL（C01b）
  classification: UNKNOWN
  rationale: "参照 {token(JWT), expires_in:9000}，无 issued_at；BinFlow {token(不透明 hex), access_token, expires_in:2592000, issued_at, scope}——docker CLI 实测登录/拉取均兼容（超集字段不破坏客户端）；是否对齐 9000/JWT 形态待 authority 裁定"
  authority: { type: pending, ref: "用户/产品裁决（token TTL 与形态策略）" }

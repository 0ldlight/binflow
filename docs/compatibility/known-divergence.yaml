    =保留存量（remote 四域 keep 实测）；BinFlow remote 更新=全量替换回落默认（hardFail/missed 等全字段同族，
    四域修复前已如此）、local 更新=调用方 blob 整体替换。族级既有差异（影响全部 remote 字段，非四域
    round-trip 特例）——客户端省略字段即静默丢配置，行为面实质分歧。矩阵 D02-R03/R04 翻绿不吸收本账
    （行 note 指针互锚）。L007-3 边界取证（reports/compatibility/L007-3-update-merge-evidence.md）扩证：
    ① 省略=保留为全族行为（credential/period/notes/description/数组/对象一致，url 更新面亦可省）；
    ② 清空通道三列互异（标量=null/""、数组无通道、对象={} 整族复位）；③ **PUT-on-existing=400 create-only**
    （参照更新拼写只有 POST）vs BinFlow PUT-on-existing=更新 200——相抵臂并入本账裁定范围（冻结行
    「key 冲突 400/409 已对齐」旧注记随之失效）；④ 0-as-absent（period 族显式 0 存 0 vs BinFlow 视为缺省）
    为 create/update 共有相邻差异，随 merge 票联裁；⑤ T-80「全量替换=Artifactory PUT 模型」旧认知勘误
    （service.go 注释随实现票改）。ADR 候选稿=docs/design/repo-update-merge.md（省略=保留 patch 模型，
    patch 基建已在：remoteConfigInput 全指针席位）。
  authority: { type: adr, ref: "DECISIONS.md#adr-0050（仓配置更新语义终案：POST=merge 三列矩阵 + PUT=create-only——L007-3 候选稿收编）+ 差分链 L006-a-b-diff §1.4 / L007-3-update-merge-evidence / L008-update-merge-diff §1" }

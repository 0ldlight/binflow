- id: docker/remote-v2-ping-revoked-arm-unreachable
  surface: 'docker /v2/ ping revoked bearer 第四臂消息（"Token failed verification: revoked"，L004-1 P4b）'
  classification: UNKNOWN
  rationale: >-
    参照 token 吊销保留吊销态可验（第四臂消息独立：Token failed verification: revoked——产品 revoke API 活体
    坐实）；BinFlow revoke=删行模型，revoked 验定恒走 unknown 臂 → 客户端恒见 "Props Authentication Token
    not found"——第四臂在 BinFlow 模型下不可达。INTENTIONAL 候选（模型级）：若裁对齐参照需引入吊销态可验
    模型（表结构+验定链改动）。P1/P2/P3 三臂已逐字节一致（分型挂账已清偿）。
  authority: { type: pending, ref: "产品/用户裁决（token 吊销模型：删行 vs 吊销态可验）" }
  review_gate: LOOP 005 限期升级（INTENTIONAL 终裁需 authority；裁对齐则开实现票）
  evidence: reports/compatibility/L004-304-ping-diff.md §4 P4b（含参照侧复现要点：mint 须带 scope/吊销剩余寿命阈值 6h）
- id: docker/remote-blob-expired-revalidation
  surface: docker remote 过期 blob 回源行为（retrievalCachePeriodSecs 窗口到期，L004-1 X3/X4）
  classification: UNKNOWN
  rationale: >-
    BinFlow 对已缓存 blob 的检索窗到期后按 TTL 回源重取（上游 GET +1）再本地应答；活体参照对已缓存 blob

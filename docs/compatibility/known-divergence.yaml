- id: rest/repo-config-invalid-value-family
  surface: 仓配置标量非法值形态族（maxUniqueSnapshots 非数字 / blackedOut 宽容布尔 / repoLayoutRef 未知名）
  classification: UNKNOWN
  rationale: >-
    L006-1 §1.3 三臂（2026-09-12）：① maxUniqueSnapshots:"seven"——参照 500（Java 转换器报文）vs BinFlow
    400（decode 报文带字段名——全域统一 decode 姿态，非四域特例）；② blackedOut:"yes"——参照接受且转 true
    （commons-lang 布尔宽容，Java 库癖性）vs BinFlow 400；③ repoLayoutRef 未知名——参照 400 "Unable to find
    repository layout by the name: <n>" vs BinFlow 接受并存读（无布局注册表；K73 已定谳 presentation-only，
    参照 /api/repo_layouts 在本实例亦 404）。L007-3 §6 逐字报文补证：参照自身姿态不均——String→Integer 撞
    500、String→Boolean 不可转（"maybe"）拒 400、布局名拒 400、宽容布尔可落库（"yes"/"on"/"TRUE"→true，
    "off"→false）；即「对齐参照」≠统一错误模型而是复刻其不一致。三臂均客户端可见分歧，对齐方向需
    产品裁（管理面 client 影响以重试语义为主：500 诱发规范客户端重试确定性错误——RFC 9110 §15.5/15.6）。
    裁定素材=docs/prd/ruling-invalid-value-family.md（architect 两案对比+建议立场：维持 400/INTENTIONAL；
    供 PM 折入 pending-rulings 建议编号 R-10）。
    改期（2026-09-12，LOOP 009 L009-1）：authority 阻塞非证据阻塞——R-10a/b/c 三臂已折入 pending-rulings
    v2.0 整包呈批（docs/prd/pending-rulings.md §1 R-10a~c + §2-R10，L008-4a），触发条件=用户批复即升级：

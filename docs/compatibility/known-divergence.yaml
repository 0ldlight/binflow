  review_gate: LOOP 005 实现票（unquoted 按值匹配 + 任意 INM 在场封死日期臂）→ 契约 docker/remote-manifest-conditional-get 复验翻绿。**修复后必须重跑全 304-matrix：M6/M2b 现判 SAME 系经「丢弃→日期臂」路径的偶合，语义统一后可能翻面**（L004-304-ping-diff.md Risks ③/Next ①）；随票修 client_conditional.go:8-11/:95-96 与测试文件头三处以参照口吻陈述已证伪行为的注释（Review A N1）

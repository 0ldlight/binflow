- id: docker/remote-credentials-error-shape
  surface: docker remote 坏凭据错误形态（C02：ping 与 token 双端点）
  classification: BUG
  rationale: 参照两端点均回 401 docker errors 数组 pretty "Bad Credentials"（CLI 渲染 unknown:）；BinFlow token 端点回 OAuth2 形态 {"error":"invalid_client",…}、ping 不区分坏凭据与匿名（重挑战）——token 端点错误体应转 errors 数组；ping 重挑战属次要可接受面
  authority: { type: differential, ref: "reports/compatibility/L000-docker-remote-diff.md C02" }
  review_gate: LOOP 001 实现票 L001-1（P2，随错误体族一票收）
  resolved: { date: '2026-09-11', evidence: 'reports/compatibility/L000-docker-remote-diff.md L001-1 复验段（C02 SAME 灭：token 端点 errors 数组形态 + CLI unknown: 指纹逐字；契约条目已翻 VERIFIED）' }
  evidence: reports/compatibility/L000-docker-remote-evidence.md E1-5
- id: docker/remote-anonymous-token-policy
  surface: docker remote /v2/token 匿名请求策略默认值（C03）
  classification: UNKNOWN
  rationale: 参照匿名访问关（无凭据 401 "Authentication is required"）；BinFlow 匿名开（200 签发匿名 token）——实例策略默认值差异，需产品裁定 BinFlow remote 面默认匿名姿态；wire bug 修复后匿名 pull 端到端可对照补证
  authority: { type: pending, ref: "产品/用户裁决（remote 面匿名默认姿态）" }
  review_gate: LOOP 002 限期升级（契约条目 docker/remote-token-anonymous）
  evidence: reports/compatibility/L000-docker-remote-diff.md C03
- id: docker/remote-manifest-404-negative-cache
  surface: docker remote manifest 404 负缓存（C14）
  classification: UNKNOWN
  rationale: BinFlow 首次 miss 上游往返后负缓存（missedRetrievalCachePeriodSecs=1800 生效，重复 miss 40-70ms 本地）；Artifactory 运行时重复 miss 仍每次上游往返（6.6s，配置未见生效）——需参照侧跨 missedTTL 窗复核；若复核仍无负缓存则 BinFlow 符合配置语义且更优，可裁 INTENTIONAL
  authority: { type: pending, ref: "参照实例跨 missedTTL 复核票（LOOP 001 输入 #5）" }
  review_gate: LOOP 002 限期升级（契约条目 docker/remote-manifest-404-no-negative-cache）
  evidence: reports/compatibility/L000-docker-remote-evidence.md E6-3/E3-4
- id: docker/remote-tags-catalog-pagination
  surface: remote tags/list 与 _catalog 的分页参数（n/last/Link 头）
  classification: UNKNOWN
  rationale: >-
    Review A（L001-1）发现的未观察角落：BinFlow remote 面无视 n/last 不回 Link（本地面支持两者、无效 n 400）；
    E7 仅观察裸 GET，Artifactory remote 面分页行为未取证。L002-2 第一手对拍（2026-09-11，registry:3 上游 3 tag）：
    Artifactory remote 面【尊重】n 与 last（?n=2→["t1","t2"]；?n=2&last=t1→["t2","t3"]；无 Link 头回出），
    无效 n=abc→404 pretty status 形态 "Not Found"（非 docker errors 数组）；BinFlow 同参无视（200 全量列表）——
    分歧已实锤为双侧行为差异，不再是观察空白。
  authority: { type: pending, ref: "契约补条目 + 实现裁定（n/last 透传语义 + 无效 n 错误形态）" }
  review_gate: LOOP 003 限期升级
  evidence: reports/compatibility/L002-contract-replay.md 分页取证段

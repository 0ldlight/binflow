# 已知差异台账（四分类：BUG | INTENTIONAL_DIFFERENCE | UNSUPPORTED_FEATURE | UNKNOWN）
# 规则（docs/ai-engineering/compatibility-engineering.md §4）：
#   BUG/UNSUPPORTED 由差分证据+contract 判定；INTENTIONAL 必须 authority（用户裁决/ADR/规格票）；
#   UNKNOWN 限期（默认两程）内必须升级分类。
#   resolved(parity)（conductor 裁定 2026-09-11，LOOP 001）：差分实证**双侧行为一致**的条目按非分歧
#   闭环存证——classification 维持 INTENTIONAL_DIFFERENCE、review_gate=resolved、authority 挂
#   {type: conductor_ruling, ref: <差分报告>}；此类条目不占用四分类语义（它记录的是"无差异"本身）。
# 种子期：M3-2 票将各票「契约漂移登记」与 ADR Errata 差异条款收编为条目。
schema: 1
entries:
- id: docker/remote-url-v2-suffix-silent-404
  surface: 'docker/helmoci remote 仓配置 url 语义（= registry 根，E4: X-Artifactory-Origin-Remote-Path）'   # L001-2 加引号修复存量 YAML 解析错（原 M3-2 裸冒号，非内容变更）
  classification: INTENTIONAL_DIFFERENCE
  rationale: "2026-09-11 L001-3 三形态实测（Artifactory 7.161.20 vs BinFlow UAT，registry:3 上游 + dind 真客户端）：url 带 /v2 或 /v2/ 尾缀时**双侧均双前缀 /v2/v2/ → 404 逐字一致（parity）**——Artifactory 不剥剪/不拒绝/不警告。裁定=BinFlow 照抄即兼容，非实际分歧；条目保留存证防复问。可选超-parity 增强（建仓 WARN 日志，不改行为）留产品单独裁定"
  authority: { type: conductor_ruling, ref: reports/compatibility/L001-url-suffix-evidence.md }
  review_gate: resolved（parity，2026-09-11 conductor 裁定）
- id: docker/remote-cache-layout
  surface: remote blob/manifest 缓存布局（C05：tag 目录/marker/library 归一）
  classification: BUG
  rationale: 差分 C05 DIVERGENT——BinFlow 无 tag 目录/marker/library 归一；Artifactory marker 驱动缓存（E1 downloadBlobFromMarker + E4）
  authority: { type: differential, ref: "reports/compatibility/L000-docker-remote-diff.md C05" }
  review_gate: LOOP 001+ 设计票（缓存语义属 remote-cache-proxy 域架构面）
- id: docker/remote-manifest-headers
  surface: remote manifest 响应头集（C06：Etag/Last-Modified/Origin-Remote-Path 缺席）
  classification: BUG
  rationale: 差分 C06 DIVERGENT——blob 面已一致，manifest 面头集缺
  authority: { type: differential, ref: "reports/compatibility/L000-docker-remote-diff.md C06" }
  review_gate: LOOP 001 实现票
- id: docker/remote-blob-marker-semantics
  surface: remote blob 代取门控（C10：BinFlow digest 盲代理+负缓存 vs Artifactory marker 门控）
  classification: BUG
  rationale: 差分 C10 DIVERGENT——语义级分歧（未拉 manifest 的 digest 是否上游代取），牵动缓存架构，需 remote-cache-v2 设计输入
  authority: { type: differential, ref: "reports/compatibility/L000-docker-remote-diff.md C10" }
  review_gate: LOOP 001 设计票 + 实现票
  resolved: { date: '2026-09-11', evidence: 'L002-1（ADR-0047 DigestChainGate 落地）：链外 digest 本地 404 ~5ms 且上游日志零请求直证（对照修复前盲代理一次上游 404+负缓存）；链内未缓存代取 200；manifest 拉取后门开；契约条目 docker/remote-blob-unknown-digest-404 翻 VERIFIED（diff 复验 L002-1 段）' }
- id: docker/remote-error-shapes
  surface: remote 错误形态族（C11 禁推 405→400 / C12 detail.reference→manifest / C13 detail.digest→blobSum / C15 tags 聚合缺失 / C16 域 404 形态 / D21 url 回显 / P3 service 常量）
  classification: BUG
  rationale: 差分 DIVERGENT 族——同一 remote 面错误契约不齐；Artifactory 侧双错误形态并存为 remote 指纹（evidence 报告）
  authority: { type: differential, ref: "reports/compatibility/L000-docker-remote-diff.md C11-C16/D21" }
  review_gate: LOOP 001 实现票（一票收族）
  resolved:
    date: '2026-09-11'
    evidence: reports/compatibility/L000-docker-remote-diff.md L001-1 复验段（C11/C12/C13/C15/C16/service 七子项全 SAME 灭，verbatim 在案）
    note: >-
      C11-C13/C15/C16 与 service 常量由 L001-1 清偿（契约条目已翻 VERIFIED）；D21 由 L001-5 修复（httpapi 双面）——
      差分复验已回填（L002-2，2026-09-11：UAT uat-l0022-5f9c48d0 上 List 面 `GET /api/repositories` remote 行 url 与
      Detail 面 `GET /api/repositories/{key}` 顶层 url 均回显真实上游 http://host.docker.internal:5588，与 :8082
      同构仓逐字一致；证据 reports/compatibility/L002-contract-replay.md D21 段）。枚举子项零残余，条目结案；伴生登记：
      httpapi router.go:291 no-adapter 兜底挑战 service 仍硬编码（生产装配不可达，不影响对拍面）。

    evidence: >-
      ADR-0050 落地复验（reports/compatibility/L008-update-merge-diff.md §1，uat-l0081b-95b4acad vs :8082）：
      **13 硬断言臂全 SAME**——省略×标量/credential（sealed 行逐字节不动，单元层断言）、null×标量（清空，
      归一化 None≡""）、数组保留（无清空通道）、空值×对象整族复位（A7）、显式值族含 **0-as-absent 双面
      收口**（T-290 联裁翻绿：显式 0 存 0）、url 更新面可省（A9）、console 全量表单回归（A13）、对象族
      新取证格 A14（显式对象=整体替换，未提子键复位 false）/A15（显式 null=整族保留）；**PUT-on-existing
      闭环**：A10 完整体 400 逐字同（errors 信封）+ A11 拒后零副作用 + A12 PUT 新建回归同文案。
    note: >-
      归一化四项（§2，均非本票引入）：cs 输入拼写 nested（参照）/flat（BinFlow，T-317 xsd 锚）——既有
      wire 拼写族；清空格 echo 形（显式空串 vs omitempty 键省略）；customHttpHeaders 席位缺（scenario-D
      未知字段容忍面，补席位则 A4/A6 升格字段级对拍）；password 回显恒排除（NFR-S14 安全姿态，ADR-0050
      决策 4 明示不翻）。留痕不随本账裁（§4）：A16 type 门文案族、A17 authenticated 非 admin 门序（参照
      实例密码策略未取证，缺口留痕）、cs 顶层 enabled 落库拼写未解（L007-3 §3 维持）。矩阵 D02-R03/R04

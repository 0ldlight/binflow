  expect:
    arms:
    - when: '首取'
      status: 200
      headers: { note: 'ETag 值形态双端异（A=31-bit 折迭哈希十进制无引号，空仓 "0"；B=sha256hex 带引号）——PEP 503 只要求 ETag/304 支持，算法私有 opaque；normalize#pypi etag.opaque' }

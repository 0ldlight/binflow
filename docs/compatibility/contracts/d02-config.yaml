    - { kind: difftest, report: reports/compatibility/L025-d02-config-diff.md, anchor: '§5.3 w08 裁处 + §6 行 POST 批改（VERIFIED——w08 单独候裁）', date: '2026-09-17' }
  confidence: high
  status: VERIFIED
- id: d02-config/batch-delete-statemachine
  feature: '批删 207 状态机（空删 400 statusMessage-only；ghost=success:true 逐仓；全 success 聚合 200；blank-key=ghost 形非预校验；三 rclass 成功文案 remote=local 形；reports HashSet 序）'
  surface: 'DELETE <apiBase>/v2/repositories/batch（body=字符串数组）'
  request: { method: DELETE, path: '<apiBase>/v2/repositories/batch', body: '["a","b"]（重复去重保序）' }
  authentication: { type: basic, role: 'admin（无删除权=预校验整单 403 单报告）' }
  expect:
    status: '200（全部 success 含全 ghost）/207（真混合——开放未活体）/首失败码（全败——开放）'
    body: '{"reports":[{repoKey,statusMsg,deletedArtifactsCount,success}],statusMessage}；reports 序=HashSet 不稳（Q4 集合序断言）'
    literal_lines: "成功=Repository '<k>' and all its content have been removed successfully.（local/remote/federated）/ Repository '<k>' has been removed successfully.（virtual）/ ghost=Cannot delete repository: '<k>', repository config does not exist / 聚合=All repositories were removed successfully / Some repositories failed to be removed"
  error_behavior:
    - { when: '空数组/缺 body', status: 400, literal_body: '{"statusMessage":"No repository keys were provided for deletion"}（无 reports）' }
    - { when: 'blank key ""', status: 200, literal_body: "ghost 逐仓形（L025-4 四臂定谳——spec §2.1.7-2 预校验中止被证伪；G2 已修：L025-5 256571d1 落位，§5.2 w12 双端 200 逐仓 ghost 形逐字同）" }
    - { when: '无删除权', status: 403, literal_body: "单报告 Cannot delete repository: '<k>', Reason: User: ('<u>') has insufficient permission to delete repositories: <k>（existing 臂双端逐字同；ghost 臂检查次序差=G9-R2 登记 known-divergence#d02/plain-user-403-family 候 R-25b）" }
  binflow_state:
    verdict: 'SAME（状态机可达臂终轮全绿：w09/w10/w11/w13 + w12〔G2 修复 §5.2〕+ Q4 集合化 w11/w14 行集全等）；G7 真 207/全败/失败报告值域=不可安全构造维持开放备案（B 单测注入在案）'
    detail: 'w13-ghost 检查次序残面（A=存在性先行 200 ghost / B=权限预校验先行 403）归 plain-user 403 族候裁，不挡 VERIFIED'
    divergence_ref: 'known-divergence.yaml#d02/plain-user-403-family（w13-ghost 臂）；G7=开放备案非登记项'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.b79a2d51 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L025-d02-config-diff.md, anchor: '§1 w09-w14 + §2 G2/G7', date: '2026-09-17' }
    - { kind: difftest, report: reports/compatibility/L025-d02-config-diff.md, anchor: '§5.2 DELETE blank-key 臂 SAME + §5.3 w11/w14/w13 裁处 + §6 行 DELETE（VERIFIED）', date: '2026-09-17' }
  confidence: high
  status: VERIFIED
- id: d02-config/v2-read
  feature: 'v2 单仓读（type 键方言/CT vendor/no-store/404 信封/CT-非-Accept 协商 406/非 admin 五键）'

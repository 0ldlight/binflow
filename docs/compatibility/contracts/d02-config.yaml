  version: { artifactory_ref: 7.161.15, binflow_tested: dev.b79a2d51 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L025-d02-config-diff.md, anchor: '§1 v01-v05', date: '2026-09-17' }
    - { kind: difftest, report: reports/compatibility/L025-d02-config-diff.md, anchor: '§5.1 四层键集 v2 层 + §5.3 v03 显式 CT 重探 + §6 行 v2 单仓读', date: '2026-09-17' }
  confidence: high
  status: VERIFIED

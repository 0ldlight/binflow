#   （SPECIFIED）——optionalIndexCompressionFormats 定谳：deb 族包型条件键（v1 local 面唯一条件键）、
#   新仓默认 []（Runtime 实测 > 反编译——debian.md §40 默认 ["bz2"] 勘误候选，见新条目注记）；

    detail: '共享面基线零差：A generic 61/61、18/18 键名与值级全同（仅 key 实例值差）——L025-6 渲染器已达平；分歧面=deb 条件键 4 席（v1×1+v2×3）+值级 1 席'
    divergence_ref: 'known-divergence.yaml#d02/deb-default-key-family（候实现票+pro 档差分复验——只登记不实现）'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.b79a2d51 }

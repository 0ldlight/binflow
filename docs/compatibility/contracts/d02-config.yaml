  authentication: { type: basic, role: 'admin 全量 / 非 admin 五键 {key,type,packageType,description,url}' }
  expect: { status: 200, 'content-type': 'application/vnd.org.jfrog.artifactory.repositories.<Rclass>RepositoryConfiguration+json', 'cache-control': no-store }
  error_behavior:

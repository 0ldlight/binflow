    status: 200
    body:
      format: json
      shape: '有属性行 properties:[{"key":<k>},…]（**仅 key 键无 value**）；无属性行 properties 整键省略（推论：include("property.value") → {"value":<v>}——待活体）'
  side_effects: []
  error_behavior: []
  binflow_state:
    verdict: 'DIVERGENT（两面）'
    detail: 'L5=B 有属性行回完整 {key,value} 对（应 key-only）；无属性行回 []（应省键）'
    divergence_ref: 'L024-search-aql-diff.md L5'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.52c9ba42 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L024-search-aql-diff.md, anchor: '§2.5 q03', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT

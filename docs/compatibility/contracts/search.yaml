# BinFlow 兼容契约——D03 搜索族 + AQL jf 面（search 域首文件，L024-4 蓝本，2026-09-15）
# schema: compat-contract/1 —— 条目键面全集：
#   id/feature/surface/request/authentication/expect/side_effects/error_behavior/version/evidence/
#   confidence/status（+binflow_state 记差分现值；divergence_ref 于 DIVERGENT/INTENTIONAL 必填）。
# 作者注：本文件为 L024-4（differential-qa-engineer）据双端活体 wire 起草的蓝本，条目状态为差分现值
#   记录；入册与翻态裁定权在 compatibility-engineer。证据面=L024 双端（A=Artifactory pro 7.161.15
#   :8082 / B=BinFlow dev dev.52c9ba42 :8083），24 判定单元 + jf 2.122.0 真腿。
#   差分报告=reports/compatibility/L024-search-aql-diff.md（D-item=L1..L9）。
# 归一依赖（提案 fixtures/normalize.yaml#search，报告 §1 S1-S4）：
#   S1 头 drop+json-family 等价 / S2 绝对 URL 占位 / S3 AQL created/modified 时钟 shape /
#   S4 AQL 无 .sort() 行序+properties 元素序集合化（提案——aql.md §16.1-3 参照自不稳）。
# 面外维持：/api/search/archive（R14 not_applicable 已裁）、docker manifests 旧挂载（R18）、
#   usage/creation/dates/props/artifact 大搜索族（先批差分）、gavc/pattern（已有仓面）。
domain: search
scope: D03-R10/R11/R12/R13 四端点 + AQL jf 逐字面（§16.1 必答查询）+ property.key 展开式。
  证据面=L024-4 双端活体（curl 差分 24 单元 + jf build-publish 真腿 + ssh 容器内 blob 坏化/审计日志）。
normalize: fixtures/normalize.yaml#search（提案——L024-search-aql-diff.md §1）
reference_instance: 'Artifactory pro 7.161.15（http://172.16.58.130:8082，admin）'
binflow_tested_instance: 'BinFlow dev dev.52c9ba42（http://172.16.58.130:8083，admin；L024-3A 交付后）'
client_anchor: 'jf 2.122.0（upload/build-publish 真腿）+ curl 差分族'
contracts:
# ── versions ────────────────────────────────────────────────────────────────
- id: search/versions
  feature: 'GET /api/search/versions（两键瘦行新→旧；通配先全集后过滤；404 逐字；字面 SNAPSHOT 行=字面串）'
  surface: 'GET <apiBase>/search/versions?g=&a=&v=&repos=&remote='
  request: { method: GET, path: '<apiBase>/search/versions', headers: { Authorization: 'Basic <valid>' }, query: { g: 必, a: 必, v: '可选 * / ? 通配', repos: 'CSV 可选', remote: 'int 1=含远端' } }
  authentication: { type: basic, role: read }
  expect:
    status: 200
    body:
      format: json
      shape: 'results[]={"version":<串>,"integration":<bool>} 两键瘦行（无 uri）；按版本新→旧'
      ordering: '版本新→旧'
      note: >-
        通配 v=先查全集后按 pattern 过滤（过滤后空集=200 results:[]）；字面 -SNAPSHOT 文件名直传 → 行=字面串
        integration:true（展开形仅当文件以时间戳名存储）；时间戳名文件行=展开形 integration:false
    content_type_note: 'vendor CT vnd.org.jfrog.artifactory.search.ArtifactVersionsResult+json（json-family 等价 PN）'
  side_effects: []
  error_behavior:
    - { when: '无任何命中', status: 404, literal_body: 'errors[] 信封 Unable to find artifact versions' }
  binflow_state:
    verdict: 'DIVERGENT（单面：字面 SNAPSHOT 行 B 回 metadata 展开形）'
    detail: '404 逐字/通配/后置过滤空集/repos 限定四单元双绿；L1=字面 1.1-SNAPSHOT 文件行 A 回字面串、B 回 1.1-20260915.192244-1（metadata 展开）'
    divergence_ref: 'L024-search-aql-diff.md L1'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.52c9ba42 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L024-search-aql-diff.md, anchor: '§2.1 v01-v05', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT
# ── latestVersion ───────────────────────────────────────────────────────────
- id: search/latest-version
  feature: 'GET /api/search/latestVersion（text/plain 裸版本串；v 缺省=最新 release；通配首命中；非通配=线 integration 无连字符拼接；三 404 逐字）'
  surface: 'GET <apiBase>/search/latestVersion?g=&a=&v=&repos=&remote=&exact='
  request: { method: GET, path: '<apiBase>/search/latestVersion', headers: { Authorization: 'Basic <valid>' }, query: { v: '缺省/通配/非通配三态' } }
  authentication: { type: basic, role: read }
  expect:
    status: 200
    body:
      format: text
      literal: '版本号裸串（非 JSON）——v 缺省=首个 integration=false；v 通配=首个 pattern 命中；v 非通配=v+<maven-metadata 快照时间戳>+"-1" 无连字符拼接（如 v=1.1 → 1.120260915.192244-1）'
  side_effects: []
  error_behavior:
    - { when: 'v 缺省但无任何 release', status: 404, literal_body: 'errors[] 信封 Latest release version not found' }
    - { when: 'v 通配无命中', status: 404, literal_body: 'errors[] 信封 Latest integration version not found' }
    - { when: '无任何版本命中（含 v 非通配无线）', status: 404, literal_body: 'errors[] 信封 Unable to find artifact versions' }
  binflow_state:
    verdict: 'DIVERGENT（单面：非通配拼接带连字符）'
    detail: 'l01/l02/l04/l05/l06 五单元逐字双绿（V-y 两深层 404 活体收口）；L2=l03 A 回 1.120260915.192244-1（无连字符拼接怪癖=参照真值）、B 回 1.1-20260915.192244-1'
    divergence_ref: 'L024-search-aql-diff.md L2'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.52c9ba42 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L024-search-aql-diff.md, anchor: '§2.2 l01-l06', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT
# ── /api/versions/{repoKey}/{path}（最新版本按属性） ────────────────────────
- id: search/versions-by-properties
  feature: 'GET /api/versions/{repoKey}/{path}（小写 version 属性为版本源；listFiles=1 尾逗号非严格 JSON 怪癖；_any 通配；404 裸 Not Found）'
  surface: 'GET <apiBase>/versions/{repoKey}/{path}[?listFiles=1]'
  request: { method: GET, path: '<apiBase>/versions/<repoKey>/<path>', headers: { Authorization: 'Basic <valid>' }, query: { listFiles: '缺省/0=空 artifacts；1=行清单' } }
  authentication: { type: basic, role: 'authenticated（匿名 401）+ 仓 read' }
  expect:
    status: 200
    body:
      format: text
      literal: >-
        缺省：{"version" : "<最新>","artifacts" : [ ]}（空数组非省略）；listFiles=1：artifacts 行={"repo","path"}
        两键、**每行 path 值后尾逗号**（含末行，非严格 JSON）+ 行分隔符 "}, {"（逗号+空格）——产出非法 JSON，
        消费方须按文本处理（官方文档示例 uri 键与实际不符——以活体为准）
  side_effects: []
  error_behavior:
    - { when: '无命中', status: 404, literal_body: 'errors[] 信封 Not Found（裸文案）' }
    - { when: '匿名', status: 401, ref: '#known-401-wording-family' }
  binflow_state:
    verdict: 'DIVERGENT（仅一字节分隔符 + 既有 401 族）'
    detail: '默认形逐字节双绿；尾逗号怪癖双绿（V-aa 多行定谳：每行恒现）；L3=行分隔符 B "},{" 应为 "}, {"；匿名臂属 L020-3 既有裁定族'
    divergence_ref: 'L024-search-aql-diff.md L3/L9'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.52c9ba42 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L024-search-aql-diff.md, anchor: '§2.3 p01-p04', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT
# ── badChecksum ─────────────────────────────────────────────────────────────
- id: search/bad-checksum
  feature: 'GET /api/search/badChecksum?type=&repos=（admin 专属；DB client-vs-server 对比语义——missing client=bad、不实扫字节；平铺行形+limitReached；双 400 逐字；上限 10,000）'
  surface: 'GET <apiBase>/search/badChecksum?type=<md5|sha1>&repos=<CSV>'
  request: { method: GET, path: '<apiBase>/search/badChecksum', headers: { Authorization: 'Basic <admin>' }, query: { type: 必, repos: 'CSV 可选' } }
  authentication: { type: basic, role: admin }
  expect:
    status: 200
    body:
      format: json
      shape: >-
        {"results":[{"uri":…,"server<Type>":<登记值>,"client<Type>":<client 值，缺省 "">},…],
        "limitReached":<bool>}——**平铺三键**（非嵌套 checksums 对）；语义=DB 内 client-vs-server 对比：
        client 缺失（""）即 bad；**真坏 blob 字节不触发**（四点 od 实证：client==server 的坏文件不旗标）；
        uri 键按仓出现差异（mvn/props 仓行带、generic bad 仓行不带——待反编译复核）
  side_effects: []
  error_behavior:
    - { when: 'type 缺失', status: 400, literal_body: 'errors[] 信封 No checksum type defined' }
    - { when: 'type 非法（如 sha512）', status: 400, literal_body: 'errors[] 信封 Checksum type: <t> is not defined' }
    - { when: '非 admin', status: 403 }
    - { when: '匿名', status: 401, ref: '#known-401-wording-family' }
  binflow_state:
    verdict: 'DIVERGENT（语义+行形双面）'
    detail: '双 400 逐字双绿；L4=①语义：B 实扫字节（真坏触发=超集检测；missing client 不触发）②行形：B 嵌套 checksums{expected,actual} 无 limitReached。按被证伪的 V-z 实现需返工（aql.md §16.5 V-z 勘误输入）'
    divergence_ref: 'L024-search-aql-diff.md L4'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.52c9ba42 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L024-search-aql-diff.md, anchor: '§2.4 b01-b05（含 ssh 坏化四 blob od 复核）', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT
# ── AQL jf 逐字面（§16.1 必答查询） ─────────────────────────────────────────
- id: search/aql-jf-verbatim
  feature: 'jf build-publish 实发 AQL（include 裸 property → properties 键值对象数组；path $ne "." 排根级；无属性整键省略；九字段回显）'
  surface: 'POST <apiBase>/search/aql（Content-Type: text/plain；AQL 文本体）'
  request:
    method: POST
    path: '<apiBase>/search/aql'
    headers: { Authorization: 'Basic <valid>', Content-Type: text/plain }
    body: 'items.find({"path":{"$ne":"."},"$or":[{"$and":[{"repo":<r>,"path":<p>,"name":<n>}]}]}).include("name","repo","path","actual_md5","actual_sha1","sha256","size","type","modified","created","property")'
  authentication: { type: basic, role: read }
  expect:
    status: 200
    body:
      format: json
      shape: >-
        {results,range} 标准 envelope；行含十字段（modified/created ISO8601 毫秒 Z；size 数字；type 小写）+
        有属性行 properties:[{"key","value"}×N]（**元素序不稳定**——集合序断言）；无属性行 properties 整键省略；
        根级文件 path="." 被 $ne 正确排除
  side_effects: []
  error_behavior:
    - { when: '查询非法', status: 400, note: 'B 历史断链 Unknown AQL field: property 已闭合（L023 D11→本轮 200 实证）' }
  binflow_state:
    verdict: 'SAME（S4 集合序归一后；残余 L6/L8 挂账）'
    detail: '§16.1 逐字查询内容集合双绿（properties 三键值对/md5/sha1/十字段）；L6=B created/modified 毫秒恒 .000（截断）；L8 下游=wheel 行 vcs.* 缺（setItemProperties 未实现的 AQL 可见面）'
    divergence_ref: 'L024-search-aql-diff.md L6/L8'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.52c9ba42 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L024-search-aql-diff.md, anchor: '§2.5 q01/q02', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT
# ── AQL property.key 展开式 ──────────────────────────────────────────────────
- id: search/aql-property-include-forms
  feature: 'include("property.key") → key-only 对象投影；无属性行省键（§2.3 展开式语义）'
  surface: 'POST <apiBase>/search/aql（.include("name","property.key")）'
  request: { method: POST, path: '<apiBase>/search/aql', headers: { Authorization: 'Basic <valid>', 'Content-Type': text/plain }, body: 'items.find({…}).include("name","property.key")' }
  authentication: { type: basic, role: read }

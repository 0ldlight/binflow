- id: docker/remote-tags-list-pagination
  feature: 'tags/list 分页参数透传（n 截断/last 游标/Link rel=next；无效 n 404）'
  surface: 'GET /v2/<repoKey>/<image>/tags/list?n=<int>[&last=<tag>]'
  request:
    method: GET
    path: '/v2/<repoKey>/<image>/tags/list'
    headers: { Authorization: 'Bearer <token>' }
    query: { n: '<正整数>', last: '<游标 tag，可选>' }
  authentication: { type: bearer, role: user }
  expect:
    arms:
    - when: '?n=2（结果截断，上游实有更多）'
      status: 200
      headers:
        pattern:
          Link: '^</v2/<repoKey>/<image>/tags/list\?last=[^&]+&n=\d+>; rel="next"$'
        present: [Content-Type]
        absent: []
      body: { format: pretty, json: { keys_exact: [name, tags], note: 'name=<上游回显名>；tags=截断窗口（如 3 tag 取前 2）' } }
    - when: '?n=2&last=t1（游标推进至尾页）'
      status: 200
      headers: { present: [Content-Type], absent: [Link] }
      body: { format: pretty, json: { keys_exact: [name, tags], note: 'tags=窗口余量（如 ["t2","t3"]），尾页无 Link' } }
    - when: '?n=abc（无效 n）'
      status: 404
      headers: { literal: { Content-Type: application/json }, absent: [] }
      body:
        format: pretty
        json:
          keys_exact: [errors]
          path_literal:
            errors[0].status: 404
            errors[0].message: Not Found
          keys_absent_at_errors0: [code, detail]
          note: '通用错误模型形态随 E5-4 指纹（wrapper 形非本轮 verbatim，message/status 为报告引用值）；Content-Type 裸 application/json（无 charset——charset 仅 ping 401 臂）'
      timing: { upstream_rtt: false, note: '本地先于上游接触（单测 hits=0 直证）' }
    - when: '裸 GET（无参数）'
      ref: docker/remote-tags-list
  side_effects: []
  error_behavior: []
  binflow_state:
    verdict: SAME
    detail: 'L003 双端活体四臂一致（Link 逐字节，f_tags* vs a_tagsn/a_tagsl/a_tagsinv）。勘误存证：L002-2 报告分页表「无 Link 头」行与其自身原始捕获（/tmp/l0022/a_tagsn.h 实带 Link）矛盾——Artifactory remote 面截断即发 Link，该行系笔误（以裸 GET 行推全表）；L003-2 按 ground truth 实现。未观察角落（实现自决不立断言）：n=0/负数按非正整数并入 404 家族'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.952e556d }
  evidence:
    - { kind: difftest, report: reports/compatibility/L002-contract-replay.md, anchor: 分页第一手取证段（Artifactory 尊重 n/last；BinFlow 当时无视——分歧实锤）, date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L003-remote-face-diff.md, anchor: ④ 分页透传（tags 四臂双端活体表 + Link 笔误勘误）, date: '2026-09-11' }
  confidence: high
  status: VERIFIED

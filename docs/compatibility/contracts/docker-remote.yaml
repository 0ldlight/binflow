# ── L5/L6：manifest 拉取 ─────────────────────────────────────────────────────
- id: docker/remote-manifest-get-tag
  feature: 'manifest GET by tag（Bearer；Accept 含 list 类型 → 存 list.manifest.json）'
  surface: 'GET /v2/<repoKey>/<image>/manifests/<tag>'
  request:
    method: GET
    path: '/v2/<repoKey>/<image>/manifests/<tag>'
    headers: { Authorization: 'Bearer <token>', Accept: 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, …' }
    query: {}
  authentication: { type: bearer, role: user }
  expect:
    status: 200
    headers:
      literal:
        Accept-Ranges: bytes
        Content-Disposition: 'attachment; filename="manifest.json"'   # L003 双端活体值；E2-3 的「attachment」为缩记勘正
        Docker-Distribution-Api-Version: registry/2.0
      pattern:
        Content-Type: '^(application/vnd\.oci\.image\.index\.v1\+json|application/vnd\.docker\.distribution\.manifest\.list\.v2\+json|application/vnd\.docker\.distribution\.manifest\.v2\+json)$（随 Accept 协商）'
        X-Artifactory-Filename: '^(list\.)?manifest\.json$'
        X-Artifactory-Origin-Remote-Path: '^https?://[^"]+/v2/<image-normalized>/manifests/<tag-or-digest>$'
      derived:
        Etag: etag_is_sha1
        Last-Modified: manifest_last_modified_is_fetch_time
      present: [Docker-Content-Digest, X-Checksum-Md5, X-Checksum-Sha1, X-Checksum-Sha256, X-Artifactory-Filename, X-Artifactory-Origin-Remote-Path]
      absent: []
    body:
      format: any
      json: { note: 'manifest 内容原样（Content-Type 随 Accept list/单构协商）；body 校验按 sha256 锚定 fixture，本条目未固化 fixture（见 risks）' }
  side_effects:
    - '首次命中：代取上游 + 落缓存 <repoKey>-cache（tag 路径 list.manifest.json/manifest.json + digest 路径 sha256__ 命名 + config/layers marker 预写 createManifestMarkers）'
    - '缓存布局形态见 golden 与 known-divergence docker/remote-cache-layout（C05 DIVERGENT）'
  error_behavior:
    - { when: '不存在 tag / 不存在镜像', ref: docker/remote-manifest-unknown-404 }
    - { when: '上游 304（Artifactory 以自身 ETag 对上游条件 GET）', status: 304, note: '仅上游回源链路可触发；客户端 INM 头与此判定无关（E3-3，E1 待动态复证）' }
  binflow_state:
    verdict: SAME
    detail: 'L003 双端活体逐头逐值（f_mf.h vs a_mf.h，fresh MISS 同参数同刻）：Accept-Ranges/Content-Disposition(filename)/Etag(=sha1 无引号)/Last-Modified(=拉取时刻，与 Date 同秒)/X-Artifactory-Filename/Origin-Remote-Path(请求引用逐字回显)/Checksum 三值/Docker-Content-Digest 全一致；body sha256==上游回执==Docker-Content-Digest，Etag 经 shasum 独立核算。HIT 面头集不缩水（二拉全套 face 维持）。X-Binflow-Cache/X-Request-Id 超集 tolerated'
    witness: '原 C06 DIVERGENT（L000-F）→L002-2 全维对照显性化→L003-2 实现清偿双端活体过'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.952e556d }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E2-2/E2-3, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: 'C06（L000-F 复验段）', date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L003-remote-face-diff.md, anchor: '① C06+#11 manifest/blob 头集（双端活体逐头表）', date: '2026-09-11' }
  confidence: high
  status: VERIFIED
- id: docker/remote-manifest-head-digest
  feature: 'manifest HEAD by digest（dockerHeadManifestEnabled=true 快路径）'
  surface: 'HEAD /v2/<repoKey>/<image>/manifests/sha256:<digest>'
  request:
    method: HEAD
    path: '/v2/<repoKey>/<image>/manifests/sha256:<digest>'
    headers: { Authorization: 'Bearer <token>' }
    query: {}
  authentication: { type: bearer, role: user }
  expect:
    status: 200
    headers:
      literal:
        X-Artifactory-Docker-Registry: '<repoKey>'
      present: [Docker-Content-Digest, Last-Modified]
      absent: []
      note: >-
        expect 收窄至参照活体窄集（a_mfh 两轮复现：仅 Docker-Content-Digest/Last-Modified/X-Artifactory-Docker-Registry，
        无 Etag/校验和族）——E2-4「同 GET 全集+Registry 头」口径被 L002-2/L003 活体推翻（escalation #3 在案）。
        BinFlow 现状 = 参照窄集 + GET 全集超集（Etag/校验和族/Filename/Origin-Remote-Path——对参照活体为超集，
        按 normalize superset_policy tolerated_and_note，不判 DIVERGENT；条目无 absent 断言故两口径均过）
    body: { format: none }
  side_effects: []
  error_behavior:
    - { when: 'digest 不存在', ref: docker/remote-manifest-unknown-404 }
  binflow_state:
    verdict: SAME
    detail: 'L003 双端活体：BinFlow HEAD = 参照活体窄集（Docker-Content-Digest/Last-Modified/X-Artifactory-Docker-Registry=<repoKey>）+ GET 全集超集——按「窄集 expect + 超集 tolerated」口径复核翻绿'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.952e556d }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E2-4, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: 'C06（L000-F 复验段）', date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L003-remote-face-diff.md, anchor: '① manifest HEAD（by digest）窄集+超集口径段', date: '2026-09-11' }
  confidence: high
  status: VERIFIED
- id: docker/remote-manifest-conditional-get
  feature: 'manifest 条件请求（If-None-Match 不消费，恒 200 全量）'
  surface: 'GET|HEAD /v2/<repoKey>/<image>/manifests/<ref> + If-None-Match'

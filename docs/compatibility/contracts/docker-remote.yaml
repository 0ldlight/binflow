# BinFlow 兼容契约——docker remote 代理 v2 面（首份契约，L001-2，2026-09-11）
# schema: compat-contract/1 —— 源模式 docs/ai-engineering/compatibility-engineering.md §2（单契约文件）；
#   本文件为同域多条目单文件扩展（任务票 L001-2 指定路径），条目键面沿 §2 全集：
#   id/feature/surface/request/authentication/expect/side_effects/error_behavior/version/evidence/
#   confidence/status（+binflow_state 记录差分现值，divergence_ref/golden_candidate 按需）。
# 可执行断言词汇表（供 tools/difftest 消费判定 SAME/DIVERGENT；归一先行，规则见 fixtures/normalize.yaml）：
#   expect.status            — 精确 HTTP 状态码
#   expect.headers.literal   — 头名 → 精确值（头名大小写不敏感）
#   expect.headers.pattern   — 头名 → 锚定正则
#   expect.headers.present   — 必须存在（值实例可变）
#   expect.headers.absent    — 必须不存在
#   expect.headers.derived   — 头名 → 派生规则 id（规则表见本文件 derived_rules）
#   expect.body.format       — 线格式 compact（无填充）/ pretty（Jackson 缩进）——可观察、参与判定
#   expect.body.literal      — 整体 body 精确线字节（小 body；源报告逐字存档）
#   expect.body.json         — 结构断言：keys_exact/keys_present/keys_absent/path_literal（点路径→标量精确值）
#   expect.timing            — { upstream_rtt: bool, max_ms: int }——上游往返语义（差分时以对拍实例日志+耗时双重判）
#   error_behavior[].ref     — 指向同域兄弟条目 id（不重复展开错误体）
# verdict 推导：归一后全部启用断言通过 = SAME；任一失败 = DIVERGENT。
# evidence kind：probe=参照实例运行观察（evidence 报告 E4）/ difftest=双系统差分（diff 报告 case）。
derived_rules:
  service_equals_request_host: 'WWW-Authenticate service 段 = 请求 Host 头回显（C01 分歧点）'
  etag_is_sha1: 'Etag 值 = X-Checksum-Sha1（无引号 sha1 形态，L003 双端活体直证；E2-3 未记引号形态）'
  manifest_last_modified_is_fetch_time: 'manifest Last-Modified = 本次落缓存拉取时刻（非上游 mtime；E2-3）'
  token_is_jwt: 'token 值为 JWT 形态（前缀 eyJ…，运行时 B 版实见 eyJ2ZXIiOiIy）'
domain: docker-remote
scope: remote 仓（rclass=remote, packageType=docker）repo-path 访问形态——registry host=<host>:<port>，
  镜像名首段=repoKey；Artifactory 侧 router rewrite /v2/<repoKey>/… → /api/docker/<repoKey>/v2/…。
  不含 local/virtual 面、不含 /api/docker/{repoKey} API 面（promote/listTag 等——见 matrix D12-R02，本契约未覆盖）。
  仅收 L000 差分证据覆盖面；未观察行为不立断言（E1-only 项逐条标注）。
normalize: fixtures/normalize.yaml#docker-remote
reference_instance: 'Artifactory-pro 7.161.20 (revision 86120900, package_handler 5.675.40)，http://localhost:8082'
binflow_tested_instance: 'BinFlow UAT uat-l000f-59f33ab5（L000-F 复验）→ uat-l0011-f80c46aa（L001-1 复验，develop f80c46aa；均 http://localhost:8083 容器 binflow-ga 同卷）→ uat-l0041-worktree（L004-1 复验，c81119b7+工作树——镜像含新 ping 消息字面量，strings 在案）'
upstreams_witnessed: 'docker.io（主证据腿）+ 本地 registry:3 127.0.0.1:5588（同源对拍腿，L000-F）'
contracts:
# ── L4 Auth：ping / token ────────────────────────────────────────────────────
- id: docker/remote-v2-ping-anonymous
  feature: '/v2/ ping 匿名挑战（repo-path 兜底，remote 仓自答不代理上游 auth）'
  surface: 'GET /v2/'
  request: { method: GET, path: /v2/, headers: {}, query: {} }
  authentication: { type: none, role: anonymous }
  expect:
    status: 401
    headers:
      literal:
        Docker-Distribution-Api-Version: registry/2.0
        Content-Type: application/json;charset=ISO-8859-1
      pattern:
        WWW-Authenticate: '^Bearer realm="https?://[^"]+/v2/token",service="[^"]+"$'
      derived:
        WWW-Authenticate.service: service_equals_request_host
      present: []
      absent: []
    body:
      format: compact
      literal: '{"errors":[{"code":"UNAUTHORIZED","message":"authentication required","detail":null}]}'
  side_effects: []
  error_behavior: []
  binflow_state:
    verdict: SAME
    detail: 'L001-1 复验（灭）：service=host 回显；body 不变。L003 双端活体逐头复核（a_ping.h）：charset=ISO-8859-1 + Bearer 挑战 + compact UNAUTHORIZED 逐字——X-Request-Id 超集 tolerated。charset 形态仅 ping 两 401 臂（全捕获面其余均裸 application/json，实现按此收窄）'
    witness: '原 C01 DIVERGENT→L001-1 SAME→L003 charset 断言双端活体过（L002-2 曾显性化该维度缺口，L003-2 清偿）'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.952e556d }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E1-1/E1-2, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: 'C01（L001-1 复验段，灭）', date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L003-remote-face-diff.md, anchor: '② #1 ping Content-Type charset（双端活体）', date: '2026-09-11' }
  confidence: high
  status: VERIFIED
- id: docker/remote-v2-ping-bad-credentials
  feature: '/v2/ ping 拒绝凭据四臂消息矩阵（L004-1 泛化：坏 Basic / unknown bearer / expired bearer / revoked bearer；id 保留防历史报告引用断链）'
  surface: 'GET /v2/ + Authorization: Basic <bad> | Bearer <unknown> | Bearer <expired> | Bearer <revoked>'
  request:
    method: GET
    path: /v2/
    headers: { Authorization: '按臂：Basic <bad> / Bearer <token-各拒因>' }
    query: {}
  authentication: { type: 'basic|bearer', role: any, credential_state: 'invalid-按类分型（unknown/expired/revoked）' }
  expect:
    arms:
    - when: 'Basic <bad-credentials>（P1）'
      status: 401
      headers:
        pattern: { WWW-Authenticate: '^Basic realm="Artifactory Realm"$' }
        literal: { Content-Type: application/json;charset=ISO-8859-1 }
        present: []
        absent: []
      body:
        format: pretty
        json:
          keys_exact: [errors]
          path_literal:
            errors[0].status: 401
            'errors[0].message': Bad Credentials
          keys_absent_at_errors0: [code, detail]
    - when: 'Bearer <unknown-value>（P2）'
      status: 401
      headers: { note: '同 P1 挑战头/CT（Basic realm + charset）' }
      body:
        format: pretty
        json:
          path_literal: { 'errors[0].message': Props Authentication Token not found }
          note: '与 P1 同形不同消息——凭据类分型'
    - when: 'Bearer <expired>（P3）'
      status: 401
      headers: { note: '同 P1/P2 头面' }
      body:
        format: pretty
        json:
          path_literal: { 'errors[0].message': 'Token failed verification: expired' }
    - when: 'Bearer <revoked>（P4b）'
      status: 401
      headers: { note: '同族头面' }
      body:
        format: pretty
        json:
          path_literal: { 'errors[0].message': 'Token failed verification: revoked' }
          note: '参照臂（吊销态可验模型）；BinFlow revoke=删行 → 此臂不可达（恒走 P2 消息）——模型级差异 D2'
    note: >-
      pretty JSON 方言差异（Jackson 折叠式 vs Go Encoder 展开式，80B vs 90B）为既有 accepted 指纹（N3，
      同一 writer 早于本票即此形态）；api-version 头超集 tolerated（L003 起）。
  side_effects: []
  error_behavior: []
  binflow_state:
    verdict: 'SAME×3 + DIVERGENT×1（P4b revoked 臂，模型级）'
    detail: 'L004-1 双端活体（uat-l0041-worktree）：P1/P2/P3 三臂消息串逐字节一致（Bad Credentials / Props Authentication Token not found / Token failed verification: expired），挑战头+charset CT 一致——known-divergence docker/remote-ping-credential-class-message-granularity 就此清偿（L004-1 实现分型）。P4b：参照 "Token failed verification: revoked" vs BinFlow "Props Authentication Token not found"（revoke=删行使 revoked 验定恒走 unknown 臂）——第四臂在 BinFlow 模型下不可达，D2 挂 known-divergence 待产品裁（对齐需吊销态可验模型）。泛化史：原条目=Basic 坏凭据单臂（L001-2 立，L003 勘误 expect 锚 Basic realm），L004-1 扩四臂'
    witness: 'P2/P3 分型 known-divergence（UNKNOWN）→ L004-1 实现落地 → 本轮双端活体三臂逐字节 SAME；revoked 臂新立 D2'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.l0041-worktree }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E1-5, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: 'C02（L001-1 复验段，灭）', date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L003-remote-face-diff.md, anchor: '③ #2 ping 坏凭据臂（双端活体逐字）', date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L004-304-ping-diff.md, anchor: '§4 ping 消息臂（P1-P4b 四臂逐字 + revoked 模型级差异）', date: '2026-09-12' }
  confidence: high
  status: DIVERGENT
  divergence_ref: known-divergence.yaml#docker/remote-v2-ping-revoked-arm-unreachable
- id: docker/remote-token-issue
  feature: '/v2/token 签发（有效 Basic 凭据）'
  surface: 'GET /v2/token?service=<host:port>&scope=repository:<repoKey>/<image>:pull&account=<user>'
  request:
    method: GET
    path: /v2/token
    headers: { Authorization: 'Basic <valid>' }
    query: { service: '<host:port>', scope: 'repository:<repoKey>/<image>:pull', account: '<user>' }
  authentication: { type: basic, role: user }
  expect:
    status: 200
    headers:
      present: [Content-Type]
      absent: [Docker-Distribution-Api-Version]
    body:
      format: any
      json:
        keys_exact: [token, expires_in]
        keys_absent: [issued_at, access_token, scope]
        path_literal:
          expires_in: 9000
      derived:
        token: token_is_jwt
  side_effects: []
  error_behavior:
    - { when: 'scope 逐项不校验（原样收，权限在资源端点判）', ref: evidence-E1-6 }
  binflow_state:
    verdict: DIVERGENT
    detail: 'BinFlow {token, access_token, expires_in:2592000, issued_at, scope}，token 不透明 hex 非 JWT；docker CLI 实测登录/拉取均兼容（超集字段不破坏客户端）——对齐方向（9000/JWT）待 authority 裁定'
    reverify_after: '待裁（LOOP 001 输入 #5，非 L001-1 修复项）'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.59f33ab5 }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E1-3/E1-6, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: C01b, date: '2026-09-11' }
  confidence: high
  status: DIVERGENT
  divergence_ref: known-divergence.yaml#docker/remote-token-response-shape
- id: docker/remote-token-bad-credentials
  feature: '/v2/token 坏凭据（docker errors 数组形态）'
  surface: 'GET /v2/token?… + Authorization: Basic <bad>'

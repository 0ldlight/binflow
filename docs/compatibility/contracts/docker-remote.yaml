  version: { artifactory_ref: 7.161.20, binflow_tested: uat.59f33ab5 }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E3-2/E3-3, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: 'C08（L000-F 复验段）', date: '2026-09-11' }
  confidence: high
  status: VERIFIED
- id: docker/remote-pull-sequence
  feature: '真实客户端端到端拉取序列（ping→token→manifest→config blob→layer blob→exit 0，digest 逐字一致）'
  surface: 'docker pull <host>:<port>/<repoKey>/<image>[:<tag>]（repo-path 形态，dind 经典栈 insecure-registry）'
  request:
    method: SEQUENCE
    steps:
      - 'GET /v2/（匿名 ping → 401 挑战）'
      - 'GET /v2/token?service&scope&account（Basic → 200 token）'
      - 'GET /v2/<repoKey>/<image>/manifests/<tag>（Bearer，Accept 含 list 类型 → 200 index + Docker-Content-Digest）'
      - 'GET /v2/<repoKey>/<image>/blobs/sha256:<config-digest>（→ 200）'
      - 'GET /v2/<repoKey>/<image>/blobs/sha256:<layer-digest>（→ 200）'
    headers: {}
    query: {}
  authentication: { type: 'basic→bearer（序列内自动流转）', role: user }
  expect:
    status: client-exit-0
    headers: { note: '逐步头集断言复用兄弟条目（manifest-get-tag / blob-get）' }
    body: { note: '最终 index digest 与上游参照逐字一致（L000-F：sha256:d1a8d0a4eeb6…9e59e 与上游 registry:3 参照腿一致）' }
    timing: { note: '首拉含上游代取+落缓存（E2-1 实测 17.0s @docker.io；本地 registry 上游 1.94s）' }
  side_effects:
    - '落缓存 <repoKey>-cache：library/<image>/<tag>/list.manifest.json + sha256__ 命名 digest 路径 + config/layers marker（docker.io library/ 命名空间保留）——C05 布局分歧登记在案'
  error_behavior: []

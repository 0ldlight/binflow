        按 normalize superset_policy tolerated_and_note，不判 DIVERGENT；条目无 absent 断言故两口径均过）
    body: { format: none }
  side_effects: []
  error_behavior:
    - { when: 'digest 不存在', ref: docker/remote-manifest-unknown-404 }
  binflow_state:
    verdict: SAME
    detail: 'L003 双端活体：BinFlow HEAD = 参照活体窄集（Docker-Content-Digest/Last-Modified/X-Artifactory-Docker-Registry=<repoKey>）+ GET 全集超集——按「窄集 expect + 超集 tolerated」口径复核翻绿'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.952e556d }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E2-4, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: 'C06（L000-F 复验段）', date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L003-remote-face-diff.md, anchor: '① manifest HEAD（by digest）窄集+超集口径段', date: '2026-09-11' }
  confidence: high
  status: VERIFIED
- id: docker/remote-manifest-conditional-get
  feature: 'manifest 条件请求矩阵（新窗口内副本：INM 匹配→304 裸头本地应答、IMS→304、非匹配 INM 在场→200 且封死日期臂、HEAD 恒 200）——L004-1 重写（原「INM 不消费恒 200」前提经双端活体证伪）'
  surface: 'GET|HEAD /v2/<repoKey>/<image>/manifests/<tag-or-digest> + If-None-Match[+If-Modified-Since]'
  request:
    method: GET
    path: '/v2/<repoKey>/<image>/manifests/<tag-or-digest>'
    headers:
      Authorization: 'Bearer <token>'
      If-None-Match: '"<etag>" 或 <etag>（quoted/unquoted 两拼写）'
      If-Modified-Since: '<Last-Date 值（可选，与 INM 组合臂）'
    query: {}
  authentication: { type: bearer, role: user }
  expect:
    arms:
    - when: 'GET + INM quoted 匹配（tag 面 M1 / by digest M1d）'
      status: 304
      headers: { literal: { Docker-Distribution-Api-Version: registry/2.0 }, present: [], absent: [] }
      body: { format: none, note: '304 裸头（仅 api-version），上游零往返——本地判定' }
    - when: 'GET + INM unquoted 匹配（M2/M2d）'
      status: 304
      headers: { note: '参照按值不区分引号匹配（与 blob 面同构）——同 M1 形态' }
      body: { format: none }
    - when: 'GET + IMS（=LM，M3）'
      status: 304
      headers: { note: '同裸头形态' }
      body: { format: none }
    - when: 'GET + INM quoted 非匹配（无/有 IMS 匹配，M4/M4b）'
      status: 200
      headers: { note: '同 manifest-get-tag 全量头集' }
      body: { format: any, note: '全量回体；INM 在场即封死日期臂（带匹配 IMS 也 200）' }
    - when: 'GET + INM unquoted 非匹配 + IMS 匹配（M2c）'
      status: 200
      headers: { note: 'unquoted 在场同样封死日期臂——参照不丢弃 unquoted 拼写' }
      body: { format: any, note: '全量回体' }
    - when: 'GET + INM 匹配 + IMS 陈旧/匹配（M5/M6）'
      status: 304
      headers: { note: 'etag 优先于日期判定' }
      body: { format: none }
    - when: 'HEAD + INM quoted 匹配（M7）'
      status: 200
      body: { format: none, note: 'HEAD 永不 304' }
    scope_note: '本矩阵限新窗口内副本（检索窗未到期）；过期窗条件服务见 docker/remote-manifest-revalidation-serve'
  side_effects: []
  error_behavior: []
  unobserved_reference_arms: []
  binflow_state:
    verdict: DIVERGENT
    detail: 'L004-1 双端活体 18 臂矩阵：SAME 15 / DIVERGENT 3——M2/M2c/M2d 三臂全为 unquoted INM：参照按值不区分引号匹配→304（且在场封死日期臂），BinFlow manifestClientNotModified 只解析带引号 entity-tag、unquoted 解析为零标签被丢弃落日期臂（M2/M2d→200 全量反转；M2c→304 反转）。blob 面同构不受影响（B2/B5 SAME）；M6/M2b BinFlow 结果偶合同判。真实 docker/containerd/oras 客户端均发 quoted etag（RFC 9110），实际客户端影响面低——矩阵口径可观察面分歧，D1 挂 known-divergence'
    witness: '原判 VERIFIED/SAME 锚 E3-2（「恒 200 永不见 304」）——L004-1 双端活体推翻（E3-2 勘误：三拼写均本地 304）；L000-F C08 复验只测 BinFlow 腿未重测参照（账实缺口存证）；翻 DIVERGENT 待 D1 修复后复验翻绿'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.l0041-worktree }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: 'E3-2/E3-3（已被 L004-1 勘误 superseded——报告头部 errata 注记在案）', date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: 'C08（L000-F 复验段——仅 BinFlow 腿，参照未重测；结论随 E3-2 勘误失效）', date: '2026-09-11' }
    - { kind: difftest, report: reports/compatibility/L004-304-ping-diff.md, anchor: '§1 E3-2 勘误（双证并排）+ §2 新窗口 18 臂矩阵（SAME 15/DIVERGENT 3，STABLE×2）', date: '2026-09-12' }
  confidence: high
  status: DIVERGENT
  divergence_ref: known-divergence.yaml#docker/remote-manifest-inm-unquoted
- id: docker/remote-manifest-revalidation-serve
  feature: '过期 tag 重验证服务（检索窗到期：上游 ×1 往返 + 客户端 200 全量 + 客户端条件不被消费）——§8-C 上游 304 透传的契约落点'
  surface: 'GET /v2/<repoKey>/<image>/manifests/<tag>（副本 retrievalCachePeriodSecs 窗口到期后，无/有客户端条件头）'
  request:
    method: GET
    path: '/v2/<repoKey>/<image>/manifests/<tag>'
    headers: { Authorization: 'Bearer <token>', 'If-None-Match': '"<etag>"（X2 臂：在场但不被消费）' }
    query: {}
  authentication: { type: bearer, role: user }
  expect:
    status: 200
    headers: { note: '同 manifest-get-tag 全量 artifact 头集（重验证服务臂回全量）' }
    body: { format: any, note: '全量 manifest 回体（tag 未变时与缓存副本逐字节同）' }
    upstream:
      rtt_count: 1
      bytes: 0
      shape_note: >-
        N1（形状差异，客户端不可见）：BinFlow=条件 GET（If-None-Match=quoted digest etag）→上游 304（0 字节）
        →窗口滑动重落（上游 access 行 "GET … 304 0" 直证）；参照=上游 HEAD 探查（HEAD 200 即续窗）。
        同为 1 往返 0 字节；tag 变更时 BinFlow 单往返拿新内容、参照需二次 GET
    client_conditions: '不被消费（X2：带 quoted 匹配 INM 也 200 全量，cacheState≠HIT 不评估客户端条件）——双端同姿'
  side_effects:
    - '窗口滑动重落（重验证成功后续窗）'
  error_behavior: []
  unobserved_reference_arms:
    - 'tag 实际变更时的重验证臂（本轮上游无变更场景；BinFlow 条件 GET 直接拿新 manifest、参照 HEAD 察觉后二次 GET——形状推演未经活体）'
  binflow_state:
    verdict: SAME
    detail: 'L004-1 过期窗矩阵 X1/X2（retrievalCachePeriodSecs=60 双端配置回读确认）：客户端可见面双端全同（200 全量、条件不消费）；上游计数 1v1；形状差异（条件 GET→304 vs HEAD 探查）为 N1 note 客户端不可见。§8-C 收编实现 serveRevalidatedManifest 声明与活体一致；E3-3「304 仅经上游回源透传」半勘误（客户端 304=本地判定 M1；参照活体重验证=HEAD 探查，反编译条件 GET→304 路径未走及）'
    witness: 'E3-3 标「待动态复证」→ L004-1 活体收口（过期窗臂）'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.l0041-worktree }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: 'E3-3（半勘误：活体形状=HEAD 探查；报告头部 errata 注记在案）', date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L004-304-ping-diff.md, anchor: '§3 过期窗矩阵 X1/X2（上游 access 行 304 直证）+ §0 结论速览', date: '2026-09-12' }
  confidence: high
  status: VERIFIED
- id: docker/remote-pull-sequence
  feature: '真实客户端端到端拉取序列（ping→token→manifest→config blob→layer blob→exit 0，digest 逐字一致）'
  surface: 'docker pull <host>:<port>/<repoKey>/<image>[:<tag>]（repo-path 形态，dind 经典栈 insecure-registry）'
  request:
    method: SEQUENCE
    steps:
      - 'GET /v2/（匿名 ping → 401 挑战）'
      - 'GET /v2/token?service&scope&account（Basic → 200 token）'
      - 'GET /v2/<repoKey>/<image>/manifests/<tag>（Bearer，Accept 含 list 类型 → 200 index + Docker-Content-Digest）'
      - 'GET /v2/<repoKey>/<image>/blobs/sha256:<config-digest>（→ 200）'
      - 'GET /v2/<repoKey>/<image>/blobs/sha256:<layer-digest>（→ 200）'
    headers: {}
    query: {}
  authentication: { type: 'basic→bearer（序列内自动流转）', role: user }
  expect:
    status: client-exit-0
    headers: { note: '逐步头集断言复用兄弟条目（manifest-get-tag / blob-get）' }
    body: { note: '最终 index digest 与上游参照逐字一致（L000-F：sha256:d1a8d0a4eeb6…9e59e 与上游 registry:3 参照腿一致）' }
    timing: { note: '首拉含上游代取+落缓存（E2-1 实测 17.0s @docker.io；本地 registry 上游 1.94s）' }
  side_effects:

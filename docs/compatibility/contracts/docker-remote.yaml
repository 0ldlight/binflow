- id: docker/remote-blob-get
  feature: 'blob GET by digest（manifest 链内 digest：代取 + 落缓存 + 全套校验和；含 HEAD）'
  surface: 'GET|HEAD /v2/<repoKey>/<image>/blobs/sha256:<digest>'
  request:
    method: GET
    path: '/v2/<repoKey>/<image>/blobs/sha256:<digest>'
    headers: { Authorization: 'Bearer <token>' }
    query: {}
  authentication: { type: bearer, role: user }
  expect:
    status: 200
    headers:
      pattern:
        X-Artifactory-Origin-Remote-Path: '^https?://.+/v2/<image-normalized>/blobs/sha256:<digest>$'
        Content-Disposition: '^attachment; filename="sha256__[0-9a-f]{64}"$'
        X-Artifactory-Filename: '^sha256__[0-9a-f]{64}$'
      derived:
        Etag: etag_is_sha1
      present: [Docker-Content-Digest, X-Checksum-Md5, X-Checksum-Sha1, X-Checksum-Sha256, Accept-Ranges, Last-Modified, X-Artifactory-Filename]
      absent: []
    body:
      format: binary
      note: >-
        sha256(body)==digest（协议不变量）；Last-Modified=落缓存时刻（L002-2+L003 两轮 registry:3 活体双端一致：
        与同轮 manifest 拉取同秒）——E2-5 的「上游真实 mtime」观察（docker.io 腿、单侧）与之冲突，语义疑与上游
        是否回 Last-Modified 相关，docker.io 腿复核前按双端活体口径断言（双端一致即 SAME 判定不受影响）
    timing: { upstream_rtt: true, note: '未缓存但链内已见于 manifest 链（ADR-0047 DigestChainGate 门开）→ 上游代取（E4-1 实测 2.6s/3.8s @docker.io）后落缓存' }
  side_effects:
    - 'marker 生命周期：blob 首取成功后 marker 被真实内容替换（replaceRepoMarkers/removeMarkerAsSystem）'
  error_behavior:
    - { when: 'digest 不见于任何 manifest 链（门关）', ref: docker/remote-blob-unknown-digest-404 }
  binflow_state:
    verdict: SAME
    detail: 'L003 双端活体逐头逐值（f_blob*/f_blobr* vs a_blob*/a_blobr*）：Last-Modified(落缓存时刻)/Content-Disposition(sha256__ filename)/X-Artifactory-Filename/Origin-Remote-Path/校验和族双值一致（e6329bed/105e5808 同 blob 双端同值）；206 窗口头集不缩水。L002-2 曾显性化 blob 面头集缺口（Content-Disposition/Filename/Origin-Remote-Path），L003-2 清偿。HEAD 全量头集独立取证仍仅 C17/E5-2，按 GET 同头集推断附注维持'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.952e556d }
  evidence:

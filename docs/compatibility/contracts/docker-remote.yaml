  authentication: { type: basic, role: any, credential_state: invalid }
  expect:
    status: 401
    headers: { present: [Content-Type], absent: [] }
    body:
      format: pretty
      json:
        keys_exact: [errors]
        path_literal:
          errors[0].status: 401
          errors[0].message: Bad Credentials
        keys_absent_at_errors0: [code, detail]
  side_effects: []
  error_behavior: []
  binflow_state:
    verdict: SAME
    detail: 'L001-1 复验（灭）：401 pretty {"errors":[{"status":401,"message":"Bad Credentials"}]}——OAuth 形态已转 Artifactory 通用错误模型；真实 docker CLI 27.5.1 坏密码渲染 unknown: Bad Credentials 与 E1-5 客户端指纹逐字（修复前 unauthorized: authentication required）；正确凭据 login 照常'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat.f80c46aa }
  evidence:
    - { kind: probe, report: reports/compatibility/L000-docker-remote-evidence.md, anchor: E1-5, date: '2026-09-10' }
    - { kind: difftest, report: reports/compatibility/L000-docker-remote-diff.md, anchor: C02, date: '2026-09-11' }

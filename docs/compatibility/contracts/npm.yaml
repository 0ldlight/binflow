    - { kind: probe, report: reports/agents/T-394.md, anchor: 'AC 表行 1（裸 legacy login 全链）/ 行 6（错口令 E401）/ 行 8（curl 直发 201 幂等再铸）+ 遗留 1-2', date: '2026-09-13' }
    - { kind: difftest, report: reports/compatibility/L012-dist-tags-diff.md, anchor: '§5 K60 族零补证（D12-R03 转写建议）+ §6-2（本文件蓝本）', date: '2026-09-13' }

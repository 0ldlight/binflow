  version: { artifactory_ref: 7.161.20, binflow_tested: uat-l0121-d301cf31 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L012-dist-tags-evidence.md, anchor: '§2 m05 / §3-D4', date: '2026-09-12' }
    - { kind: difftest, report: reports/compatibility/l0121-wire/a/ghost-ls.log, anchor: 'GET → 404 body(74 bytes) pretty 信封「Not found」', capture: '同文件 + b/ghost-ls.log + curl-matrix-{a,b}.txt m05 行', date: '2026-09-12' }
    - { kind: difftest, report: reports/compatibility/L012-dist-tags-diff.md, anchor: '§1-D4（writeTagsLookupError 裸文案——packument 面 Package not found 不动）+ §2 ghost-ls 逐字 + §3 m05', date: '2026-09-12' }
  confidence: high
  status: VERIFIED
# ── 坏 body（D5——对齐后形态） ───────────────────────────────────────────────
- id: npm/dist-tags-put-bad-body
  feature: 'PUT tag body 非 JSON string（400 + 中性 message——D5 对齐后形态：不复刻参照 500）'
  surface: 'PUT /-/package/<escapedName>/dist-tags/<tag> + body 非 JSON string（裸词 / JSON object）'
  request:
    method: PUT
    path: '/-/package/<name>/dist-tags/<tag>'
    headers: { Authorization: 'Basic <valid>' }
    body: 'not-a-json-string（裸词，m08）或 {"v":"1.0.0"}（JSON object，m09）——两臂同形'
    query: {}
  authentication: { type: basic, role: user }
  expect:
    status: 400
    headers: { note: 未捕获不立断言 }
    body:
      format: any
      json:
        keys_exact: [errors]
        path_literal:
          'errors[0].status': 400
        path_pattern:
          'errors[0].message': '^(?!.*(invalid character|cannot unmarshal|json:|Go value|goroutine|/internal/)).+$'
        proposed_literal: 'invalid dist-tag body'
      note: >-
        D5 对齐后形态：conductor 裁定不复刻参照 500（A 对坏输入双臂 500「Internal server error」= 参照自身
        瑕疵，L012-1 §3-D5 建议被采纳）——契约按 400+中性文案立。硬断言三层：status 400 + errors 信封 +
        message 不泄漏 Go unmarshal/runtime 内幕（path_pattern 反向门；difftest 为 Python re，支持 lookahead）。
        proposed_literal=实现建议（沿用 BinFlow 现前缀、去泄漏尾），终字由 L012-2b 落地后契约升 verbatim
  side_effects: []
  binflow_state:
    verdict: 'DIVERGENT（status 已 400✓；message 泄漏 Go unmarshal 文案）'
    detail: 'm08：B `invalid dist-tag body: invalid character ''o'' in literal null (expecting ''u'')`；m09：B `invalid dist-tag body: json: cannot unmarshal object into Go value of type string`——泄漏 Go 标准库内幕（内含 internal 路径风格风险）。A 双臂 500 Internal server error（不复刻）。L012-2b message 中性化后过 path_pattern 门'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat-l0121-d301cf31 }
  evidence:

# ══ 第二批（L013-2，2026-09-13）：K60 认证/会话族零补证转写 ════════════════════
# 来源双柱：docs/reverse/npm.md（T-393 定案——npm 10.9.8 本机实物源码逐文件核对 + live 抓包 +
#   DE 反编译三方互证，K60 域最厚资产）× L012 两批独立 wire（l0121-wire 定稿批 + l0122-wire 复核批
#   ——L012-dist-tags-diff.md §5「三格与 L012-1 §5 抽核一致（第二次独立复核）」）。
# 零补证依据（dispatcher 派单援引 diff §5 / T-L012-2b Next 建议）：规格源与 wire 源已互证，不再另开
#   取证票；两源互证的臂直接 VERIFIED。
# 零补证边界：单源臂不立 A 侧断言——DE-only 臂（login 缺字段 400 文案）与 as-built-only 臂
#   （whoami 403 ACL / 405 方法收窄 / -rev 拼写超集）一律降为注记或 error_behavior 未裁臂；
#   K60-5 面（/-/npm/v1 家族）无任何活体证据 → 整条停 SPECIFIED 待差分批跑。
# 台账边界（L013-2 票面）：本批不改 known-divergence/matrix——三笔翻账建议（login 缺字段 UNKNOWN、
#   login id/rev npm-blind INTENTIONAL、D12-R03 contract_ref）回报 conductor 落。
- id: npm/session-login-put
  feature: 'K60-1 legacy login（couch PUT：body 凭据 → 201 铸 token；gate 豁免面 T-394 落地）'
  surface: 'PUT /-/user/org.couchdb.user:<username>'
  request:
    method: PUT
    path: '/-/user/org.couchdb.user:<name>（用户名 encodeURIComponent——npm-profile couchEndpoint；服务端按路径段解析，%2F 等转义不展开）'
    headers: { content-type: application/json, npm-auth-type: legacy, npm-command: login, note: '无 Authorization 头（live 抓包逐头确认——couch 惯例，npm-profile loginCouch 构造 body 凭据不带 opts.auth；T-374 L1 根因即 httpapi 写门先要求凭据，T-394 豁免收口）' }
    body: '{"_id":"org.couchdb.user:<name>","name":"<name>","password":"…","type":"user","roles":[],"date":"<ISO8601>"}（服务端只消费 name/password——DE 同构，其余字段忽略）'
    query: {}
  authentication: { type: 'gate 豁免（PUT 该路径族不做写凭据前置门）；认证双臂=Authorization 头 principal 优先，无头走 body name+password（argon2id；present-but-wrong 一律 401 绝不静默匿名）', role: user }
  expect:
    arms:
    - when: 'body 凭据正确（无 Authorization 头——npm login --auth-type=legacy 实发形态）'
      status: 201
      headers: { note: '响应头未逐项落盘（T-393 wire 记录 + T-394 AC 未捕获头面）——不立头断言' }
      body:
        format: any
        json:
          keys_exact: [ok, id, token]
          path_literal: { ok: true }
          path_pattern: { token: '^.+$' }
          note: >-
            npm 只读 token（非空即可）写 .npmrc _authToken 复用（官方 npm-profile putCouch/newCreds）。
            id 值不立断言：DE 常量 `org.couchdb.user:undefined` vs BinFlow 真实 `org.couchdb.user:<subject>`
            ——K60 §6 定案（npm-blind，有意差异，台账候选回报）；BinFlow 多出 rev 字段（npm 不读，
            normalize session_mint.body_superset_fields 记注）。token 随机铸造值过 normalize placeholder
    - when: 'Authorization 头 principal（.npmrc _auth 等效路径）'
      status: 201
      body: { note: 同 body 凭据臂（principal 即登录，subject=principal） }
    - when: '凭据错误（body 账密 present-but-wrong）'
      status: 401
      headers:
        literal: { WWW-Authenticate: 'Basic realm="<产品名> Realm"' }
        note: 'B as-built realm="BinFlow Realm"；A 头未捕获（T-393 wire 头面缺）——normalize keep_semantic WWW-Authenticate + realm 占位符化；A 活体复捕后升 literal'
      body:
        format: any
        json:
          keys_exact: [errors]
          path_pattern:
            'errors[0].message': '^(Authentication is required|authentication required)$'
          note: 'npmjs 官方 couch 形态 {"error":…,"reason":…}；npm-registry-fetch 只按状态码归类（E401）body 形态不敏感（live E401 渲染正常）——K60 §6 裁定 BinFlow errors[] 信封 accepted'
  side_effects:
    - '铸 TokenRegistry token：与 POST /api/security/token 同表同吊销链（NE-06）；TTL 720h（as-built）'
    - 'login 是认证面不是制品写：零制品落盘、不做仓路径写 ACL、不问 addon 授权（DE 同构——K60 §2.3-4；T-394 strict 不外溢 11 行维持 publish/非 couch id/generic 仓全 401）'
    - '客户端面：npm 成功后改写 .npmrc 凭据行为 _authToken 形态（live：_auth 行被 token 行取代）'
  error_behavior:
    - when: 'body 缺 name/password'
      status: 401
      body:
        format: any
        json: { keys_exact: [errors], path_pattern: { 'errors[0].message': '^(Authentication is required|authentication required)$' } }
      note: >-
        未裁定臂（不立 A 侧断言）：DE 逐字 400 `User or Password fields are missing.`（此条补充官方——客户端
        源码不定义服务端文案）vs BinFlow as-built 401+Basic challenge（T-394 注记 1：近不可达——真实 login 恒带
        账密；npm 两码同归 E401/ENEEDAUTH 不敏感）。UNKNOWN 候选已回报 conductor（台账建议）；
        裁对齐则本臂升 status 400 + DE 文案 literal
    - when: 'Authorization 头 principal 与 body 指名不同账户'
      status: 403
      body:
        format: any
        json: { keys_exact: [errors] }
      note: 'as-built 防御臂（为他账户铸 token 不是 login）；A 面未取证不立断言——npm 客户端恒同账户，近不可达'
  binflow_state:
    verdict: 'SAME（wire 互证臂全绿：body 凭据 201 铸 token / 头 principal 201 / 错凭据 401→E401 渲染 / gate 豁免 strict 不外溢）'
    detail: 'T-394 AC1：裸 `npm login --auth-type=legacy` 全绿（服务端 access 行 PUT …/-/user/org.couchdb.user:admin 201 user=anonymous——豁免后 body 臂实证）；AC8：curl 直发 201 幂等再铸 {"ok":true,"token":"75bd…","id":"org.couchdb.user:admin"}；AC6：错口令 E401 且 .npmrc 未写凭据。实现面 grep：internal/httpapi/router.go npmCouchLoginExempt/isCouchUserDocument（gate 豁免）+ internal/adapter/npm/session.go serveLogin（双臂铸 token）'
  version: { artifactory_ref: 7.161.20, binflow_tested: 'T-393/T-394 实例（M14 B2/B3 窗）+ uat-l0121-d301cf31（disttag-family wire 面）' }
  evidence:

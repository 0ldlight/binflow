  request:
    method: GET
    path: '/-/package/<不存在包名>/dist-tags'
    headers: { Authorization: 'Basic <valid>' }
    query: {}
  authentication: { type: basic, role: user }
  expect:
    status: 404
    headers: { note: 未捕获不立断言 }
    body:
      format: any
      json:
        keys_exact: [errors]
        path_literal:
          'errors[0].status': 404
          'errors[0].message': 'Not found'
        note: >-
          D4 对齐：A verbatim「Not found」（两词、首字母大写——信息量低于 BinFlow 现文案

# BinFlow 兼容契约——仓库管理 REST 面（DELETE /api/repositories/{key} 起步）
# schema: compat-contract/1 —— 同域多条目单文件（沿 maven-virtual 先例），条目键面全集同
#   docs/ai-engineering/compatibility-engineering.md §2（id/feature/surface/request/authentication/
#   expect/side_effects/error_behavior/unobserved_reference_arms/binflow_state/version/evidence/
#   confidence/status + divergence_ref）。
# 落点说明（T-558/BIN-40，2026-09-29）：contracts/ 此前无仓库管理域文件（GET/PUT/POST 仓配置面
#   由 matrix.yaml D02 冻结行承载、无契约文件落锚）；本票按 D-3/T-555（BIN-37，R6 并行实现票）
#   契约先行要求新建本文件，首条目=非空仓 DELETE 级联语义。
# 证据链：L028 D-3 首测 + L032 Arm 1 ruling-ready 矩阵（r1≡r2≡r3，A=7.161.26 Enterprise+ live）；
#   authority=user_ruling 2026-09-29（会话内裁定经 conductor 转达）——BUG 对齐 A 面（台账
#   rest/nonempty-repo-delete-cascade-guard 已先本票翻 BUG，fix ticket T-555/BIN-37 in flight）。
domain: rest
scope: '仓库管理 REST API 的 DELETE /api/repositories/{key} 面（非空仓级联语义 + deleteContent 参数
  受理形态 + 善后态注记）。不含：GET/PUT/POST 仓配置面（matrix.yaml D02 冻结行承载）、
  release-bundles 系统仓臂（d08/repo-delete-response-envelope——c55 体裁面，相邻账）、仓库根内容
  DELETE 面（repo-semantics.md:265 开放问题项——另行挂账）。'
reference_instance: 'Artifactory 7.161.26 Enterprise+（192.168.120.38:8082；L028/L032 活体取证）'
binflow_tested_instance: 'worktree 现态（L032 r1-r3 轮——400 确认门现状；T-555 修复未在树）'
client_anchor: 'curl 差分腿（L028/L032 harness；admin 凭据 env 注入零落盘）'
contracts:
# ── 非空仓 DELETE 级联语义（D-3 / T-555 / BIN-37——契约先行）──────────────────────
- id: rest/repo-delete-nonempty-cascade
  feature: 'DELETE 仓库端点对非空仓的语义：200 静默级联删除仓库及其全部内容（无确认门），
    body 回 JSON 报告体含 deletedArtifactsCount'
  surface: 'DELETE /api/repositories/{key}（目标仓非空——含已存制品/节点）'
  request:
    method: DELETE
    path: '/api/repositories/{key}'
    headers: { Authorization: 'Basic <admin>', Content-Type: 'application/json' }
    query: { deleteContent: '可选 true——受理且与无参同形（见 arms 第二臂）' }
  authentication: { type: basic, role: admin }
  expect:
    semantics: '行为句式（A 面 7.161.26 live，L032 Arm 1 r1≡r2≡r3）：当管理员 DELETE 一个非空仓时，
      服务端返回 200 并**静默级联删除该仓库及其全部内容**（无确认语义、不要求任何参数），body 为
      JSON 报告体（键含 repoKey、deletedArtifactsCount、success）。当请求带 ?deleteContent=true
      时服务端受理并回同形 200 级联结果（参数为兼容接受的冗余位，不构成门——B 既有带参客户端
      用法不因修复破坏）。'
    arms:
    - when: '非空仓 DELETE（无参）'
      status: 200
      body:
        format: json
        shape: '{"repoKey": "<key>", …, "deletedArtifactsCount": <int>, "success": true}——A 面
          实测形（L032 例：deletedArtifactsCount=6）。**计数口径（deletedArtifactsCount 精确语义：
          制品数 vs 节点数 vs 文件数）T-555 活体探针定准中，实现票回填本锚**（A=6 计数 vs B 节点
          数 5 的口径差系证据细节，未定谳）'
    - when: '非空仓 DELETE ?deleteContent=true'
      status: 200
      body: { format: json, note: '与无参臂同形（级联结果报告体）。A 面带参臂未单拍（A 无参即级联，
        参数无必要语义——unobserved 如实）；B 面现值带参→200（L032 live），裁定后语义=与无参同形' }
    followup_state: '善后态（双端一致面，不立案）：删除后 GET /api/repositories/{key} 双面均 400 同形
      同文案（含 never-existed 键——missing-key repo GET 双面 400 而非 404，B 逐字复刻 A，
      L032 Arm 1 mini 发现）'
  side_effects:
  - '仓库定义删除；仓内全部制品/节点级联删除（不可逆——差分腿以 difftest-* 专属仓构造，不触
    用户数据）'
  error_behavior: []
  unobserved_reference_arms:
  - 'A 面 ?deleteContent=true 带参臂（未单拍；按「无参即级联」机制面推定冗余接受——不立断言）'
  - 'deletedArtifactsCount 计数口径（A 面 6 vs B 节点 5——T-555 活体定准后回填 shape 锚）'
  - '空仓 DELETE 形态（非本条 face；未取证不立）'
  - '级联删除的异步性/最终一致窗口（A 面未观测；B 语义随 T-555 定）'
  binflow_state:
    verdict: "DIVERGENT——B 面 400 确认门（repository is not empty … retry with deleteContent=true）；
      带参臂现值 200（live）。修复票 T-555/BIN-37 in flight（R6）"
    detail: '台账 known-divergence.yaml#rest/nonempty-repo-delete-cascade-guard（UNKNOWN→BUG
      2026-09-29 用户裁定，先于本票；本契约为其 target 形落锚）——修后差分复验（L028 D-3 /
      L032 Arm 1 臂）翻绿 → 本条 VERIFIED + 台账 resolved。相邻账
      d08/repo-delete-response-envelope（成功体裁 JSON vs text——c55 面）为不同面，本条 body
      断言与其裁决联动待该条裁定（若裁对齐 JSON 则一票收；裁维持 text 则本条 body 键面以 B 面
      渲染载体为准重评）。'
  version: { artifactory_ref: 7.161.26, binflow_tested: 'worktree 现态（L032 轮——400 门现状；T-555 未在树）' }
  evidence:
  - { kind: difftest, report: reports/compatibility/L028-maven-v2-batch1-diff.md, anchor: 'D-3（首测：A 200 静默级联 vs B 400 确认门）', date: '2026-09-28' }
  - { kind: difftest, report: reports/compatibility/L032-t550-followup-arms.md, anchor: 'Arm 1 ruling-ready 矩阵（r1≡r2≡r3：A 200 body {repoKey,…,deletedArtifactsCount:6,success:true} / B 400 holds 5 node(s) 文案 / B ?deleteContent=true→200 / 善后双面 400 同形 + missing-key GET 400 mini 发现）', date: '2026-09-28' }
  - { kind: probe, report: docs/reverse/repo-semantics.md, anchor: ':265 开放问题项（仓库根内容 DELETE 面——自记需与 repo 删除区分；佐证本面规格缺口如实，行为以 live 证据为准）', date: '2026-09-28' }
  confidence: high
  status: DIVERGENT
  divergence_ref: known-divergence.yaml#rest/nonempty-repo-delete-cascade-guard

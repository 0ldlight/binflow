- id: buildinfo/get-list
  feature: '名清单 + lastStarted（顶级 uri 绝对 + ?buildRepo= 串；条目 uri 相对 /<name>；lastStarted UTC 归一；名序=各名最新 run 日期升序；空态 404）'
  surface: 'GET <apiBase>/build[?buildRepo=&project=]'
  request: { method: GET, path: '<apiBase>/build', headers: { Authorization: 'Basic <valid>' }, query: {} }
  authentication: { type: basic, role: read }
  expect:
    status: 200
    body:
      format: json
      shape: '顶级 uri=<BASE>/api/build?buildRepo=<解析仓>；builds[]:{uri:"/<name>", lastStarted:"yyyy-MM-dd''T''HH:mm:ss.SSSZ(+0000)"}'
      ordering: '按各名最新 run 日期升序（L023-2D 双活体收口——build-info.md §9 #5 关闭）'
  side_effects: []

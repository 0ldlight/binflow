# BinFlow 兼容契约——build-info REST 端点族（buildinfo 域首文件，L023-2D 蓝本，2026-09-15）
# schema: compat-contract/1 —— 条目键面全集：
#   id/feature/surface/request/authentication/expect/side_effects/error_behavior/version/evidence/
#   confidence/status（+binflow_state 记差分现值；divergence_ref 于 DIVERGENT/INTENTIONAL 必填）。
# 作者注：本文件为 L023-2D（differential-qa-engineer）据双端活体 wire 起草的蓝本，条目状态为差分现值
#   记录；入册与翻态裁定权在 compatibility-engineer。证据面=L023 双端（A=Artifactory pro 7.161.15
#   :8082 / B=BinFlow dev dev.77033399 :8083），REST 44 判定单元 + jf 2.122.0 真腿 4×2。
#   差分报告=reports/compatibility/L023-buildinfo-diff.md（D-item 编号在其 §3）。
# 归一依赖（提案 fixtures/normalize.yaml#buildinfo，报告 §1 N1-N6）：
#   N1 头 drop 集 / N2 Content-Type json-family 等价（vendor≠裸型单列 D8）/ N3 X-Checksum-Sha256
#   hex64 shape / N4 绝对 URL 前缀占位 / N5 statuses[] 服务端时钟戳 shape / N6 名清单断言域。
# 面外维持（不立条目）：rename（D07-R09）、docker promote 独立端点（R11→build-info.md §2.6）、
#   patternArtifacts、diff 响应形态、project 过滤族。
domain: buildinfo
scope: build REST 面 M17 七族（上传/append/查询单/列表族/单删/批删/promote/retention）。
  证据面=L023-2D 双端活体（curl 族 44 单元 + jf 2.122.0 真腿双发）。不含：buildinfo 仓文件面直传
  （ADR-0045 载体轴 A——BinFlow REST 面为唯一入口）、LATEST 哨兵 body 族、webhook 联动（T-510 面）。
normalize: fixtures/normalize.yaml#buildinfo（提案——L023-buildinfo-diff.md §1）
reference_instance: 'Artifactory pro 7.161.15（http://172.16.58.130:8082，admin；buildinfo 域 pro 档全开）'
binflow_tested_instance: 'BinFlow dev dev.77033399（http://172.16.58.130:8083，admin；含 L023-2A/B/C 对位）'
client_anchor: 'jf 2.122.0（build-publish/build-promote/build-discard 真腿）+ curl 差分族'
contracts:
# ── 上传：PUT /api/build（全量） ─────────────────────────────────────────────
- id: buildinfo/put-upload
  feature: 'PUT /api/build 全量上传（name/number 在 body；204 空体 + X-Checksum-Sha256 头；hidden 坐标 400；同坐标覆盖；同号不同 started 并存；artifactoryPrincipal 覆写）'
  surface: 'PUT <apiBase>/build[?buildRepo=&project=]'
  request:
    method: PUT
    path: '<apiBase>/build'
    headers: { Authorization: 'Basic <valid>', Content-Type: application/json }
    query: { buildRepo: '可选（缺省 artifactory-build-info；自定义=<projectKey>-build-info——projects 门见 error_behavior）' }
    body: 'build info JSON（version/name/number/started/buildAgent/agent/url[/properties][/modules][/buildRetention]）'
  authentication: { type: basic, role: 'upload（覆盖需 delete）' }
  expect:
    status: 204
    headers:
      shape: { X-Checksum-Sha256: '<hex64>' }
      note: '值=服务端存储 manifest 的 sha256（principal 已覆写+重序列化后），非请求原文——双端同构口径（L023-2A 登记漂移）'
    body: { format: none, literal: '' }
  side_effects:
    - 'build JSON 落库（四元 name/number/started/repo 唯一）'
    - 'artifactoryPrincipal ← 认证用户；1-2 digest 缺失行按已有 checksum 反查补全（源码级，未差分）'
    - 'body 携 buildRetention 块时发布尾部同步执行 retention（E7）'
    - 'webhook uploaded 事件（T-510 面）'
  error_behavior:
    - { when: 'name/number 去前导空白后以 . 开头', status: 400, literal_body: 'errors[] 信封 Build name must not start with ''.''/Build number must not start with ''.''' }
    - when: 'body started 不可解析（PUT 面）'
      status: 400
      literal_body: >-
        A=与 GET 查询面同族（joda 异常文案直上）：位 0 不可解析 `Invalid format: "xyz"`；值域越界
        `Cannot parse "<v>": Value 13 for monthOfYear must be in the range [1,12]`。B 现值自有文案
        `build started "<v>" must be an ISO8601 timestamp (…): build: invalid build info`——D7 残臂（L023-2I §10.2）
    - { when: '?buildRepo=<X>-build-info 而 project X 不存在（A）', status: 400, ref: buildinfo/custom-buildrepo-gate }
    - { when: '畸形 body', status: 400 }
  binflow_state:
    verdict: 'SAME（01/04/05 单元）'
    detail: '204+头形/hidden 双文案逐字双绿。残差在详情回显侧（buildinfo/get-detail D4/D5），不在本面'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.77033399 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L023-buildinfo-diff.md, anchor: '§2.1 01/04/05 行', date: '2026-09-15' }
    - { kind: difftest, report: reports/compatibility/l023d-wire, anchor: '{a,b}/01-crud-put-204-sha256hdr.* + 04/05-*', date: '2026-09-15' }
  confidence: high
  status: VERIFIED

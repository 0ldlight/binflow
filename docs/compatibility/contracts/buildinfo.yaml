# ── retention：POST /api/build/retention/{name} ─────────────────────────────
- id: buildinfo/retention
  feature: '保留策略即执行（count 正数门 400 逐字；两遍删序日期先行；promoted+pinned 豁免不占 count 名额；async 缺省同步；发布尾部触发）'
  surface: 'POST <apiBase>/build/retention/{buildName}?async=false[&buildRepo=]'
  request:
    method: POST
    path: '<apiBase>/build/retention/<name>'
    headers: { Authorization: 'Basic <valid>', Content-Type: application/json }
    query: { async: '缺省 false=同步（E9 源码口径）' }
    body: '{deleteBuildArtifacts, count(正数;缺省 -1 不启用), minimumBuildDate(ISO 时间戳), buildNumbersNotToBeDiscarded[]}'
  authentication: { type: basic, role: delete }
  expect:
    status: 204
    body: { format: none, literal: '' }
  side_effects:
    - 'POST 即删（E7）：第一遍日期（started 日期严格早于 minimumBuildDate）→ 第二遍 count（幸存非豁免集 started 倒序保最新 N，其余删）；豁免=promotion 历史非空 ∨ number∈豁免清单；豁免不占名额'
    - 'PUT 携 buildRetention 块时发布尾部同流程（同步）'
    - 'webhook deleted 事件'
  error_behavior:
    - when: 'body 缺失或 count≤0'
      status: 400
      literal_body: 'Max count retention needs to be a positive number（纯文本 body；A 的 Content-Type 标 application/json——label 差 D8）'
  binflow_state:
    verdict: 'DIVERGENT（仅 Content-Type label 候裁维持；语义面复验全绿）'
    detail: 'count=0 与 body 缺失同句逐字；count=1 幸存 [''/3''+''/2''(promoted 豁免)]、发布尾部触发余 [''/6'']、jf build-discard 真腿 discard 语义——两轮均双绿；唯 media-type label 异（D8）'
    divergence_ref: 'L023-buildinfo-diff.md D8（复验 §9.1 维持）'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.77033399 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L023-buildinfo-diff.md, anchor: '§2.4 24a-26b 行 + §4 jf discard 腿', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT

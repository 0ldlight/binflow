# ── 详情：GET /api/build/{name}/{number} ────────────────────────────────────
- id: buildinfo/get-detail
  feature: '单 run 详情（started 原样时区回显；durationMillis 缺省 0；statuses[] wire；?slim=true → modules []+properties 键省略；?started= 消歧）'
  surface: 'GET <apiBase>/build/{buildName}/{buildNumber}[?started=&slim=&buildRepo=]'
  request: { method: GET, path: '<apiBase>/build/<name>/<number>', headers: { Authorization: 'Basic <valid>' }, query: { slim: 'true → modules []、properties 键省略', started: 'yyyy-MM-dd''T''HH:mm:ss.SSSZ 消歧' } }
  authentication: { type: basic, role: read }
  expect:
    status: 200
    body:
      format: json
      shape: >-
        {uri:<BASE>/api/build/..., buildInfo:{...payload 回显: started 原样时区/artifactoryPrincipal=认证用户/
        durationMillis 缺省 0/module artifacts 全字段保留（空串与 path/originalDeploymentRepo 也回）/
        statuses[]:{status,timestamp SSSZ,timestampDate epoch-ms,user[,comment][,repository][,ciUser]——
        nullable 键整体省略（comment 空亦省略）}}
  side_effects: []
  error_behavior:
    - when: '坐标不存在'
      status: 404
      literal_body: >-
        errors[] 信封 `No build was found for build name: <n>, build number: <n> `（**尾空格**）；
        携 ?started= 时 `, build started: <ts>` 子句（**逗号前空格**：<n> , build started:）
    - when: '?started= 畸形（GET 面）'
      status: 400
      literal_body: >-
        A（joda 异常文案直上）：位 0 不可解析 `Invalid format: "xyz"`（无子句）；有已解析前缀
        `Invalid format: "<v>" is malformed at "<尾段>"`；值域越界换族 `Cannot parse "<v>": Value <n> for
        <field> must be in the range [<min>,<max>]`。B 现值（L023-2I 终验）：前两臂 SAME，值域臂仍回
        `is malformed at ""`——D7 残臂（§10.2 p4a）
  binflow_state:
    verdict: 'DIVERGENT（复验后残差收窄：R3 空集合物化 + D7 边缘臂）'
    detail: '首轮 D4/D5/D6/D7 七处 → L023-2F 后主体 SAME（path/originalDeploymentRepo/空串 checksum 回显、slim 省键、comment 省键、buildRetention 默认三字段、404 空格口径、malformed started 3/4 臂）。复验残差：① B 物化空集合——module 无 dependencies 回 "dependencies":[]、build 无 modules 回 "modules":[]（A 省略键，6 单元）；② started=xyz 位 0 失败臂 A 无 malformed-at 子句/B 恒发（malformed-started-variants.log）'
    divergence_ref: 'L023-buildinfo-diff.md §9.2-R3 + §9.3 观察一'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.77033399 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L023-buildinfo-diff.md, anchor: '§2.1 02/09/10a-d 行', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT
# ── 单删：DELETE /api/build/{name} ──────────────────────────────────────────
- id: buildinfo/delete-path
  feature: '按号 CSV 删（E6 双段文案 have+Warning+尾换行；404 两分支；同号多 run 每调至多删一；deleteAll 独立文案；?artifacts= 连删制品）'
  surface: 'DELETE <apiBase>/build/{buildName}?buildNumbers=<csv>&artifacts=0|1&deleteAll=0|1'
  request:
    method: DELETE
    path: '<apiBase>/build/{buildName}'
    headers: { Authorization: 'Basic <valid>' }
    query: { buildNumbers: 'CSV；非 deleteAll 必填', artifacts: '0|1', deleteAll: '0|1' }
  authentication: { type: basic, role: delete }
  expect:
    status: 200
    body:
      format: text
      literal: >-
        部分命中：`The following builds have been deleted successfully: '<name>#<n>'[, '<name>#<n2>'].\n
        Warning - the following builds could not be removed: '<n>'.\n`（have；分隔 `, `；段尾 `.\n`）；
        deleteAll：`All builds '<name>' under '<repo>' have been deleted successfully`（无尾点，<repo>=解析 buildRepo）
    content_type_note: 'A 对本 text body 标 application/json（错标）；B 标 text/plain——D8 待裁'
  side_effects:
    - '每 run 一条 build.delete 审计 + webhook deleted'
    - 'artifacts=1 连删制品'
  error_behavior:
    - { when: '非 deleteAll 无号', status: 400, literal_body: 'Please provide at least one build number to delete' }
    - { when: '名不存在', status: 404, literal_body: 'errors[] 信封 Unable to find build ''<name>''' }
    - { when: '号全不存在', status: 404, literal_body: 'errors[] 信封 Unable to find the given build numbers' }
  binflow_state:
    verdict: 'DIVERGENT（仅 Content-Type label，候裁维持）'
    detail: 'E6 双段/404 两分支/同号怪癖（每调删最新 started 一 run，二次删清→号单 404）全逐字双绿——L023-2A 中置信「至多删一」实现活体复验通过；复验维持唯 media-type label 异（D8）'
    divergence_ref: 'L023-buildinfo-diff.md D8（复验 §9.1 维持）'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.77033399 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L023-buildinfo-diff.md, anchor: '§2.1 11/12a-b/13a-d 行', date: '2026-09-15' }
  confidence: high
  status: DIVERGENT

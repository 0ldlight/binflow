# ── promote：POST /api/build/promote/{name}/{number} ────────────────────────
- id: buildinfo/promote
  feature: 'promotion 执行序（status-only 200 INFO 大写逐字；targetRepo 404 逐字；E12 abort；lenient warning；Skipping 三行；statuses 落库六元组；dryRun/copy/scopes 面未差分）'
  surface: 'POST <apiBase>/build/promote/{buildName}/{buildNumber}[?buildRepo=]'
  request:
    method: POST
    path: '<apiBase>/build/promote/<name>/<number>'
    headers: { Authorization: 'Basic <valid>', Content-Type: application/json }
    body: '{status, comment, ciUser, timestamp(ISO8601 SSSZ), dryRun, sourceRepo, targetRepo, copy, artifacts, dependencies, scopes[], properties, failFast(缺省 true)}'
  authentication: { type: basic, role: 'w(buildRepo)（ADR-0045 Errata 二③）∧ 目标仓 w' }
  expect:
    status: '200 / 400（双面，见 error_behavior）'
    body:
      format: json
      shape: '{messages:[{level: INFO|WARNING|ERROR（大写）, message}]}；干净成功 = {"messages":[]}'
      literal_lines: 'Skipping build item relocation: no target repository selected. / Skipping promotion status update: no status received. / Skipping promotion status update: item promotion was completed with errors and warnings. / Skipping promotion status update: invalid\unparsable timestamp <ts>.（字面反斜杠）/ Unable to find the following artifacts of build ''<n>'' #<num>: <names>'
  side_effects:
    - '制品搬迁（copy=false=move；目标=解析后 targetRepo；virtual→default deployment local）'
    - 'statuses 追加（append-only；实现=删除重建；repository=解析后 targetRepo，缺省整体省略；timestamp 缺省=服务端时钟 SSSZ；timestampDate=epoch-ms；user=认证用户；ciUser 原样）'
  error_behavior:
    - when: 'E12 failFast 制品不可解析（缺省 failFast=true）'
      status: 400
      literal_body: '**errors[] 信封**（非 messages！）：{"errors":[{status:400,message:"Unable to find artifacts of build ''<n>'' #<num> from <buildRepo> repo: aborting promotion."}]}——异常路径走 REST 异常映射器；400+messages 面仅属流程完成路径（invalid timestamp 等）'
    - { when: 'targetRepo 不存在/非 local 族', status: 404, literal_body: 'errors[] 信封 Cannot find target repository by the key ''<key>''' }
    - { when: 'run 不存在', status: 404, literal_body: 'errors[] 信封 Cannot find a build by the name: <n>, number: <n>, repo: <r>' }
    - when: 'failFast=true 且流程完成路径有 ERROR/WARNING'
      status: 400
      literal_body: 'messages[] body 同形（PromotionResult.HTTPStatus）——与 E12 异常面并存的双面结构'
  binflow_state:
    verdict: 'VERIFIED（复验 L023-2G：promote 响应面全绿——D1/D2/D3 修复确认）'
    detail: '复验（dev.c6f6c71a）：E12 abort 回 errors[] 信封逐字（D1 修复）；干净成功 {"messages":[]} 无自造汇总行（D2 修复）；制品收集双通道成立——manifest 腿 22a/22c 搬迁双绿 + jf 属性通道真腿 exit=0、搬迁、promoted 豁免幸存集 [''/9'',''/7''] 双端逐位一致（D3 修复）。statuses 回显残差归 get-detail 条目（R3）'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.77033399 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L023-buildinfo-diff.md, anchor: '§2.3 16a-22c 行 + §3 D1/D2/D3 + §4 jf 腿 + §9 复验段（D1/D2/D3→SAME）', date: '2026-09-15' }
    - { kind: decompile, report: '~/Downloads/jfrog-artifactory-7.161.16/build-handler/build-handler-service/src/main/java/com/jfrog/build/service/{BuildPromotionService,BuildArtifactService}.java', anchor: 'L206-210（E12 throw→信封）/ L101/L363-379（manifest 收集分支）', date: '2026-09-15' }
  confidence: high

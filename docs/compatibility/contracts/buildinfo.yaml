    - { when: '零 build（或全被权限过滤）', status: 404, literal_body: 'errors[] 信封 No builds were found' }
    - { when: '?buildRepo= 不存在的仓', status: 404, note: '读路径无仓存在性校验——与写路径不对称（A 源码级）；双端同' }
  binflow_state:
    verdict: 'SAME（03/08/27 单元）'
    detail: 'UTC 归一（+0530 入 +0000 出）/uri 形态/升序/空态 404 逐字双绿'
  version: { artifactory_ref: 7.161.15, binflow_tested: dev.77033399 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L023-buildinfo-diff.md, anchor: '§2.1 03/08 行 + §2.5 27 行', date: '2026-09-15' }
  confidence: high
  status: VERIFIED

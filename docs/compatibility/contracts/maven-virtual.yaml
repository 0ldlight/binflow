- id: maven/derived-sidecar-validator-family
  feature: '派生旁车（maven-metadata.xml 的 .sha1/.md5/.sha256）缓存验证器族：自身 Last-Modified +
    If-Modified-Since 条件 GET；**不发 ETag**（ETag/INM 谓词不作用于旁车面——对照所服务 body 面
    = ETag+Last-Modified 双验证器，见 maven/virtual-snapshot-versions-m3-rider）'
  surface: 'GET /{repoKey}/{orgPath}/{module}/{baseVer}-SNAPSHOT/maven-metadata.xml{.sha1,.md5,.sha256}
    （+ 可选 If-Modified-Since 条件头）——repoKey 为 local 成员仓（存储文档服务响应面）'
  request:
    method: GET
    path: '/{repoKey}/{orgPath}/{module}/{baseVer}-SNAPSHOT/maven-metadata.xml{.sha1,.md5,.sha256}'
    headers: { Authorization: 'Basic <valid>', User-Agent: '<任意——validator 族与 M3 UA 谓词正交>',
      If-Modified-Since: '<条件谓词输入（可选，HTTP 日期形）>' }
    query: {}
  authentication: { type: basic, role: user }
  expect:
    validator_semantics: '行为句式（A 面 7.161.26 live，L032 Arm 6 r1≡r2≡r3 逐维取证）：当客户端 GET 派生
      旁车时，服务端返回 200 响应携带该旁车**自身**的 Last-Modified（派生时刻——晚于所服务 body 的
      Last-Modified 数秒，非 body 值复用）、且**不携带 ETag**；当客户端携带 If-Modified-Since 且其值命中
      该旁车 Last-Modified → 304（裸头应答）；值早于 → 200 全量。旁车内容（摘要=剥离后 body 对应摘要）
      契约由 rider 条目旁车臂承载（双端一致，不属本条目）。'
    arms:
    - when: '旁车无条件 GET，或 If-Modified-Since 值早于旁车自身 Last-Modified（旧值）'
      status: 200
      headers: { present: [Last-Modified, Content-Type], absent: [ETag] }
      body: { format: text, note: '摘要值断言归 rider 条目旁车臂（match×3）' }
    - when: 'If-Modified-Since = 该旁车自身 Last-Modified（命中）'
      status: 304
      note: '与 body 面 IMS 命中同姿势（304 裸头）'

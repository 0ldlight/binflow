      共用 writeDerivedSidecar 同姿势）'
    - 'If-None-Match 打在旁车上的 A 面应答（A 不发 ETag → INM 无从匹配的机制面推定不生效；未活体单拍）'
    - '旁车自身 Last-Modified 的跨请求稳定性——已分立条目 maven/derived-sidecar-lm-materialized-stamp
      （T-558，**VERIFIED 2026-09-29**：L034 Arm 4 跨秒双端 304×3 PASS×2，原机制推导 caveat 清偿）：
      跨秒语义归该条目承载；本条目同秒 validator 族断言面不受牵连'
  binflow_state:
    verdict: 'VERIFIED（L033 Arm A：T-551 stage 2 修复后 17/17 维双端一致，r1≡r2≡r3——L032 三分歧

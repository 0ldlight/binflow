# BinFlow 兼容契约——conan v1+v2 端点族（conan 域首文件，L018-1 蓝本，2026-09-13）
# schema: compat-contract/1 —— 同域多条目单文件（沿 contracts/npm.yaml 先例），条目键面全集：
#   id/feature/surface/request/authentication/expect/side_effects/error_behavior/version/evidence/
#   confidence/status（+binflow_state 记差分现值；divergence_ref 于 DIVERGENT/INTENTIONAL 必填）。
# 作者注：本文件为 L018-1（differential-qa-engineer）据双端活体 wire 起草的蓝本，条目状态为差分现值
#   记录；入册与翻态裁定权在 compatibility-engineer。证据面=L018 双端（A=Artifactory ref 7.161.20
#   :8082 / B=BinFlow UAT uat-l0181-74656514 :8083，pro license 装载见 L018-conan-evidence.md §0-2），
#   真实客户端腿=conan 2.31.2 + conan 1.66.0 双钉版（22 CLI 腿 wireproxy 全捕获、exit=0×22）。
# 归一依赖（提案 normalize.yaml#conan——未登记前断言面按「归一后」口径写，登记归 compatibility-engineer）：
#   R1 revision.time iso8601_equivalence / R2 wire_format normalize_indent / R3 token placeholder /
#   R4 absolute_url_prefix placeholder（路径段=断言面）/ R5 manifest 首行 epoch 剥离 /
#   R6 制品比内容不比压缩字节 / R7 头 drop-keep 集合——详见 L018-conan-evidence.md §6。
# 反向门（禁止归一掩盖的待裁差异面）——L019 裁定后状态：D2 错误信封族（ghost GET/尾斜杠两子族）
#   裁**对齐**已落地（L019 复验翻绿；401 措辞子族未裁，分立 #conan/auth401-wording）；D3 v1 ghost
#   再删裁**对齐 200 幂等**已落地（翻绿）；D4 pkgmeta q 三态裁**对齐 400**已落地（翻绿；合法 q 语法
#   未探明面维持 as-built，语法臂归后段差分票）；D1 v2/ping 超集裁**不实现（INTENTIONAL 候裁）**
#   ——client-blind（22 腿 wire 零 v2/ping）+反编译双证，条目注记在案。
# 路径形态：A=`/artifactory/api/conan/<repoKey>/v1|v2/…`；B=`/binflow/<repoKey>/v1|v2/…`（repo.md §1
#   BinFlow 决策）；本文件路径一律写相对 `<conanBase>/`（conanBase=各端前缀+repoKey）。
domain: conan
scope: local conan 仓 v1+v2 端点族（握手三端点双前缀/修订链/文件面/搜索/删除/绝对 URL 族）。
  证据面=L018 双端活体（curl 腿 22 臂 + conan CLI 双版 22 腿 wireproxy wire；pass1）。
  不含：remote/virtual 数据面读写（T-312 as-built，差分后段票）、reindex 管理端点（§3.3 归管理面）、
  conan 1 revisions-on 面（默认关形态取证，revisions-on 后段）、`_` 占位 ref 臂（T-340 单侧存量，
  差分后段）、X-Checksum-Deploy 命中面（本轮双端均未命中——库内无同 sha1 blob，命中臂后段）。
normalize: fixtures/normalize.yaml#conan（提案——L018-conan-evidence.md §6）
reference_instance: 'Artifactory-pro 7.161.20（http://localhost:8082，admin；匿名访问全局关——差分一律认证臂）'
binflow_tested_instance: 'BinFlow UAT uat-l0181-74656514（http://localhost:8083，admin；pro license 装载
  licenseId 243531c2-2b52-460d-84b0-03dd2be6074a——conan 是 TierPro 包型，community 档建仓 400）'
client_anchor: 'conan 2.31.2 + conan 1.66.0（双钉版；1.66 默认 revisions 关闭；两版 CLI 差异面=
  L018-conan-evidence.md §2）'
contracts:
# ── 握手：ping（v1 前缀=双端唯一可达面） ─────────────────────────────────────
- id: conan/handshake-ping
  feature: 'v1/ping 能力协商（200 空体+能力头三只逐字；virtual 上追加 only_v2——客户端发现 v1 不可用的唯一信道）'
  surface: 'GET <conanBase>/v1/ping（local + virtual 两 rclass 臂）'
  request:
    method: GET
    path: '<conanBase>/v1/ping'
    headers: { Authorization: 'Basic <valid>（差分臂；ping 匿名也可达——A 实例匿名关故认证臂取证）', 'X-Conan-Client-Version': '可选（携带时响应加版本检查头——见 error_behavior 注）' }
    query: {}
  authentication: { type: 'any（ping 免鉴权语义：repo 存在即 200）', role: any }
  expect:
    status: 200
    headers:
      literal:
        X-Conan-Server-Version: '0.20.0'
        X-Conan-Server-Capabilities: 'complex_search,checksum_deploy,revisions,matrix_params'
      note: >-
        双端逐字同（l018-wire/{a,b}/conan/v1-12b-ping-authed.hdr）。virtual 臂值=
        `complex_search,checksum_deploy,revisions,matrix_params,only_v2`（追加 only_v2——双端逐字同，
        fix-{a,b}-v1ping-virt.hdr；A 反编译 ConanVersionHeadersResponseDecorator 与 reverse spec §2 双证）。
        reverse spec §2 置信度 中→高（双端活体）
    body: { format: none, literal: '' }
  side_effects: []
  error_behavior:
    - { when: 'repo 不存在', ref: conan/error-envelope-family, note: 'A=401 Authentication is required（鉴权先于路由+匿名关）/ B=404 Failed to find the repository——实例姿态差非协议面（npm m02 先例），差分认证臂不触' }
    - when: '请求带 X-Conan-Client-Version'
      note: >-
        版本检查头 `X-Conan-Client-Version-Check`：值映射 <0.16→deprecated / <0.20→outdated / =0.20→current /
        >0.20→server_outdated。**B 侧四值活体全证**（v2/ping 臂 v2-01c-vcv-*.hdr，B 在 v1/v2 ping 均可达）；
        A 侧未取证（v2/ping 无路由、本轮未在 v1/ping 携带该头——差分批跑补臂）——不立双端断言，B as-built 值记档
  binflow_state:
    verdict: 'SAME（v1/ping local+virtual 两臂能力头逐字双绿——含 only_v2 追加）'
    detail: 'v1-12b：A/B 均 200 空体+同能力头；fix 腿：v1/ping on virtual 双端 200+only_v2 逐字同。conan 2.31.2 全部操作首跳 v1/ping（22 腿 wire 证）——本端点即 conan 2 客户端的实际能力协商面'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat-l0181-74656514 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L018-conan-evidence.md, anchor: '§1 v1-12 / v1-21 行 + §5 能力头双证行', date: '2026-09-13' }
    - { kind: difftest, report: reports/compatibility/l018-wire/a/conan/v1-12b-ping-authed.hdr, anchor: '能力头三只', capture: 'b/ 同名 + fix-{a,b}-v1ping-virt.hdr（only_v2）+ b v2-01c-vcv-*.hdr（版本检查四值 B 侧）', date: '2026-09-13' }
    - { kind: decompile, report: reverse-src/artifactory-7.161.20-partial/src/batch2-protocol/org/artifactory/addon/conan/rest/ConanResource.java, anchor: 'L104-116 handlePing / L284-288 assertConanV2Ready', date: '2026-09-13' }
  confidence: high
  status: VERIFIED
# ── 握手：认证三端点（双前缀） ───────────────────────────────────────────────
- id: conan/handshake-auth
  feature: 'users/authenticate（200 体=token 字符串）+ users/check_credentials（200 空/401）——v1/v2 双前缀，conan 2 走 v2、conan 1 走 v1（双版活体）'
  surface: 'GET <conanBase>/{v1|v2}/users/authenticate；GET <conanBase>/{v1|v2}/users/check_credentials'
  request:
    method: GET
    path: '<conanBase>/{v1|v2}/users/{authenticate,check_credentials}'
    headers: { Authorization: 'authenticate=Basic <valid>；check=Bearer <token>（conan 客户端 login 后形态）' }
    query: {}
  authentication: { type: 'basic（authenticate）/ bearer（check）', role: user }
  expect:
    arms:
    - when: 'authenticate 凭据正确（v2 前缀=conan 2.31.2 实走；v1 前缀=conan 1.66 实走）'
      status: 200
      headers: { note: 'A 带全套 X-Conan-* 能力头（响应装饰器全覆盖）；B 同——literal 断言见 handshake-ping' }
      body:
        format: any
        note: >-
          纯文本 token：A=JWT RS256 806B（jfrt subject）/ B=opaque 64hex——值 placeholder（R3），非空为断言面。
          conan 客户端 opaque 消费（Bearer 直传）；GitLab 同端点 JWT——token 格式非协议面
    - when: 'check_credentials 好 token'
      status: 200
      body: { format: none, literal: '' }
    - when: 'authenticate 坏凭据 / check 坏 token'
      status: 401
      body: { format: any, note: 'status=断言面；message 措辞差（A `Bad Credentials`/`Props Authentication Token not found` vs B `invalid credentials`）=D2 子族②——L019 分立 #conan/auth401-wording 待裁' }
  side_effects:
    - 'conan 1.66 login：v1/ping→v1/users/authenticate 两交换（wire v1-13）；conan 2.31.2 login：仅 v2/users/authenticate 一交换（wire v2-02）——双版前缀偏好双证（reverse spec §2 修正行活体确认）'
    - '客户端后续请求带 Bearer（check_credentials 为 login 后校验跳）'
  error_behavior: []
  binflow_state:
    verdict: 'SAME（authenticate 200 非空 token / check 200 空 / 坏凭据 401——状态面全绿；token 形态与 401 措辞注记不裁）'
    detail: 'v2-02b：A 806B JWT / B 64B opaque（R3 placeholder）；v2-02c/v2-03b：401/401（措辞 D2）；v2-03a/v1-14：200 空/200 空；CLI 腿 v2-02-login/v1-13-login wire 双端同构、exit=0'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat-l0181-74656514 }
  evidence:
    - { kind: difftest, report: reports/compatibility/l018-conan-evidence.md, anchor: '§1 v2-02/v2-03/v1-13/v1-14 行', date: '2026-09-13' }
    - { kind: difftest, report: reports/compatibility/l018-wire/a/conan/v2-02b-authenticate.body, anchor: 'JWT 形态', capture: 'b/ 同名（opaque）+ {a,b}/client/wire/{v2-02-login,v1-13-login}.wire（真实 CLI 前缀偏好）', date: '2026-09-13' }
  confidence: high
  status: VERIFIED
# ── v2/ping 存在性（D1——超集姿态） ──────────────────────────────────────────
- id: conan/v2ping-posture
  feature: 'v2/ping 路由存在性：A 无此路由（400 replication catch-all）；B 实现（200+能力头）——client-blind 超集'
  surface: 'GET <conanBase>/v2/ping'
  request:
    method: GET
    path: <conanBase>/v2/ping
    headers: { Authorization: 'Basic <valid>（匿名/认证双臂同结果）' }
    query: {}
  authentication: { type: any, role: any }
  expect:
    arms:
    - when: 'A（参照直发）'
      status: 400
      body:
        format: any
        json: { keys_exact: [errors], note: 'message=`Couldn''t perform replication, check server logs for more information.`——v2/ping 落入 ConanResource L199-208 replicationDownloadFile catch-all（A 的 ping 路由仅 @Path("{repoKey}/v1/ping")，L105）' }
    - when: 'B（BinFlow 直发）'
      status: 200
      headers: { note: '能力头三只同 v1/ping（v2-01b）；virtual 臂追加 only_v2（v1-21b）——reverse spec §2 的 {v1|v2} 形态 B 全实现' }
      body: { format: none, literal: '' }
    divergence_note: >-
      **D1（UNKNOWN，倾向 B 保留）**：conan 2.31.2 全部 22 腿 wire 首跳均 v1/ping、零 v2/ping 调用——真实
      conan 客户端不可达面（client-blind），BinFlow= wider-than-reference 超集（npm `/-/v1/login` 姿态先例）。
      **连带勘误**：reverse spec §2 握手表 `{v1|v2}/ping` 行对参照不成立（A 仅 v1）；conan.md 该行需修。
      **L019 裁定（2026-09-14）**：**不实现——INTENTIONAL 候裁**。conductor 方向=保留 B 超集不裁撤
      （client-blind 面+反编译 ConanResource.java L105 仅 v1 路由双证；npm `/-/v1/login` 先例同型），
      终局 INTENTIONAL 分类登记归 compatibility-engineer；实现面无动作（B 维持 200+能力头）。
  side_effects: []
  error_behavior: []
  binflow_state:
    verdict: 'DIVERGENT-D1（A 400 replication / B 200+能力头——client-blind 超集；**L019 裁不实现=INTENTIONAL 候裁**，分类登记待 compatibility-engineer）'
    detail: 'v2-01a/b：A 400（anon/authed 同）；v2-01c 四值版本检查 A 不可达/B 四值齐；v1-21b：A virtual 400 / B 200+only_v2。L019 后 B 维持不变（裁定不裁撤超集）'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat-l0181-74656514 }
  evidence:
    - { kind: difftest, report: reports/compatibility/L018-conan-evidence.md, anchor: '§1 v2-01 行 + §3-D1', date: '2026-09-13' }
    - { kind: difftest, report: reports/compatibility/l018-wire/a/conan/v2-01b-ping-authed.body, anchor: '400 replication 文案', capture: 'b/ 同名（200 空+能力头）+ b v2-01c-vcv-0.20.0.hdr（current）', date: '2026-09-13' }
    - { kind: decompile, report: reverse-src/artifactory-7.161.20-partial/src/batch2-protocol/org/artifactory/addon/conan/rest/ConanResource.java, anchor: 'L105（仅 v1/ping 路由）+ L199-208（catch-all）', date: '2026-09-13' }
  confidence: high
  status: DIVERGENT
  divergence_ref: known-divergence.yaml#conan/v2ping-superset（登记建议——L018 回报 conductor）
# ── v2 上传（文件 PUT + checksum-deploy 舞步） ───────────────────────────────
- id: conan/v2-upload
  feature: 'v2 文件上传：revisions 探测 404→PUT files/{path} 201；每文件 checksum-deploy 探测舞步（X-Checksum-Deploy:true 零体 PUT→404→实体 PUT 201）'
  surface: 'PUT <conanBase>/v2/conans/<ref>/revisions/{rRev}/files/{path}（recipe 面）+ …/packages/{pid}/revisions/{pRev}/files/{path}（pkg 面）'
  request:
    method: PUT
    path: '<conanBase>/v2/conans/<name>/<ver>/<user>/<ch>/revisions/{rRev}/files/{path}'
    headers: { Authorization: 'Bearer <token>', 'X-Checksum-Sha1': '<file sha1>', 'X-Checksum-Deploy': 'true（探测跳）——conan 2.31.2 实发形态（wire 亲证）' }
    body: '文件字节（探测跳 0B / 实体跳全量）'
    query: {}
  authentication: { type: bearer, role: user }
  expect:
    arms:
    - when: '新 ref（revisions GET 预探测）'
      status: 404
      note: '上传前序：GET revisions 404（新包判定）——CLI wire 首交换族'
    - when: 'checksum-deploy 探测跳（0B + X-Checksum-Deploy:true）'
      status: 404
      note: '库内无同 sha1 blob → 404（checksum_deploy 能力）——客户端随即发实体跳；**命中面（同 blob 已在库→引用建 201）本轮双端未触达，后段臂**'
    - when: '实体跳（全量字节+X-Checksum-Sha1）'
      status: 201
      body: { format: none, literal: '' }
  side_effects:
    - '首个文件 PUT 成功后修订登记（rrev 进 index.json + .timestamp）——conan 2.31.2 upload 后 list 立即可见（CLI 腿 v2-08 前 200 revisions 证）'
    - 'recipe 全套→pkg 全套顺序上传（conanfile.py/conanmanifest.txt→conan_package.tgz/conaninfo.txt/conanmanifest.txt）'
  error_behavior:
    - { when: '匿名（无凭据）', note: 'A 实例匿名关不可达臂；401 姿态归 handshake-auth 族——批跑补臂' }
  binflow_state:
    verdict: 'SAME（14 交换逐交换同构：请序/状态码全同——客户端可见面最强证据）'
    detail: 'wire v2-04-upload.wire（r1）+ v2-05-upload-r2.wire：双端 ping→revisions 404→pkg-revisions 404→check_credentials→5 文件×(探测 404→实体 201) 完全同构；rrev 双端逐字同（91eaead8…/1d56f752…——客户端计算的内容哈希跨实例可比）'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat-l0181-74656514 }
  evidence:
    - { kind: difftest, report: reports/compatibility/l018-wire/a/client/wire/v2-04-upload.wire, anchor: '14 交换全 wire（含 X-Checksum-Deploy 头）', capture: 'b/ 同名 + {v2-05-upload-r2,fix-{a,b}-upload}.wire', date: '2026-09-13' }
    - { kind: difftest, report: reports/compatibility/L018-conan-evidence.md, anchor: '§1 v2-04 行 + §2 上传行（舞步图）', date: '2026-09-13' }
  confidence: high
  status: VERIFIED
# ── v2 修订链 ───────────────────────────────────────────────────────────────
- id: conan/v2-revision-chain
  feature: '修订链读面：latest（单修订+time）/revisions（time 降序，首项=latest）；rrev 客户端计算、跨实例逐字同（断言面）'
  surface: 'GET <conanBase>/v2/conans/<ref>/{latest,revisions}'
  request:
    method: GET
    path: '<conanBase>/v2/conans/<name>/<ver>/<user>/<ch>/{latest,revisions}'
    headers: { Authorization: 'Basic <valid>' }
    query: {}
  authentication: { type: basic, role: user }
  expect:
    arms:
    - when: 'latest（多修订 ref）'
      status: 200
      body:
        format: any
        json:
          keys_exact: [revision, time]
          path_literal:
            revision: '<rrev——32hex（conan 2.31.2 活体=conanmanifest md5 形态；**spec §5「sha256 64hex」勘误**）；同内容双端同值>'
          note: 'time 归一（R1：A `…+0000` ≡ B `…Z`，毫秒保留）后比对；值本身=服务端写时刻（非断言面，R1 归一后形态断言）'
    - when: 'revisions（多修订）'
      status: 200
      body:
        format: any
        json:
          keys_exact: [reference, revisions]
          note: >-
            reference=`<name>/<ver>@<user>/<ch>` 逐字；revisions[] 按 time 降序（首项=latest——双端同序）；
            双 rrev（内容修订 r1/r2）双端逐字同序。wire_format 归一（R2：A pretty ≡ B compact）
    - when: 'ghost ref latest/revisions'
      status: 404
      body:
        format: any
        json: { keys_exact: [errors], 'errors[0].message': 'Not Found' }
        note: 'L019 对齐后双端同构 envelope（conan/error-envelope-family）；indent 归 R2'
  side_effects: []
  error_behavior:
    - { when: '无修订', ref: conan/error-envelope-family }
  binflow_state:
    verdict: 'SAME（rrev 值+链结构+降序双绿；time/indent 归一依赖 R1/R2）'
    detail: 'v2-05b/c：A `1d56f752…/91eaead8…` = B 同值同序；ghost v2-05d 状态 404/404（文案 D2）；fix-{a,b}-latest 复验'
  version: { artifactory_ref: 7.161.20, binflow_tested: uat-l0181-74656514 }
  evidence:
    - { kind: difftest, report: reports/compatibility/l018-wire/a/conan/v2-05c-revisions.body, anchor: '双修订链（pretty+`+0000` time）', capture: 'b/ 同名（compact+Z）+ v2-05b/fix-*', date: '2026-09-13' }
    - { kind: difftest, report: reports/compatibility/L018-conan-evidence.md, anchor: '§1 v2-05 行 + §5 rrev 勘误行', date: '2026-09-13' }
  confidence: high
  status: VERIFIED
# ── v2 包面读+下载 ──────────────────────────────────────────────────────────
- id: conan/v2-package-download
  feature: '包修订链（packages/{pid}/{latest,revisions,files/{path}}）+ 文件读面 + 真实 conan 2 install 腿——制品字节平价'
  surface: 'GET <conanBase>/v2/conans/<ref>/revisions/{rRev}/packages/{pid}/revisions/{pRev}/files/{path}；GET …/files/{path}（recipe 面）；SEQUENCE=conan install --requires'
  request:
    method: GET
    path: '<conanBase>/v2/conans/<ref>/revisions/{rRev}[/packages/{pid}/revisions/{pRev}]/files[/{path}]'
    headers: { Authorization: 'Basic <valid>（curl 腿）/ Bearer（CLI 腿）' }
    query: {}
  authentication: { type: 'basic|bearer', role: user }
  expect:
    arms:

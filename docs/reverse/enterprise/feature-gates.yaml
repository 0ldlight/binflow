    - "若未安装 license → 跳过企业实现，选 default"
    - "检查 @SubscriptionTypeBlockedAddon——当前订阅类型在 blocked 列表中 → 跳过该实现"
    - "若类标 @EdgeAddon——要求 edge 或 mixedEdge"
    - "若类标 @EnterprisePlusAddon——要求 entPlus 且非 mixedEntPlus"
    - "若类标 @EdgeBlockedAddon——edge 或 mixedEdge 时跳过"
    - "以上均通过 → 返回该企业实现"
    - "无任何企业实现通过 → 返回 default 实现；若 default 也为 null → IllegalStateException"


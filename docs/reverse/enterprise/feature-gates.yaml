meta:
  title: Artifactory 三层门控矩阵
  role: evidence-index（门控判定）
  sources:
    A: "反编译源码 /Users/lzw/workspace/artifactory-decompiled/backend（7.161.24，只读）"
    B: "运行时参照实例 http://localhost:8082（7.161.20 Enterprise Plus Trial，凭据经本地环境变量，E4 实测）"
    C: "安装包 /Users/lzw/Downloads/artifactory-pro-7.161.16"
    D: "JFrog 官方公开文档"

three_layer_model:
  overview: "Artifactory 的功能可见性由三层独立但串联的机制决定，任一层拒绝即功能不可用。"
  request_flow: "请求 → L1 Addon 装配层 → L2 License Tier 层 → L3 Entitlement 细粒度层 → 业务逻辑（L1 看 addon.xml 是否存在 + addons.disabled + HA 配置；L2 看 Product.Type + SubscriptionType + trial/expiry；L3 看 isEntitled + @Entitlement AOP + JFConnect/legacy fallback）"
  layers:
    - name: "L1 Addon 装配层（物理存在 + 开关）"
      loading: "启动期扫描所有 classpath 下 META-INF/addon.properties，为每个 addon 创建 AddonInfo（A=artifactory-config/org/artifactory/spring/SpringConfigResourceLoader.java:65-130）"
      initial_state: "默认 INACTIVATED；addon name 出现在系统属性 addons.disabled（CSV）则置 DISABLED；非 HA 部署时 ha 强制 DISABLED（A=同文件 75-79 行）"
      activation: "license 加载成功后 activateAddons 将所有非 DISABLED 的 addon 置 ACTIVATED；HA addon 额外检查 isEntitled(HA) && isHaConfigured()，否则置 NOT_CONFIGURED 或 NOT_LICENSED（A=artifactory-common/org/artifactory/addon/AddonsManagerBase.java:95-120）"
      query: "isAddonSupported(AddonType) = addon 存在且 state == ACTIVATED（A=同文件 90-93 行）"
      runtime_disable: "artifactory.system.properties 中 addons.disabled=<csv> 可在不改代码情况下屏蔽任意 addon（A=artifactory-config/org/artifactory/common/ConstantValues.java:37）"
    - name: "L2 License Tier 层（产品许可类型）"
      product_types: [OSS, COMMERCIAL, COMMERCIAL_XWE, ARCHIVE_TRIAL, ARCHIVE, EDGE_TRIAL, EDGE, TRIAL, TRIAL_XWE, ENTERPRISE, ENTERPRISE_PLUS_TRIAL, ENTERPRISE_PLUS]
      product_types_source: "A=artifactory-addons-manager/org/jfrog/license/api/Product.java:150-206"
      subscription_types: [NONE, FREE, FREE_XRAY, PRO, PRO_TEAM, PRO_XRAY, PRO_TEAM_WITH_AUTH, ENTERPRISE_TEAM, ENTERPRISE_XRAY_TEAM, ENTERPRISE_PLUS]
      subscription_types_source: "A=jfrog-platform/org/jfrog/common/platform/subscription/SubscriptionType.java"
      license_hash_suffix:
        source: "A=ArtifactoryLicenseProvider.getLicenseKeyHash() 412-446 行"
        mapping: { "0": OSS, "1": TRIAL, "2": COMMERCIAL, "3": ENTERPRISE, "4": ENTERPRISE_PLUS, "5": ENTERPRISE_PLUS_TRIAL, "6": EDGE, "7": EDGE_TRIAL, "8": ARCHIVE, "9": ARCHIVE_TRIAL }
        runtime_evidence: "B 实测 /api/system/version.license=26a15afeb8ddffa50e93bc1ad6f20817574b77275（末位 5 = Enterprise Plus Trial），与 /api/system/license.type 一致（E4）"
      tier_predicates:
        - { method: isEnterprisePlusInstalled, predicate: "type ∈ {ENTERPRISE_PLUS, ENTERPRISE_PLUS_TRIAL}" }
        - { method: isEdgeLicensed, predicate: "type ∈ {EDGE, EDGE_TRIAL}" }
        - { method: isArchiveLicensed, predicate: "type ∈ {ARCHIVE, ARCHIVE_TRIAL}" }
        - { method: isBasicEnterpriseLicensed, predicate: "type == ENTERPRISE（AOL dedicated 模式下 trial 也算）" }
        - { method: isEnterpriseLicensed, predicate: "isBasicEnterprise ∨ isTrial ∨ isEdge" }
        - { method: trialLicenseExpired, predicate: "type.isTrial() && expires < now" }
        - { method: isReadOnly, predicate: "termedLicense && expired（term license 过期后降级只读）" }
      license_storage: "单机模式读 $ARTIFACTORY_HOME/etc/artifactory.lic（或 artifactory.cluster.license 回退）；HA 模式走 DB（a.java）。B 实测容器内 /opt/jfrog/artifactory/var/etc/artifactory/artifactory.lic 10760 字节 base64（E4）"
    - name: "L3 Entitlement 细粒度层"
      declared_count: 39
      referenced_count: 45
      entry_point: "AddonsManager.isEntitled(EntitlementType) → 优先查 EntitlementService（JFConnect），fallback 到 LicenseAddonsManagerImpl.isEntitled() 硬编码 switch（A=AddonsManagerImpl.java:404-430、LicenseAddonsManagerImpl.java:576-638）"
      enforcement_mode: "当 EntitlementService.isEnforced()==true（JFConnect 服务端开启强制）时完全以 JFConnect 返回值为准，忽略本地 license 判定；否则本地 license 判定为主（A=AddonsManagerImpl.java:268-270,414-430）"
      entitlement_aop: "REST resource 类标注 @Entitlement(value=...) 时，EntitlementAdvice 拦截方法调用——isEntitled(value)==false 直接返回 403（A=artifactory-rest-common/org/artifactory/rest/common/aop/EntitlementAdvice.java:44-50）"
      aop_annotated_classes:
        - { class: SsoAddonImpl, entitlement: OAUTH }
        - { class: CrowdSsoResource, entitlement: CROWD }
        - { class: LdapGroupResource, entitlement: LDAP }
        - { class: SamlResource, entitlement: SAML }
        - { class: OAuthResource, entitlement: OAUTH }
        - { class: HaCommonAddon, entitlement: HA }
        - { class: ArchivePolicyAddon, entitlement: JFRT }
        - { class: CleanupPolicyAddon, entitlement: JFRT }
        - { class: DistributionAddon, entitlement: RELEASE_BUNDLES_READ }
        - { class: KeysAddon, entitlement: RELEASE_BUNDLES_READ }
        - { class: ReleaseBundleAddon, entitlement: RELEASE_BUNDLES_READ }
        - { class: ReplicationAddon, entitlement: REPO_REPLICATION }
        - { class: ArtifactRetentionAddon, entitlement: JFRT }
        - { class: EdgeSmartRepoAddon, entitlement: EDGE }
        - { class: XrayAddon, entitlement: JFXR }
        - { class: SecurityResourceAddon, entitlement: JFRT }
      gating_annotations:
        - { annotation: "@EnterprisePlusAddon", semantics: "要求 Enterprise Plus tier", classes: [DistributionAddon, KeysAddon, ReleaseBundleAddon] }
        - { annotation: "@EdgeAddon", semantics: "要求 Edge tier", classes: [EdgeSmartRepoAddon] }
        - { annotation: "@EdgeBlockedAddon", semantics: "Edge tier 下禁用", classes: [ArchivePolicyAddon, CleanupPolicyAddon, ReplicationAddon, ArtifactRetentionAddon, XrayAddon] }
        - { annotation: "@SubscriptionTypeBlockedAddon", semantics: "指定订阅类型下禁用", classes: "SsoAddonImpl blocks FREE/FREE_XRAY/PRO_TEAM" }
      annotation_dispatch_source: "A=LicenseAddonsManagerImpl.a(Collection,Class,...) 799-873 行"


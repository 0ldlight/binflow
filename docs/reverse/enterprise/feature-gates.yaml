# Artifactory 三层门控矩阵（feature-gates）
#
# **证据索引**：本文件是 `docs/reverse/enterprise/` 系列中的「门控判定」清单。
# - A = 反编译源码 `/Users/lzw/workspace/artifactory-decompiled/backend`（7.161.24，只读）。
# - B = 运行时参照实例 `http://localhost:8082`（7.161.20 Enterprise Plus Trial，凭据经本地环境变量（不入库），E4 实测）。
# - C = 安装包 `/Users/lzw/Downloads/artifactory-pro-7.161.16`。
# - D = JFrog 官方公开文档。
# - E 等级：E1=A+B+C+D；E2=A+B；E3=A；E4=B；E5=C/D。
# - clean-room：仅记录可观察的门控行为与判定路径，不翻译代码。
# - 生命周期行为规格（lockdown 触发的 API 响应细节）见同目录 license-behavior.md。

# ═════════════════ 横切协议传输面（22 项，inv-3 §3 全量） ═════════════════
cross_cutting:
  path_normalization:   # ArtifactoryRequestBase.calculateRepoPath 中枢，6 项
  - {id: XC-1, capability: 矩阵参数, behavior: "路径（含 repoKey 段）;k=v;k2=v2 整体剥离转部署属性随 PUT 存储；属性键校验失败 400", confidence: high}
  - {id: XC-2, capability: pypi-前缀剥离, behavior: "请求路径以 list/ 或 simple/ 开头时跳过该前缀再取 repoKey", confidence: high}
  - {id: XC-3, capability: 归档内路径, behavior: "<name>.<archExt>!/inner/path 按需解包成员读取；strictArchiveDotSlash 开关；扩展名集合来自 mimeTypes 配置", confidence: high}
  - {id: XC-4, capability: dot-segment-归一化, behavior: "/./ 与结尾 /. 折叠；矩阵参数段外路径先归一化再拼回", confidence: high}
  - {id: XC-5, capability: plus-号解码, behavior: "URL 解码前把 + 换成 %2B 再还原（防 query 语义污染路径）", confidence: high}
  - {id: XC-6, capability: repoKey-别名, behavior: substituteRepoKeys 映射表路径层 repoKey 替换, confidence: medium}
  upload_features:      # UploadServiceUtils + mpu，4 项
  - {id: XC-7, capability: checksum-部署, behavior: "X-Checksum-Deploy: true 零 body；按 sha1/sha256 库内寻 blob 建引用；找不到失败", confidence: high}
  - {id: XC-8, capability: filestore-存在性检查, behavior: "X-Check-Binary-Existence-In-Filestore 布尔头仅查不建条目", confidence: high}
  - {id: XC-9, capability: 客户端断点续传, behavior: "/api/v1/uploads 六件（token→urlPart→status/abort/complete(sha1)）；scope internal:mpu:x", confidence: high}
  - {id: XC-10, capability: 属性部署校验, behavior: "矩阵参数属性键经 PropertyNameValidator，非法键 400", confidence: high}
  download_cache:      # 5 项
  - {id: XC-11, capability: 条件请求, behavior: "ETag/If-None-Match（W/ 与引号剥离）；If-Modified-Since 与 Last-Modified 并存取 max", confidence: high}
  - {id: XC-12, capability: Range, behavior: "Range 头存在即 byte range 切片 206", confidence: high}
  - {id: XC-13, capability: 目录下载, behavior: "folderDownloadConfig 整目录 zip（默认关：1024MB/5000 文件/10 并发/匿名单独开关/空目录开关）", confidence: high}
  - {id: XC-14, capability: 下载重定向, behavior: "downloadRedirect（>阈值重定向源站）与 CDN 重定向（CdnRedirectRepoConfig）", confidence: medium}
  - {id: XC-15, capability: 递归环防护, behavior: "X-Artifactory-Originated/Origin-Artifactory 头识别；多 origin 且含本机 hostId 判递归", confidence: medium}
  protocol_auth:       # 3 项
  - {id: XC-16, capability: docker-bearer-challenge, behavior: '401 WWW-Authenticate: Bearer realm=…,service=…(,scope=…)+Docker-Distribution-Api-Version；token URL 模板 {repoKey}/{v1|v2}/token', confidence: high}
  - {id: XC-17, capability: 按型强制认证, behavior: "forceMaven/Conan/Nuget/P2Authentication、cargoAnonymousAccess（反向放行）、hex 公钥校验", confidence: high}
  - {id: XC-18, capability: 外部依赖重定向, behavior: "externalDependenciesEnabled+Patterns+RemoteRepoRef：虚拟仓匹配模式重定向指定远端仓（Go/VCS/npm/bower/helm/swift/p2/vscode 各自实现）", confidence: high}
  events:              # 4 项
  - {id: XC-19, capability: webhook, behavior: "反编译集合缺 addon/webhook 模块；公开文档定义 artifact/docker/property/release-bundle/retention 事件族——以官方文档为唯一来源（webhook.md 承载）", confidence: "low(代码侧)/文档侧存在"}
  - {id: XC-20, capability: watch-邮件通知, behavior: "watch 标记 + events.properties HTML 邮件模板汇总", confidence: medium}
  - {id: XC-21, capability: jfevent-内部总线, behavior: "artifact/docker/retention/release.bundle 事件模型消费面", confidence: medium}
  - {id: XC-22, capability: X-Artifactory-头族, behavior: "29 个内部头（Created/Modified-By/Trace-Id/HA-Originated*/Project-Key/Pass-Through 等）用于复制/HA/追踪/云直传", confidence: high}


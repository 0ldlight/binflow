# ───────────────────────── docker ─────────────────────────
- protocol: docker
  category: 容器/OCI
  entry_point: "三形态：路径前缀 /<repoKey>/v2/（默认）｜子域 /<repoKey>.host/v2/｜直连 /artifactory/api/docker/<repoKey>/v2/；token=/api/docker/<repoKey>/{v1|v2}/token"
  repository_type: [local, remote, virtual（含 remote-cache）]
  transport: "HTTP；全端点强制 Docker-Distribution-Api-Version: registry/2.0 头"
  authentication: "401 Bearer challenge（realm=自身 token 端点、service=host、scope 按端点推导 repository:<image>:pull[,push,delete] / registry:catalog:*）；Basic 凭据换 token（expires_in 3600）"
  authorization: "scope 不逐项校验，资源端点判 r/w/d；manifest 覆盖需 DELETE 权限（strict tag overwrite）"
  upload: "POST /v2/<name>/blobs/uploads（202+Location+Docker-Upload-UUID=<uuid>.patch）→ PATCH 追加（Content-Range 起点严格=已存字节数，错 416 空 body）→ PUT ?digest= 收尾（sha256 不符 400 BLOB_UPLOAD_INVALID+删临时文件）；POST ?digest= 单体一步 201；会话=仓内 <image>/_uploads/<uuid>.patch 文件本体，重启存活"
  download: "GET blob/manifest；manifest Accept 协商 6 媒体类型 + UA 覆盖开关 + schema2→1 转换；HEAD blob 附全套 X-Checksum 头（blob 搜索默认全 repo 跨仓复用）；空层 digest sha256:a3ed95ca… 直接合成"
  delete: "manifest by-digest（搜全部副本逐一删，202/500 INTERNAL_ERROR）；by-tag 为 Artifactory 私有扩展；单 blob DELETE 不支持（依赖 GC）"
  search: "_catalog 与 tags/list（缓存文件 .jfrog/repository_v2.catalog 与 tags_v2.json，懒构建）；权限过滤；TreeSet 字典序 last/n 分页 + Link 头；n 缺省=全量（官方 100，偏离）；空 tags=404 NO_TAGS_FOUND（官方 200 空数组，偏离）"
  metadata: "manifest 存 <image>/<tag>/manifest.json|list.manifest.json；blob=<alg>__<hex>；属性 docker.manifest.type/docker.label.*/docker.referrers.*"
  checksum: "digest=sha256（blob PUT 收尾强校验）；manifest Docker-Content-Digest 头；HEAD 附 X-Checksum-Md5/Sh1/Sha256"
  range: "GET 上传状态 204+Range 0-<len-1>（.patch 变体，官方标准端点未实现）"
  streaming: "PATCH 全量流式上传（无 Content-Range）；追加=SequenceInputStream 串接重存非原地 append"
  cache: "catalog/tags 索引文件缓存；_uploads 24h 过期清理（cron 每日 + manifest PUT 成功同步清理）"
  remote: "DockerV2RemoteRepoHandler 代理模式 v2 差异——M3 逆向待补（docker-registry.md 待验证#3，UNKNOWN）"
  error: '{"errors":[{code,message,detail}]}；私有码 SIZE_INVALID/NO_TAGS_FOUND/NOT FOUND（含空格）/INTERNAL_ERROR；无 BLOB_UPLOAD_UNKNOWN（404 BLOB_UNKNOWN 替代）；manifest 校验缺 blob=MANIFEST_INVALID 而非官方 BLOB_UNKNOWN'
  client: "docker CLI（push/pull/login）；老 docker UA 兼容规则 ^(docker/1.3-1.7|Go )"
  configuration: "blockPushingSchema1(默认true)/maxUniqueTags/dockerTagRetention(默认1)/resolveDockerTagsByTimestamp/cachingLocalForeignLayers/dockerApiVersion(默认V2)/dockerEnforceSearchBlobUnderImage/dockerCopyBlobToUploadsEnabled(默认false)/oci.accepted.user.agents.list"
  tests: "BinFlow 侧：docker×16 ops 已 ✅（rest-compat D12 行1）；v1 兼容面不实现"
  evidence: docker-registry.md 全文（官方 [DIST-API]/[OCI] 为基准）/ inv-3 §2.2 DOCKER / rest-compat §11.1 行1
  confidence: high
# ───────────────────────── maven ─────────────────────────
- protocol: maven
  category: JVM/构建系
  entry_point: "存储命名空间 /<repoKey>/<orgPath>/<module>/<version>/<file>（无 /api 段）；管理面 /api/maven/calculateMetadata|generatePom"
  repository_type: [local, remote, virtual]
  transport: HTTP（普通文件 GET/PUT/DELETE）
  authentication: "通用认证链（Basic/Bearer）；仓级 forceMavenAuthentication 开关（默认 false）"
  authorization: "路径 r/w/d；handleReleases/handleSnapshots=false 时 PUT→409"
  upload: "PUT 直传（jar/pom/maven-metadata.xml/.sha1/.md5）；snapshot 文件名按 snapshotVersionBehavior 改写（unique=时间戳-buildNumber，buildNumber 取 metadata+1，可注入 build.timestamp 矩阵参数；non-unique/deployer 原样）"
  download: "GET/HEAD；checksum 伴随文件 GET=服务端自算值下发（remote 仓绝不回源 checksum，404 Checksums are not downloadable.）；最新版 token SNAPSHOT/[RELEASE]/[INTEGRATION] 路径解析（BinFlow 缺位）"
  delete: "DELETE + 受影响目录 metadata 异步重算"
  search: "AQL + /api/search/{gavc,versions,latestVersion,artifact}；UI artifactsearch"
  metadata: "三级 maven-metadata.xml 服务端主动计算（版本组目录/版本目录/virtual 合并）：versions=含 *.pom 子目录集、latest/release 按 Maven 版本序、snapshot buildNumber 连续性、snapshotVersions（Maven 3）；virtual 合并去重重排不缓存"
  checksum: ".sha1/.md5 伴随上传走通用校验和文件链（>1024B 409）；metadata 伴随含 .sha512；client-checksums 策略不匹配 409"
  range: "通用内容面 Range 语义（rest-api.md §1.4）"
  streaming: 通用内容面流式
  cache: "remote 元数据可过期缓存（repo-semantics §7.4）；virtual metadata 每请求现算"
  remote: "代理 Maven central 等上游；checksum 文件不代理（见 download）；unique snapshot 解析"
  error: "统一 errors[] 信封；409 SnapshotPolicy（handleReleases/Snapshots 拒绝）"
  client: mvn/gradle（deploy/resolve）
  configuration: "suppressPomConsistencyChecks/fetchJarsEagerly/fetchSourcesEagerly/rejectInvalidJars/pomRepositoryReferencesCleanupPolicy(默认discard_active_reference)/snapshotVersionBehavior(默认unique)/checksumPolicyType(默认client-checksums)"
  tests: "BinFlow 侧已有（元数据计算自动链 ✅；显式 REST 触发 ◐）"
  evidence: maven-npm-pypi.md §1（[MVN-MD] 为基准）/ inv-3 §2.1 MAVEN / rest-api.md §1
  confidence: high
# ───────────────────────── npm ─────────────────────────
- protocol: npm
  category: 语言生态管理器
  entry_point: "/api/npm/<repoKey>/…（域根 GET 200 空 body 探测）；认证族 /-/…"
  repository_type: [local, remote, virtual]
  transport: HTTP（JSON 文档 + tarball 流）
  authentication: "Basic/Bearer + legacy couch login：PUT /-/user/org.couchdb.user:<username>（body 凭据，无认证头）→ 201 {ok,id,token}；/-/whoami 401+Basic challenge；/-/v1/login 不实现（客户端 ENYI 回落 couch，正确姿态）"
  authorization: "tarball 路径 w 权限；dist-tags 写=annotate；publish 到已存在版本=403"
  upload: "PUT /{name}（publish 十步校验链：JSON 解析/attachments+versions/写权限/重复版本 403/semver/deprecate 201/integrity sha512/shasum→400）；-rev PUT 恒 200 假成功（rev-dance 占位）"
  download: "GET tarball（.tgz/.tar.gz、scoped 全路径、_external/_relative 私有形态）；dist.tarball 重写为本服务地址（remote 四分支改写算法）；packument ETag=包文档 sha1、304"
  delete: "DELETE 版本/整包（-rev 形态）；unpublish 族"
  search: "/-/v1/search?text=&size=&from=（text 必填 400）；/-/all 旧版全量"
  metadata: ".npm/{name}/package.json（聚合文档）+ .npm/{name}/{name}-{version}.json；属性 npm.name/npm.version/npm.disttag/sha512；SLIM Accept=application/vnd.npm.install-v1+json（npm ci 优化）"
  checksum: "integrity sha512-<base64> 校验（默认信任不强制拒）；dist.shasum→client checksum；ETag/X-Checksum-Sha1=包文档 sha1（非 tarball）"
  range: 不适用（整文件下载）
  streaming: tarball 流式
  cache: "virtual 合并缓存 .npm/{name}/package-{hash}-{STRATEGY}.json，TTL=virtualRetrievalCachePeriodSecs（<600s 视为禁用）；单飞+120s 冲突锁"
  remote: "tarball URL 重写四分支（上游前缀剥离/smart remote /api/npm/ 剥离/同 host _relative/外域重建）+ ?dl= 替代下载模式；X-Artifactory-Origin-Remote-Path 头"
  error: "统一 errors[] 信封 + npm notice 头；重复版本 403 Cannot modify pre-existing version"
  client: npm CLI 10.x（login/publish/install/whoami 实测锚 npm.md live 抓包）
  configuration: 无独立 force 开关（走全局匿名策略）
  tests: "BinFlow 侧 npm×5 认证族 + npm×4 包面 ✅（K60 六条定案）；dist-tags 显式端点族 ◐"
  evidence: maven-npm-pypi.md §2 + npm.md（[NPM-API]/客户端源码即规范）/ inv-3 §2.3 NPM / rest-compat §11.1 行3–5
  confidence: high
# ───────────────────────── pypi ─────────────────────────
- protocol: pypi
  category: 语言生态管理器
  entry_point: "/api/pypi/<repoKey>/…；请求路径层另接受 list/<repo>/ 与 simple/<repo>/ 前缀并剥离（pip 兼容，路径归一化中枢）；域根 GET 200 空"
  repository_type: [local, remote, virtual]
  transport: "HTTP；simple HTML（PEP 503）+ gzip 预压缩（Accept-Encoding 协商）+ multipart 上传"
  authentication: 通用认证链；上传需认证
  authorization: simple 索引读=仓读权限（403 {"error":"Forbidden",...}）；上传=deploy
  upload: "POST multipart（:action 必须严格=file_upload 否则 400 unknown action；content=文件体；md5_digest 可缺失〔twine≥6.2〕；其余字段→属性）；路径={name}/{version}/{filename} 原始名不 normalize；响应统一 200"
  download: "GET /packages/{path}（scoped devpi 形态 {user}/{scope}/…）；simple/{name} 无尾斜杠 302 补斜杠"
  delete: 通用内容面 DELETE
  search: "/pypi/{name}/json legacy warehouse JSON API；XML-RPC POST 搜索（中置信）"
  metadata: ".pypi/{norm}/{norm}.html|.json、simple.html、latest.json、upload_times；normalizePackageName=PEP 503（lower+[-_.]+→-）；属性 pypi.name/pypi.normalized.name/pypi.version/pypi.summary/pypi.requires.python/pypi.yanked"
  checksum: "simple 链接 fragment #sha256= 优先（无 sha256 才 #md5=）；上传只收 md5_digest，sha256 服务端算"
  range: 不适用（整文件）
  streaming: 文件流；gzip 预压缩缓存
  cache: "remote 包不存在负缓存（默认开 TTL 28800s=8h 容量 50000）；virtual 索引合并格式回退（JSON↔HTML）"
  remote: "代理 pypi.org；skipUrlTranslation 参数（poetry UA）；上游索引链接改写为本地"
  error: "统一 errors[] 信封；simple/{name}/{version} 恒 404（保留端点）"
  client: pip/twine（PEP 503/Upload API 实测锚）
  configuration: "repositorySuffix(默认simple)/pyPIRegistryUrl(默认pypi.org)/pypi.simple.json.format.enabled(默认false)/pypi.enforce.layout|naming.normalization(默认false)/负缓存参数"
  tests: "BinFlow 侧 pypi×4 ✅（rest-compat D12 行6）；JSON 元数据两臂 ❌"
  evidence: maven-npm-pypi.md §3（[PEP503] 族为基准）/ inv-3 §2.3 PYPI / rest-compat §11.1 行6–7
  confidence: high

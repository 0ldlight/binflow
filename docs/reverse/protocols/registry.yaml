  checksum: "sha1/md5/sha256 三算；X-Checksum-Sha1 客户端声明服务端比对；client-checksums 策略不匹配 409"
  range: "单区间 206+Content-Range；非法 416+Content-Range: bytes */<total>"
  streaming: "全流式；Expect: 100-continue 去重加速（blob 已存在跳 body）"
  cache: "remote-cache 仓；ETag/304；目录 zip 下载（folderDownloadConfig 默认关：1024MB/5000 文件/10 并发）"

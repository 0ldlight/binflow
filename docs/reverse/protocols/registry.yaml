# ───────────────────────── helm（经典仓） ─────────────────────────
- protocol: helm
  category: 容器/OCI
  entry_point: "经典仓=$BASE/artifactory/api/helm/<repoKey>/（index.yaml/tgz/_external/_transitive 下载面）；上传走内容面 curl -T PUT <repoKey>/<path>.tgz；管理面 POST /api/helm/{repoKey}/reindex[/{path}]"
  repository_type: [local, remote, virtual]
  transport: "HTTP；index.yaml（text/yaml）+ tgz 流"
  authentication: 通用认证链
  authorization: "读=仓读；上传/删除=路径 w/d；reindex=MANAGE"
  upload: "PUT .tgz（201+触发 index 重算事件链：读仓根 index→解析归档根 Chart.yaml+requirements.yaml→写 chart.* 属性→条目覆盖回写）；.prov 普通文件存储不进 index；enforce layout 两开关（forceMetadataNameVersion/forceNonDuplicateChart）403 族"
  download: "GET index.yaml（local=仓根文件/remote=回源/virtual=聚合）；GET tgz/.prov；_external/_transitive 外部依赖代理（模式白名单外 400）"
  delete: "DELETE tgz → 按 chart.name+version 属性从 index 移除条目（属性缺失告警跳过）"
  search: "无独立搜索 API；Packages UI 视图走 chart.* 属性"
  metadata: "index.yaml（apiVersion v1/entries/generated；版本条目 SemVer 降序；digest=sha256 裸 hex；urls 绝对或 relative 开关）；chart.* 属性 13 个；virtual 聚合缓存 .index/<sha256(contextUrl)>/<permissionHashCode>/index.yaml"
  checksum: "index 条目 digest=tgz sha256（无前缀）；上传走统一 checksum 头链"
  range: 不适用
  streaming: tgz 流式
  cache: "virtual 聚合缓存（不同对外 base/权限集各自一条）；local 写事件清缓存；remote URL 变更清缓存；实例 base 变更全仓 reindex"
  remote: "index.yaml 回源原样缓存（可过期元数据）；tgz 回源地址=chartsBaseUrl+相对路径（缺省仓 URL）；_external 回源 <protocol>://<url> 落盘同路径"
  error: "统一 errors[] 信封；virtual index 非仓根请求 404 The index file is being requested from an unsupported location"
  client: "helm 3（repo add/pull/push；tag 严格 SemVer）"
  configuration: "chartsBaseUrl/helm.relative.urls.enabled(代码快照默认false)/forceMetadataNameVersion/forceNonDuplicateChart/useNamespaces(virtual)/externalDependencies{Enabled,Patterns,RemoteRepo}"
  tests: "BinFlow 侧 reindex×2 ✅（rest-compat D12 行9）；经典仓面 M11 议程"
  evidence: helm.md 全文（[HELM-DOC] 为基准）/ inv-3 §2.2 HELM / rest-compat §11.1 行9
  confidence: high

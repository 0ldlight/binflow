  download: "GET/HEAD（ETag=sha1 无引号、Last-Modified、Accept-Ranges、X-Checksum 头族、X-Artifactory-Filename、mimetypes.xml 映射）；Range/If-Range 206/416；304；归档内路径 !/ 语法（横切 XC-3）"

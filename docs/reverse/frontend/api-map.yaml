  - { screen: user-profile,        api: ["GET/PUT /ui/api/v1/ui/userProfile (A)", "POST /ui/api/v1/ui/userIdentifyToken/:user (A)", "/ui/api/v1/ui/userApiKey 族 (A)"], unknown: ["SSH key CRUD wire"] }
  - { screen: ldap-config,         api: ["auth-integration.md §1.4 LDAP UI 端点表 (spec)"], unknown: [] }
  - { screen: oauth-config,        api: ["GET/POST /ui/api/v1/admin/security/oauth (auth-integration §2.1/§2.3)"], unknown: [] }
  - { screen: saml-config,         api: ["GET/PUT /ui/api/v1/admin/security/saml/config (auth-integration §3.1/§3.2)"], unknown: [] }
  - { screen: http-sso,            api: [], unknown: ["整页 wire"] }
  - { screen: crowd-integration,   api: ["PUT /ui/api/v1/ui/crowd (A)"], unknown: ["读取侧 wire"] }
  - { screen: scim,                api: [], unknown: ["整页 wire"] }
  - { screen: vault,               api: [], unknown: ["整页 wire"] }
  - { screen: maintenance,         api: ["GET /ui/api/crontime?cron=<expr> (cron-scheduling §4)"], unknown: ["GC/配额/清理配置读写端点 (疑配置描述符族, 未证)"] }

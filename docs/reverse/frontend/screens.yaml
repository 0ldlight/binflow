# Artifactory Frontend Screen Inventory — evidence index (E1/E2/E4)
#
# > IMPORTANT (clean-room): EVIDENCE INDEX of screens observed in the reference console.
# > NOT a design input for BinFlow pages (program charter §39-41; ADR-0001). Screen behavior
# > details remain in console-ui.md / console-artifactory-parity.md.
#
# four_states legend (per screen): 加载 loading / 空 empty / 错误 error / 成功 success.
#   documented-<E> = 有出处; UNKNOWN = 无证据, 禁猜 (per charter §44).
# Global component-level patterns apply to all list screens (console-ui §5):
#   empty-global  = "No results were found" + "Try to change your search" (E4, 7.84.10 走查)
#   loading-global = 未专项取证 (console-ui §5 标低——树为虚拟滚动渐进渲染)
#   danger-confirm = 标题+后果+Cancel/确认(危险色) 双按钮 (E4)
#   inline-validation = "You must fill in this field" 字段下内联, blur 触发 (E4)
#   pagination = "Showing a - b from c items" + 页码, AG Grid 列头排序 (E4)
# sources: console-ui = docs/reverse/console-ui.md (OSS 7.84.10 live walkthrough);
#          parity = docs/design/console-artifactory-parity.md (pattern anchors);
#          ux4 = docs/design/console-ux.md §5 (BinFlow 侧四态规范——对照用, 非参照证据).


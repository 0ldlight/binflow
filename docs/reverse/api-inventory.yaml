# EVIDENCE INDEX (evidence-index-only) — 仅供发现与对账，禁止作为 BinFlow 结构设计依据（ADR-0001 / 宪章 §39-41）
# Artifactory REST/UI/协议表面端点清单（聚合粒度 = resource × 操作类别）
# 派生源（零新增取证）：docs/reverse/inv-2-surface.md（§0 五层测绘 + §1.A–K 功能族）
#   × docs/reverse/rest-compat-matrix.md（D01–D14 域结构 + 官方 653 条目对账）
#   × docs/reverse/rest-api.md（核心面行为细节）。
# 证据源版本：A=反编译 7.161.24（等价入口 reverse-src/artifactory）｜B=运行时 :8082 7.161.20｜C=安装包 7.161.16。
# 本文件不逐条展开 ≈1,866 方法级操作；每行 = 一个 resource 的一个操作类别（代表 method+path 形态）。
# 认证词汇表：anon=免认证｜user=任意认证用户｜read/deploy/annotate/delete/manage=对应权限位（r/w/n/d/m）｜admin=admin 角色｜UNKNOWN=证据未定位。
# 置信度沿用派生源标注：高=反编译+官方文档双证；中=仅反编译；低=推断/待动态验证。

meta:
  artifact_version: {A: 7.161.24-decompiled, B: 7.161.20-runtime, C: 7.161.16-installer}
  surface_total: {resource_classes: 357, method_level_operations: 1866}   # inv-2 §0 估计（1,800±100）
  aggregation: resource × 操作类别
  layer_counts:   # inv-2 §0（resource 类数 / 方法级操作数）
    core-rest:       {prefix: "/artifactory/api/…",            resources: 103, operations: 475}
    ui-rest:         {prefix: "/artifactory/ui/api/v1/…",      resources: 107, operations: 470}
    protocol-sub:    {prefix: "/{repoKey}/…（按包型分派）",      resources: 22,  operations: 207}
    ph-framework:    {prefix: "/{repoKey}/api/… + 实例级 /api/…", resources: 51, operations: 432}
    addon:           {prefix: "/artifactory/api/…（增值域）",    resources: 74,  operations: 282}
  jersey_assembly: "JerseyApplication 注册扫描 org.artifactory;org.jfrog.repomd;com.jfrog.ph;com.jfrog.bh;com.jfrog.build;com.jfrog.distribution.handler;…；RolesAllowedDynamicFeature（@RolesAllowed 两值 admin/user）；可禁 OPTIONS/WADL；package handler shadowing 开关 artifactory.shadowing.enabled（inv-2 §0）"
  error_envelope: '所有 REST 层错误统一 {"errors":[{"status":<int>,"message":"<string>"}]}；日期 ISO8601 带毫秒时区；vendor 媒体类型同时接受 application/json（rest-api.md §0）'


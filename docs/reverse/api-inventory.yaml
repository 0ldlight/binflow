  - resource: artifact-content            # 存储命名空间（无 /api 前缀，RepoFilter 路由）
    layer: core-rest
    evidence: rest-api.md §1.1–1.5 / inv-2 §1.A
    confidence: 高
    operations:
    - {category: deploy,       method: PUT,    path: "/{repoKey}/{path}",              auth: deploy,  note: "201+Location+FileInfo；矩阵参数属性；X-Checksum 三头；X-Explode-Archive 解包（rest-compat D01 行18）"}
    - {category: mkdir,        method: PUT,    path: "/{repoKey}/{path}/（尾斜杠）",    auth: annotate, note: "201 ItemCreated（FolderInfo 形态）"}
    - {category: checksum-deploy, method: PUT, path: "/{repoKey}/{path}",              auth: deploy,  note: "X-Checksum-Deploy: true 零 body；按 sha1/sha256 库内寻 blob 引用；失败 400/404"}
    - {category: checksum-sidecar, method: PUT, path: "/{repoKey}/{path}.sha1|.md5|.sha256", auth: deploy, note: ">1024B 409；client-checksums 策略不匹配 409"}
    - {category: download,     method: GET,    path: "/{repoKey}/{path}",              auth: read,    note: "ETag=sha1 无引号；Range 206/416；304；X-Artifactory-Filename；?mark=&gcCaches= 同步预热臂"}
    - {category: head,         method: HEAD,   path: "/{repoKey}/{path}",              auth: read,    note: "同 GET 头无 body"}
    - {category: properties-read, method: GET, path: "/{repoKey}/{path}?properties",   auth: read,    note: "内容面属性读（legacy 形态）"}
    - {category: delete,       method: DELETE, path: "/{repoKey}/{path}[?atomic]",     auth: delete,  note: "204；atomic 单事务"}
    - {category: archive-inner-read, method: GET, path: "/{repoKey}/{name}.<archExt>!/inner/path", auth: read, note: "归档内路径按需解包（inv-3 §3.1）；strictArchiveDotSlash 开关"}
  - resource: storage-item              # @Path storage/{path}
    layer: core-rest
    evidence: rest-api.md §3 / inv-2 §1.A / rest-compat D01 行1–8,21
    confidence: 高
    operations:
    - {category: read,            method: GET,    path: "/api/storage/{repoKey}/{path}", auth: read,  note: "FileInfo/FolderInfo；downloadUri 处置=T-493 定案"}
    - {category: read-properties, method: GET,    path: "…?properties[=K1,K2*]",       auth: read,  note: "propertiesXml 臂 Artifactory 有/BinFlow 501（rest-compat D01 行3）"}
    - {category: read-stats,      method: GET,    path: "…?stats",                     auth: read,  note: "StatsInfo 七字段"}
    - {category: read-permissions, method: GET,   path: "…?permissions",               auth: manage, note: "主体名→权限字母集 r/w/n/d/m；非 local/cached 仓 400"}
    - {category: read-last-modified, method: GET, path: "…?lastModified",              auth: read,  note: "目录内最新修改项+Last-Modified 头"}
    - {category: list,            method: GET,    path: "…?list&deep=&depth=&listFolders=&mdTimestamps=&includeRootPath=", auth: user, note: "仅认证用户；根目录 400 Cannot list files of root."}
    - {category: set-properties,  method: PUT,    path: "/api/storage/{repoKey}/{path}?properties=k=v&recursive&atomic", auth: annotate, note: "204；%3B=值内容、raw ';' 使整对脱落（T-447/T-493）"}
    - {category: delete-properties, method: DELETE, path: "同上?properties=k1,k2",     auth: annotate, note: "204；未指定 400"}
    - {category: update-properties, method: POST, path: "同上?recursive&atomic",       auth: annotate, note: "6.1.0+ 增量改属性；rest-compat D01 行8（BinFlow 缺位扩张）"}
    - {category: set-sha256,      method: POST,   path: "/api/storage/{path}",         auth: manage, note: "sha256 属性回填（5.5 前遗留兼容）"}
  - resource: copy-move
    layer: core-rest

# ---------- 跨组观察（E1 备注，非边） ----------
observations:
  - artifactory-config 是组内最高入度模块（63 条边指向它）——几乎所有模块依赖其 ConstantValues/配置模型
  - artifactory-core 入度 58、artifactory-addons-common 入度 36——addon 全部回调 core，core 不依赖任何 addon（编译期无环）
  - access 组被 artifactory-core 依赖（认证走 access client），access 不依赖 artifactory-core（方向单向）
  - jfrog-commons 为纯被依赖方（无指向 artifactory-*/access 的边）
  - sysconf (x12) / license-manager / support-common / support-rest / rds / iostreams / event-client 等占位名
    形似 JFrog 内部库但按 recovered.thirdparty 占位处理——其真实 groupId 证据不足，标 UNKNOWN 待活体验证


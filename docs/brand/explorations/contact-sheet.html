<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Binflow 品牌方向探索 contact sheet — B-1</title>
<style>
  :root {
    --mark-ink: #1d232c;
    --mark-accent: #3d63f2;
    --sheet-bg: #f3f5f7;
    --sheet-card: #ffffff;
    --sheet-ink: #1d232c;
    --sheet-ink-2: #55606e;
    --sheet-border: #d3dae2;
    --dark-zone-bg: #141a22;
    --dark-zone-card: #1b2430;
  }
  .dark-zone {
    --mark-ink: #e9edf3;
    --mark-accent: #7b9eff;
    --sheet-bg: #141a22;
    --sheet-card: #1b2430;
    --sheet-ink: #e9edf3;
    --sheet-ink-2: #a3b1c2;
    --sheet-border: #293545;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 13px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  section { background: var(--sheet-bg); padding: 28px 32px 36px; }
  h1 { font-size: 18px; color: var(--sheet-ink); margin-bottom: 2px; font-family: system-ui, sans-serif; }
  p.sub { color: var(--sheet-ink-2); margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { background: var(--sheet-card); border: 1px solid var(--sheet-border); border-radius: 8px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .mark96 { width: 96px; height: 96px; flex: none; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .id { color: var(--sheet-ink); font-weight: 700; }
  .kw { color: var(--sheet-ink-2); font-size: 11px; }
  .sizes { display: flex; align-items: flex-end; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--sheet-border); }
  .sizes img { display: block; }
  .sizes .lab { color: var(--sheet-ink-2); font-size: 10px; writing-mode: vertical-rl; text-orientation: mixed; }
  .pill { font-size: 10px; color: var(--sheet-ink-2); }
</style>
</head>
<body>
<section class="light">
  <h1>Binflow 品牌方向探索 — 亮底（#f3f5f7 / 卡片 #ffffff）</h1>
  <p class="sub">accent = #3d63f2（Flow Indigo 提案）· ink = #1d232c · 96px 标准档 + 24/16px 缩放档</p>
  <div class="grid" id="grid"></div>
</section>
<section class="dark-zone">
  <h1>暗底（#141a22 / 卡片 #1b2430）</h1>
  <p class="sub">accent = #7b9eff · ink = #e9edf3</p>
  <div class="grid" id="gridDark"></div>
</section>
<script>
const DIRS = [
  ['d01-digest-lattice.svg','D1 校验和点阵','Binary · Checksum · Flow'],
  ['d02-chevron-flow.svg','D2 双箭流 »','Flow · Terminal'],
  ['d03-pipeline-node.svg','D3 管线拓扑','Pipeline · CI/CD'],
  ['d04-bin-cells.svg','D4 仓格流','Storage · Distribution'],
  ['d05-b-counter.svg','D5 B 字标','Monogram · Artifact'],
  ['d06-strata-stack.svg','D6 层积塔','Storage · Versioning'],
  ['d07-split-junction.svg','D7 分流器','Distribution · Topology'],
  ['d08-hash-ring.svg','D8 指纹环','Checksum · Integrity'],
  ['d09-bracket-depot.svg','D9 括号仓','Binary · Storage'],
  ['d10-conduit-elbow.svg','D10 管道弯头','Infrastructure · Pipeline'],
  ['d11-binary-overlap.svg','D11 二进制叠印','Binary · 0/1'],
  ['d12-byte-stream.svg','D12 字节流','Binary · Flow'],
];
const cell = (f, name, kw) => `
  <div class="card">
    <div class="row">
      <img class="mark96" src="${f}" alt="${name}">
      <div class="stack"><span class="id">${name}</span><span class="kw">${kw}</span></div>
    </div>
    <div class="sizes">
      <span class="lab">24/16</span>
      <img src="${f}" width="24" height="24" alt="">
      <img src="${f}" width="16" height="16" alt="">
      <span class="pill">favicon 档</span>
    </div>
  </div>`;
document.getElementById('grid').innerHTML = DIRS.map(d => cell(...d)).join('');
document.getElementById('gridDark').innerHTML = DIRS.map(d => cell(...d)).join('');
</script>
</body>
</html>

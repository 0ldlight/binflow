<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>BinFlow logo 候选 2「括号·数组流」（bracket-stream）规格表</title>
  <desc>mark = 一对方括号（bin = 数组/容器）内三条流线，中线延伸为实心箭头（flow 出仓）。横版 lockup = mark + BinFlow wordmark。含亮底/暗底/单色三版本与 16~32px 缩放样张。品牌主色对齐主题 token --bf-accent（亮 #0b6bcb / 暗 #4aa3ff），括号用 --bf-text。</desc>

  <!-- ================= 亮底行（--bf-surface-1 #ffffff） ================= -->
  <rect x="0" y="0" width="760" height="225" fill="#ffffff"/>
  <text x="24" y="30" font-size="12" fill="#9aa6b4">亮底（surface-1 #ffffff）—— mark 96px / 横版 lockup / 单色版</text>

  <!-- mark 96px -->
  <svg x="24" y="52" width="96" height="96" viewBox="0 0 48 48">
    <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
    <path d="M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 15.3h9M16 32.7h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 24h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 18.8 31.5 24 25 29.2Z" fill="#0b6bcb"/>
  </svg>

  <!-- 横版 lockup -->
  <svg x="168" y="70" width="304" height="80" viewBox="0 0 152 40">
    <svg x="0" y="2" width="36" height="36" viewBox="0 0 48 48">
      <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
      <path d="M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
      <path d="M16 15.3h9M16 32.7h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
      <path d="M16 24h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
      <path d="M25 18.8 31.5 24 25 29.2Z" fill="#0b6bcb"/>
    </svg>
    <text x="44" y="28.5" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#1d232c">Bin<tspan fill="#0b6bcb">Flow</tspan></text>
  </svg>

  <!-- 单色版 -->
  <svg x="560" y="74" width="48" height="48" viewBox="0 0 48 48" color="#55606e">
    <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 15.3h9M16 32.7h9M16 24h9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 18.8 31.5 24 25 29.2Z" fill="currentColor"/>
  </svg>
  <text x="556" y="140" font-size="11" fill="#9aa6b4">单色（currentColor）</text>

  <text x="24" y="170" font-size="11.5" fill="#646f7b">设计注：方括号 = 代码里的 bin/array；三条流线中一条汇成箭头出仓——「条目流」。</text>
  <text x="24" y="188" font-size="11.5" fill="#646f7b">语义最直白（bin=存储、箭=流出），但水平笔画多，窄幅（favicon）下箭头略弱。</text>

  <!-- ================= 暗底行（--bf-bg #12161d） ================= -->
  <rect x="0" y="225" width="760" height="160" fill="#12161d"/>
  <text x="24" y="252" font-size="12" fill="#7f8a99">暗底（bg #12161d）—— mark 96px / 横版 lockup</text>

  <svg x="24" y="270" width="96" height="96" viewBox="0 0 48 48">
    <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3" fill="none" stroke="#e9edf3" stroke-width="3" stroke-linecap="round"/>
    <path d="M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#e9edf3" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 15.3h9M16 32.7h9" stroke="#4aa3ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 24h9" stroke="#4aa3ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 18.8 31.5 24 25 29.2Z" fill="#4aa3ff"/>
  </svg>

  <svg x="168" y="288" width="304" height="80" viewBox="0 0 152 40">
    <svg x="0" y="2" width="36" height="36" viewBox="0 0 48 48">
      <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3" fill="none" stroke="#e9edf3" stroke-width="3" stroke-linecap="round"/>
      <path d="M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#e9edf3" stroke-width="3" stroke-linecap="round"/>
      <path d="M16 15.3h9M16 32.7h9" stroke="#4aa3ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M16 24h9" stroke="#4aa3ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M25 18.8 31.5 24 25 29.2Z" fill="#4aa3ff"/>
    </svg>
    <text x="44" y="28.5" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#e9edf3">Bin<tspan fill="#4aa3ff">Flow</tspan></text>
  </svg>

  <!-- ================= 缩放样张 ================= -->
  <rect x="0" y="385" width="760" height="85" fill="#ffffff"/>
  <text x="24" y="410" font-size="12" fill="#9aa6b4">缩放样张：16 / 20 / 24 / 32 px（16px 下括号仍清晰，箭头退化为楔形）</text>
  <svg x="24" y="422" width="16" height="16" viewBox="0 0 48 48">
    <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 15.3h9M16 32.7h9M16 24h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 18.8 31.5 24 25 29.2Z" fill="#0b6bcb"/>
  </svg>
  <svg x="52" y="418" width="20" height="20" viewBox="0 0 48 48">
    <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 15.3h9M16 32.7h9M16 24h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 18.8 31.5 24 25 29.2Z" fill="#0b6bcb"/>
  </svg>
  <svg x="84" y="414" width="24" height="24" viewBox="0 0 48 48">
    <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 15.3h9M16 32.7h9M16 24h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 18.8 31.5 24 25 29.2Z" fill="#0b6bcb"/>
  </svg>
  <svg x="120" y="410" width="32" height="32" viewBox="0 0 48 48">
    <path d="M12.5 5H9.5q-3 0-3 3v32q0 3 3 3h3M35.5 5h3q3 0 3 3v32q0 3-3 3h-3" fill="none" stroke="#1d232c" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 15.3h9M16 32.7h9M16 24h9" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 18.8 31.5 24 25 29.2Z" fill="#0b6bcb"/>
  </svg>
</svg>

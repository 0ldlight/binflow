<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <title>go 包型图标（单色版，wire 值 go）</title>
  <!-- Go 的斜体 GO 字标 + 左侧速度线。mono 版全 currentColor。K56 生产化：GO 由 text 转
       monoline path（stroke 2.3 圆帽；G 心 (10,12) r2.45 开口右上 + 3 点位内伸横杠；
       O 心 (17.4,12) r2.45；斜体由 skewX(-8) 给出，translate(1.6 0) 回补重心），零字体依赖 -->
  <path d="M1.8 9.6h3.2M0.8 12.4h4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <g transform="translate(1.6 0) skewX(-8)" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.7 12H12.45A2.45 2.45 0 1 1 11.23 9.88"/>
    <path d="M14.95 12A2.45 2.45 0 0 1 19.85 12A2.45 2.45 0 0 1 14.95 12"/>
  </g>
</svg>

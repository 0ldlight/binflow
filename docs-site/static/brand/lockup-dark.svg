<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 128" fill="none">
  <title>BinFlow 横版 lockup（暗底生产版）</title>
  <desc>K56 生产件（候选 1 转正）。几何与 lockup-horizontal.svg 完全一致，仅换暗底色板（logo/README §2）：容器描边与 wordmark Bin 用 bf-text 暗色 #e9edf3，双箭与 wordmark Flow 用 bf-accent 暗色 #4aa3ff。消费位：登录页品牌区（约 48px 高）、控制台侧栏顶横条、深色文档站。透明底，调用处给 bf-bg #12161d 或更深背景。</desc>

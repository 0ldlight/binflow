# helm deploy Job template — placeholders substituted by Jenkinsfile-lzw (sed):
#   __SHORT__  git short sha (image tag deployed)
# v3: no git — fetches helm binary + source tarball from the Artifactory relay
# (auth via Basic header; busybox wget --user/--password is not portable).
# Runs as binflow-ci SA (RoleBinding binflow-ci-deployer-sa in ns lzw); admin
# password from Secret binflow-lzw-admin — never through the pipeline.
apiVersion: batch/v1
kind: Job
metadata:
  name: binflow-deploy-__SHORT__
  namespace: lzw
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: binflow-ci
      restartPolicy: Never
      containers:
        - name: helm
          image: m.daocloud.io/docker.io/library/alpine:3.20
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: binflow-lzw-admin
                  key: password
            - name: ART_USER
              valueFrom:
                secretKeyRef:
                  name: ref-download
                  key: user
            - name: ART_PASS
              valueFrom:
                secretKeyRef:
                  name: ref-download
                  key: password
          command: ["sh", "-c"]
          args:
            - |
              set -ex
              AB64=$(printf '%s:%s' "$ART_USER" "$ART_PASS" | base64)
              wget --header "Authorization: Basic $AB64" \
                "http://artifactory.devops.svc.cluster.local:8082/artifactory/generic-local/mirror/helm-linux-amd64" -O /usr/local/bin/helm
              chmod +x /usr/local/bin/helm
              wget --header "Authorization: Basic $AB64" \
                "http://artifactory.devops.svc.cluster.local:8082/artifactory/generic-local/mirror/binflow-src-latest.tar.gz" -O /src.tar.gz
              mkdir -p /src && tar -xzf /src.tar.gz -C /src && rm /src.tar.gz
              cd /src
              { set +x; } 2>/dev/null
              helm upgrade --install binflow-dev charts/binflow \
                -n lzw \
                -f deploy/k8s/lzw-values.yaml \
                --set image.repository=192.168.120.36:32100/binflow \
                --set image.tag=dev-__SHORT__ \
                --set admin.password="$ADMIN_PASSWORD" \
                --wait --timeout 8m
              set -x
              helm list -n lzw

# helm deploy Job template — placeholders substituted by Jenkinsfile-lzw (sed):
#   __SHORT__  git short sha (image tag deployed)
# v3: no git — fetches helm binary + source tarball from the Artifactory relay
# (auth via Basic header; busybox wget --user/--password is not portable).
# Runs as binflow-ci SA (RoleBinding binflow-ci-deployer-sa in ns lzw); admin
# password from Secret binflow-lzw-admin — never through the pipeline.
apiVersion: batch/v1
kind: Job
metadata:
  name: binflow-deploy-__SHORT__
  namespace: lzw
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: binflow-ci
      restartPolicy: Never
      containers:
        - name: helm
          image: m.daocloud.io/docker.io/library/alpine:3.20
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: binflow-lzw-admin
                  key: password
            - name: ART_USER
              valueFrom:
                secretKeyRef:
                  name: ref-download
                  key: user
            - name: ART_PASS
              valueFrom:
                secretKeyRef:
                  name: ref-download
                  key: password
          command: ["sh", "-c"]
          args:
            - |
              # set -e only: xtrace would print the Basic auth header
              set -e
              AB64=$(printf '%s:%s' "$ART_USER" "$ART_PASS" | base64)
              MIRROR=http://artifactory.devops.svc.cluster.local:8082/artifactory/generic-local/mirror
              echo "fetching helm binary + source tarball from relay"
              wget -q --header "Authorization: Basic $AB64" "$MIRROR/mirror-checksums.txt" -O /tmp/checksums.txt
              wget -q --header "Authorization: Basic $AB64" "$MIRROR/helm-linux-amd64" -O /tmp/helm-linux-amd64
              # verify and refetch BOTH manifest and artifact on mismatch —
              # a corrupt manifest poisons every retry that reuses it (#41/#42)
              n=0
              # sha256sum -c resolves the filename against the CWD — the
              # artifact lives in /tmp, so verify from there (the earlier
              # mismatch failures were a missing-file error, not corruption)
              until ( cd /tmp && grep ' helm-linux-amd64$' /tmp/checksums.txt | sha256sum -c - ); do
                n=$((n+1))
                if [ "$n" -ge 3 ]; then
                  echo "helm binary checksum failed after 3 fetches"
                  echo "manifest line: $(grep ' helm-linux-amd64$' /tmp/checksums.txt)"
                  echo "actual: $(sha256sum /tmp/helm-linux-amd64 | cut -d' ' -f1) size=$(wc -c < /tmp/helm-linux-amd64)"
                  exit 1
                fi
                echo "helm binary checksum mismatch, refetch manifest+binary ($n)"
                wget -q --header "Authorization: Basic $AB64" "$MIRROR/mirror-checksums.txt" -O /tmp/checksums.txt
                wget -q --header "Authorization: Basic $AB64" "$MIRROR/helm-linux-amd64" -O /tmp/helm-linux-amd64
              done
              install -m 0755 /tmp/helm-linux-amd64 /usr/local/bin/helm
              mkdir -p /src
              wget -q --header "Authorization: Basic $AB64" "$MIRROR/binflow-src-latest.tar.gz" -O /src/binflow-src-latest.tar.gz
              n=0
              until ( cd /src && grep ' binflow-src-latest.tar.gz$' /tmp/checksums.txt | sha256sum -c - ); do
                n=$((n+1))
                if [ "$n" -ge 3 ]; then
                  echo "tarball checksum failed after 3 fetches"
                  echo "manifest line: $(grep ' binflow-src-latest.tar.gz$' /tmp/checksums.txt)"
                  echo "actual: $(sha256sum /src/binflow-src-latest.tar.gz | cut -d' ' -f1) size=$(wc -c < /src/binflow-src-latest.tar.gz)"
                  exit 1
                fi
                echo "tarball checksum mismatch, refetch manifest+tarball ($n)"
                wget -q --header "Authorization: Basic $AB64" "$MIRROR/mirror-checksums.txt" -O /tmp/checksums.txt
                wget -q --header "Authorization: Basic $AB64" "$MIRROR/binflow-src-latest.tar.gz" -O /src/binflow-src-latest.tar.gz
              done
              tar -xzf /src/binflow-src-latest.tar.gz -C /src && rm /src/binflow-src-latest.tar.gz
              echo "materials unpacked and checksum-verified"
              cd /src
              { set +x; } 2>/dev/null
              umask 077
              printf 'admin:\n  password: %s\n' "$ADMIN_PASSWORD" > /tmp/admin-values.yaml
              helm upgrade --install binflow-dev charts/binflow \
                -n lzw \
                -f deploy/k8s/lzw-values.yaml \
                -f /tmp/admin-values.yaml \
                --set image.repository=192.168.120.36:32100/binflow \
                --set image.tag=dev-__SHORT__ \
                --wait --timeout 8m
              rc=$?
              rm -f /tmp/admin-values.yaml
              set -x
              [ "$rc" = 0 ] || exit "$rc"
              helm list -n lzw

# BinFlow GA compose (T-135, FR-36, PB-04).
#
# Start from the REPOSITORY ROOT:
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# With nginx reverse proxy:
#
#   docker compose -f deploy/compose/docker-compose.yml --profile nginx up -d --build
#
# The default image variant is alpine (fully featured, wget HEALTHCHECK).
# To use the distroless variant instead, set BINFLOW_IMAGE_VARIANT=distroless
# in .env (the image tag becomes binflow:v1.0.0-distroless).
#
# 15-minute-from-scratch target (G10): clean clone → cp .env → up -d --build
# → /readyz 200. The image build (console + docs + server) is part of the
# clock — pre-warmed caches are not counted.
#
# Persistence: a named volume is mounted at /var/lib/binflow (blobs +
# sessions + SQLite).  docker compose down keeps it; only down -v destroys
# data (AC FR-36-AC1).
#
# S3 object-storage backend (--profile s3, T-170): adds a bundled MinIO
# server plus a one-shot bucket-init job, and switches BinFlow to
# storage.backend=s3 when the BINFLOW_STORAGE__* block in .env is enabled.
#
#   docker compose -f deploy/compose/docker-compose.yml --profile s3 up -d --build
#
# (--build on first run: an image built before the S3 config wiring landed
# rejects the BINFLOW_STORAGE__* variables with an unknown-env fail-fast.)
#
# MinIO root password and the S3 secret key are env-only (ADR-0009): they
# live in .env, never in this file.  BinFlow waits for MinIO's readiness
# probe (/minio/health/ready) AND the bucket-init job before starting, so
# the /healthz S3 round-trip (HeadBucket/Put/Delete) cannot race the bucket.
#
# Security notes (PRD NFR-S6/S8):
#   - M1 serves plain HTTP only — bind to loopback by default and keep the
#     instance on a trusted machine/network. Set BINFLOW_BIND_PORT below to
#     expose it further afield only on networks you trust.
#   - Anonymous read is ON by default (Q2/ADR-0009). Content-path GET/HEAD
#     needs no credentials; writes and /binflow/api/** always require auth.
#     Disable with BINFLOW_SECURITY_ANONYMOUS_ACCESS=false (.env or shell).
#   - BINFLOW_ADMIN_PASSWORD uses the :? mandatory syntax — the compose
#     invocation will error out if the variable is unset or empty. There is
#     no default value and no silent fallback (ADR-0009).

name: binflow

services:
  binflow:
    build:
      context: ../..
      dockerfile: "deploy/release/Dockerfile.${BINFLOW_IMAGE_VARIANT:-alpine}"
      args:
        BINFLOW_VER: "${BINFLOW_VER:-v1.0.0}"
        BINFLOW_REVISION: "${BINFLOW_REVISION:-unknown}"
    image: "binflow:${BINFLOW_VER:-v1.0.0}-${BINFLOW_IMAGE_VARIANT:-alpine}"
    container_name: binflow-ga
    restart: unless-stopped
    environment:
      # admin bootstrap password — mandatory (secrets never enter YAML, ADR-0009).
      # The :? syntax refuses to start when the variable is unset or empty.
      BINFLOW_ADMIN_PASSWORD: ${BINFLOW_ADMIN_PASSWORD:?set BINFLOW_ADMIN_PASSWORD in deploy/compose/.env (cp .env.example .env) or export it before composing}

      # anonymous content read, default true (Q2; set false in .env to harden)
      BINFLOW_SECURITY_ANONYMOUS_ACCESS: ${BINFLOW_SECURITY_ANONYMOUS_ACCESS:-true}

      # token lifetime (M2): every token — management API AND the docker
      # /v2/token flow (expires_in) — is cut from this TTL. 720h mirrors
      # config.DefaultTokenTTL (the server default).
      BINFLOW_AUTH__TOKEN_DEFAULT_TTL_HOURS: ${BINFLOW_AUTH__TOKEN_DEFAULT_TTL_HOURS:-720}

      # listen on every interface inside the container (the HOST binding is
      # what controls exposure)
      BINFLOW_SERVER__LISTEN: :8080

      # data_dir comes from the image (BINFLOW_DATA_DIR=/var/lib/binflow)

      # logging: console output is easier to read during eval; json is the
      # default for production pipelines.
      BINFLOW_LOGGING__FORMAT: ${BINFLOW_LOGGING__FORMAT:-console}
      BINFLOW_LOGGING__LEVEL: ${BINFLOW_LOGGING__LEVEL:-info}

      # server graceful shutdown timeout (seconds)
      BINFLOW_SERVER__GRACEFUL_TIMEOUT_SECONDS: ${BINFLOW_SERVER__GRACEFUL_TIMEOUT_SECONDS:-30}

      # storage knobs
      BINFLOW_STORAGE__SESSION_TTL_HOURS: ${BINFLOW_STORAGE__SESSION_TTL_HOURS:-24}
      BINFLOW_STORAGE__GC_GRACE_HOURS: ${BINFLOW_STORAGE__GC_GRACE_HOURS:-24}

      # ---- S3 object-storage backend (--profile s3, T-170) ---------------------
      # Keys map to the storage.s3 config section via the BINFLOW_<SECTION>__<KEY>
      # double-underscore spelling (see internal/config). Defaults target the
      # bundled MinIO service; with the s3 profile off (or with
      # BINFLOW_STORAGE__BACKEND left at "disk") every S3 field is inert — the
      # config loader treats an empty value as unset.
      BINFLOW_STORAGE__BACKEND: ${BINFLOW_STORAGE__BACKEND:-disk}
      BINFLOW_STORAGE__S3__BUCKET: ${BINFLOW_STORAGE__S3__BUCKET:-binflow}
      BINFLOW_STORAGE__S3__REGION: ${BINFLOW_STORAGE__S3__REGION:-us-east-1}
      # in-network address of the bundled MinIO; override in .env for real S3
      # (e.g. https://s3.amazonaws.com) or another S3-compatible endpoint.
      BINFLOW_STORAGE__S3__ENDPOINT: ${BINFLOW_STORAGE__S3__ENDPOINT:-http://minio:9000}
      BINFLOW_STORAGE__S3__ACCESS_KEY_ID: ${BINFLOW_STORAGE__S3__ACCESS_KEY_ID:-binflow}
      # path-style addressing: true for MinIO, false for AWS virtual-host style
      BINFLOW_STORAGE__S3__USE_PATH_STYLE: ${BINFLOW_STORAGE__S3__USE_PATH_STYLE:-true}
      # secret_access_key is env-only and never enters a YAML config file
      # (ADR-0009).  The loader special-cases this single-underscore spelling;
      # an empty value counts as unset — set it in .env together with
      # BINFLOW_STORAGE__BACKEND=s3 when enabling --profile s3.  For the
      # bundled MinIO it must equal MINIO_ROOT_PASSWORD.
      BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY: ${BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY:-}

      # ---- OIDC / LDAP (M6, ADR-0020) -------------------------------------------
      # Example env-only spellings are kept in .env.example (commented out).
      # They are NOT repeated here: the config loader fail-fasts on unknown
      # BINFLOW_* variables, and the auth wiring (T-157) has not shipped in a
      # server build yet — uncommenting them in .env before that release
      # would refuse to boot, which is the intended fail-fast posture.

      # argon2id memory parameter (MB)
      BINFLOW_AUTH__ARGON2_MEMORY_MB: ${BINFLOW_AUTH__ARGON2_MEMORY_MB:-64}

      # audit logging
      BINFLOW_AUDIT__ENABLED: ${BINFLOW_AUDIT__ENABLED:-true}

      # console session TTL (hours)
      BINFLOW_CONSOLE__SESSION_TTL_HOURS: ${BINFLOW_CONSOLE__SESSION_TTL_HOURS:-24}

    # --profile s3: wait for the bundled MinIO to pass its readiness probe and
    # for the bucket-init job to exit successfully before starting.  With the
    # profile off both dependencies are skipped (required: false), so the
    # plain disk-backend boot path is unchanged.
    depends_on:
      minio:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    ports:
      - "${BINFLOW_BIND_ADDR:-127.0.0.1}:${BINFLOW_BIND_PORT:-8080}:8080"
    volumes:
      - binflow-data:/var/lib/binflow
    healthcheck:
      # /readyz = metadata ping + storage writable, unauthenticated by
      # design (architecture 7.1). The alpine variant uses wget (busybox);
      # the distroless variant uses a tiny Go healthcheck-probe binary.
      # Both are baked into the respective images — the compose file
      # references the image's built-in HEALTHCHECK, so `docker compose ps`
      # shows the container's own health status.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    # Graceful drain window: the server drains in-flight requests for up to
    # 30s on SIGTERM (architecture 7.4); give compose the same headroom
    # before SIGKILL (PRD: stop_grace_period >= 30s).
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ---- resource limits (commented-out examples) ------------------------------
    # Uncomment and adjust for your host. These are operator-policy values;
    # BinFlow itself has no hard floor — it will use whatever is available.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 1g
    #     reservations:
    #       cpus: "0.5"
    #       memory: 256m

  # ---- nginx reverse proxy (optional, --profile nginx) -------------------------
  # Activated with: docker compose -f deploy/compose/docker-compose.yml --profile nginx up -d --build
  #
  # The proxy does TLS termination and forwards /v2/ and /binflow/ straight
  # through with NO rewrite (D-106-2 fix).  /v2/ must pass untouched because
  # the Www-Authenticate challenge realm points to /v2/token on the same
  # host, and any path rewrite would break docker token negotiation.
  #
  # The location = /binflow block handles the no-trailing-slash console
  # entry: without it, nginx would synthesise a 301 with an absolute URL
  # (stripping the port), which fails on non-standard ports.  BinFlow
  # itself responds 301 → /binflow/ui/.
  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    container_name: binflow-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_BIND_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      binflow:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- MinIO S3 backend (optional, --profile s3, T-170) -------------------------
  # A single-node MinIO bound to the compose network.  Objects live in the
  # minio-data named volume; `down` keeps it, only `down -v` destroys it.
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z  # version-anchored, no :latest
    container_name: binflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Root credentials for the bundled MinIO.  MINIO_ROOT_PASSWORD is
      # env-only (set in .env, never committed); MinIO refuses to boot on an
      # empty/short password, so a forgotten .env entry fails visibly here.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-binflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      # MinIO admin console (https://127.0.0.1:9001) on loopback only — an
      # ops convenience; BinFlow itself talks to port 9000 over the compose
      # network and needs no published port.
      - "${MINIO_CONSOLE_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_BIND_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # /minio/health/ready answers 200 only once MinIO can serve I/O —
      # the same gate BinFlow's /healthz S3 round-trip depends on.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- one-shot bucket bootstrap for the bundled MinIO (--profile s3) -----------
  # BinFlow does not create buckets (internal/storage: "callers must ensure
  # the bucket exists"), and /healthz's HeadBucket probe reports unhealthy on
  # a missing bucket.  This job runs `mc mb` once after MinIO is healthy;
  # BinFlow starts only after it exits 0 (see depends_on above).
  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z  # version-anchored, no :latest
    container_name: binflow-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-binflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      # keep in sync with BINFLOW_STORAGE__S3__BUCKET above
      BINFLOW_STORAGE__S3__BUCKET: ${BINFLOW_STORAGE__S3__BUCKET:-binflow}
    entrypoint: |
      /bin/sh -c '
        if [ -z "$$MINIO_ROOT_PASSWORD" ]; then
          echo "MINIO_ROOT_PASSWORD is required with --profile s3 — set it in deploy/compose/.env (min 8 chars)" >&2
          exit 1
        fi
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        n=0
        until mc mb --ignore-existing "local/$$BINFLOW_STORAGE__S3__BUCKET"; do
          n=$$((n+1))
          if [ "$$n" -ge 10 ]; then
            echo "bucket init failed after $$n attempts" >&2
            exit 1
          fi
          sleep 2
        done
        echo "bucket $$BINFLOW_STORAGE__S3__BUCKET ready"
      '

volumes:
  binflow-data:
  minio-data:
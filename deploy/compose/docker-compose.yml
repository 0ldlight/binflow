# BinFlow GA compose (T-135, FR-36, PB-04).
#
# Start from the REPOSITORY ROOT:
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# With nginx reverse proxy:
#
#   docker compose -f deploy/compose/docker-compose.yml --profile nginx up -d --build
#
# The default image variant is alpine (fully featured, wget HEALTHCHECK).
# To use the distroless variant instead, set BINFLOW_IMAGE_VARIANT=distroless
# in .env (the image tag becomes binflow:v1.0.0-distroless).
#
# 15-minute-from-scratch target (G10): clean clone → cp .env → up -d --build
# → /readyz 200. The image build (console + docs + server) is part of the
# clock — pre-warmed caches are not counted.
#
# Persistence: a named volume is mounted at /var/lib/binflow (blobs +
# sessions + SQLite).  docker compose down keeps it; only down -v destroys
# data (AC FR-36-AC1).
#
# Security notes (PRD NFR-S6/S8):
#   - M1 serves plain HTTP only — bind to loopback by default and keep the
#     instance on a trusted machine/network. Set BINFLOW_BIND_PORT below to
#     expose it further afield only on networks you trust.
#   - Anonymous read is ON by default (Q2/ADR-0009). Content-path GET/HEAD
#     needs no credentials; writes and /binflow/api/** always require auth.
#     Disable with BINFLOW_SECURITY_ANONYMOUS_ACCESS=false (.env or shell).
#   - BINFLOW_ADMIN_PASSWORD uses the :? mandatory syntax — the compose
#     invocation will error out if the variable is unset or empty. There is
#     no default value and no silent fallback (ADR-0009).

name: binflow

services:
  binflow:
    build:
      context: ../..
      dockerfile: "deploy/release/Dockerfile.${BINFLOW_IMAGE_VARIANT:-alpine}"
      args:
        BINFLOW_VER: "${BINFLOW_VER:-v1.0.0}"
        BINFLOW_REVISION: "${BINFLOW_REVISION:-unknown}"
    image: "binflow:${BINFLOW_VER:-v1.0.0}-${BINFLOW_IMAGE_VARIANT:-alpine}"
    container_name: binflow-ga
    restart: unless-stopped
    environment:
      # admin bootstrap password — mandatory (secrets never enter YAML, ADR-0009).
      # The :? syntax refuses to start when the variable is unset or empty.
      BINFLOW_ADMIN_PASSWORD: ${BINFLOW_ADMIN_PASSWORD:?set BINFLOW_ADMIN_PASSWORD in deploy/compose/.env (cp .env.example .env) or export it before composing}

      # anonymous content read, default true (Q2; set false in .env to harden)
      BINFLOW_SECURITY_ANONYMOUS_ACCESS: ${BINFLOW_SECURITY_ANONYMOUS_ACCESS:-true}

      # token lifetime (M2): every token — management API AND the docker
      # /v2/token flow (expires_in) — is cut from this TTL. 720h mirrors
      # config.DefaultTokenTTL (the server default).
      BINFLOW_AUTH__TOKEN_DEFAULT_TTL_HOURS: ${BINFLOW_AUTH__TOKEN_DEFAULT_TTL_HOURS:-720}

      # listen on every interface inside the container (the HOST binding is
      # what controls exposure)
      BINFLOW_SERVER__LISTEN: :8080

      # data_dir comes from the image (BINFLOW_DATA_DIR=/var/lib/binflow)

      # logging: console output is easier to read during eval; json is the
      # default for production pipelines.
      BINFLOW_LOGGING__FORMAT: ${BINFLOW_LOGGING__FORMAT:-console}
      BINFLOW_LOGGING__LEVEL: ${BINFLOW_LOGGING__LEVEL:-info}

      # server graceful shutdown timeout (seconds)
      BINFLOW_SERVER__GRACEFUL_TIMEOUT_SECONDS: ${BINFLOW_SERVER__GRACEFUL_TIMEOUT_SECONDS:-30}

      # storage knobs
      BINFLOW_STORAGE__SESSION_TTL_HOURS: ${BINFLOW_STORAGE__SESSION_TTL_HOURS:-24}
      BINFLOW_STORAGE__GC_GRACE_HOURS: ${BINFLOW_STORAGE__GC_GRACE_HOURS:-24}

      # argon2id memory parameter (MB)
      BINFLOW_AUTH__ARGON2_MEMORY_MB: ${BINFLOW_AUTH__ARGON2_MEMORY_MB:-64}

      # audit logging
      BINFLOW_AUDIT__ENABLED: ${BINFLOW_AUDIT__ENABLED:-true}

      # console session TTL (hours)
      BINFLOW_CONSOLE__SESSION_TTL_HOURS: ${BINFLOW_CONSOLE__SESSION_TTL_HOURS:-24}

    ports:
      - "${BINFLOW_BIND_ADDR:-127.0.0.1}:${BINFLOW_BIND_PORT:-8080}:8080"
    volumes:
      - binflow-data:/var/lib/binflow
    healthcheck:
      # /readyz = metadata ping + storage writable, unauthenticated by
      # design (architecture 7.1). The alpine variant uses wget (busybox);
      # the distroless variant uses a tiny Go healthcheck-probe binary.
      # Both are baked into the respective images — the compose file
      # references the image's built-in HEALTHCHECK, so `docker compose ps`
      # shows the container's own health status.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    # Graceful drain window: the server drains in-flight requests for up to
    # 30s on SIGTERM (architecture 7.4); give compose the same headroom
    # before SIGKILL (PRD: stop_grace_period >= 30s).
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ---- resource limits (commented-out examples) ------------------------------
    # Uncomment and adjust for your host. These are operator-policy values;
    # BinFlow itself has no hard floor — it will use whatever is available.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 1g
    #     reservations:
    #       cpus: "0.5"
    #       memory: 256m

  # ---- nginx reverse proxy (optional, --profile nginx) -------------------------
  # Activated with: docker compose -f deploy/compose/docker-compose.yml --profile nginx up -d --build
  #
  # The proxy does TLS termination and forwards /v2/ and /binflow/ straight
  # through with NO rewrite (D-106-2 fix).  /v2/ must pass untouched because
  # the Www-Authenticate challenge realm points to /v2/token on the same
  # host, and any path rewrite would break docker token negotiation.
  #
  # The location = /binflow block handles the no-trailing-slash console
  # entry: without it, nginx would synthesise a 301 with an absolute URL
  # (stripping the port), which fails on non-standard ports.  BinFlow
  # itself responds 301 → /binflow/ui/.
  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    container_name: binflow-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_BIND_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      binflow:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  binflow-data:
# nginx proxy for BinFlow GA compose (T-135, D-106-2).
#
# Activates with: --profile nginx
#
# /v2/ is passed through WITH NO REWRITE — the Www-Authenticate challenge
# realm points to /v2/token on the same host, and any path rewrite would
# break docker token negotiation (ADR-0010 root-level exception).
#
# location = /binflow handles the no-trailing-slash console entry: without
# it, nginx would synthesise a 301 stripping the port, which fails on
# non-standard ports. BinFlow itself responds 301 → /binflow/ui/.
#
# Replace the ssl_certificate* paths with real certs, or generate self-signed
# ones for evaluation:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/binflow.key \
#     -out /etc/nginx/ssl/binflow.crt \
#     -subj "/CN=localhost"

server {
    listen 443 ssl;
    server_name localhost;

    # ssl_certificate     /etc/nginx/ssl/binflow.crt;
    # ssl_certificate_key /etc/nginx/ssl/binflow.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # Large blob uploads/pushes must not be buffered or truncated by nginx.
    client_max_body_size 0;

    # ---- docker Registry API (/v2/ root-level exception, ADR-0010) ------------
    # Passthrough with NO rewrite.  Buffering off for streaming blob transfers.
    location /v2/ {
        proxy_pass http://binflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ---- management API, console, generic artefacts ---------------------------
    # Explicit no-slash entry (D-106-2): /binflow → BinFlow's own 301 to
    # /binflow/ui/; /binflow/ → everything else.
    location = /binflow {
        proxy_pass http://binflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /binflow/ {
        proxy_pass http://binflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
    }

    # ---- health endpoints (unauthenticated, architecture 7.1) -----------------
    location = /readyz {
        proxy_pass http://binflow:8080;
        proxy_set_header Host $host;
    }
    location = /healthz {
        proxy_pass http://binflow:8080;
        proxy_set_header Host $host;
    }

    # ---- fallback (optional: show something at root) --------------------------
    location / {
        return 301 /binflow/;
    }
}
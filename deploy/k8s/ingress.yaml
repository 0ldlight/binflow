# BinFlow Ingress — sample, commented out by default.
#
# Uncomment and adjust to your cluster's IngressClass and hostname.
# Path-based routing under /binflow/ and /v2/ (docker registry) must be
# preserved exactly; the application mounts /v2/** at the root level and
# /binflow/ under a unified prefix (ADR-0008, ADR-0010).
#
# If you use a reverse proxy (nginx, traefik) instead of K8s Ingress, see
# deploy/dev/README.md for the required proxy_pass configuration.
#
# TODO: replace <your-hostname.example.com> with the real hostname.
# TODO: adjust TLS certificate configuration (cert-manager / manual).
#
# ---

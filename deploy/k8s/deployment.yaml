# BinFlow Deployment (architecture §9 — single replica, M1 no HA).
#
# Image: binflow:v1.0.0-distroless (no shell, Go healthcheck probe).
# For the alpine variant with shell, replace the image and switch the
# liveness/readiness probes to httpGet.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binflow
  labels:
    app.kubernetes.io/name: binflow
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: binflow
  strategy:
    type: Recreate  # SQLite WAL — single writer, no rolling update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: binflow
        app.kubernetes.io/component: server
    spec:
      # Disable automatic injection of K8s service environment variables
      # (BINFLOW_SERVICE_HOST, BINFLOW_PORT, etc.) which would collide with
      # BinFlow's BINFLOW_ config namespace.
      enableServiceLinks: false

      # ── Security context ─────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # nonroot user in distroless image
        runAsGroup: 65532
        fsGroup: 65532            # so the PVC is writable
        # readOnlyRootFilesystem: true  # enable if your distro supports it

      # ── Containers ───────────────────────────────────────────────────
      containers:
        - name: binflow
          image: binflow:v1.0.0-distroless  # no :latest — version-anchored

          # Environment: non-secret from config, secrets via secretKeyRef.
          env:
            # Convenience flat names for the two most common overrides.
            - name: BINFLOW_DATA_DIR
              value: /var/lib/binflow
            - name: BINFLOW_SECURITY_ANONYMOUS_ACCESS
              value: "true"
            # Admin password from Secret (never hard-coded).
            - name: BINFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: binflow-secret
                  key: BINFLOW_ADMIN_PASSWORD
            # Remote credentials key / instance master key (M11: seals
            # remote-repository credentials AND replication secrets AND
            # auth_configs AND GPG keypairs as enc:v1 rows — T-305/T-319).
            # Optional on a fresh instance; once any sealed row exists the
            # boot fail-fasts without the SAME key. base64, 32 bytes:
            #   openssl rand -base64 32
            - name: BINFLOW_REMOTE_CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: binflow-secret
                  key: BINFLOW_REMOTE_CREDENTIALS_KEY
                  optional: true

            # ── S3 object-storage backend (T-170) ────────────────────────
            # Uncomment to move blobs from the PVC to S3/MinIO.  Key spellings
            # are the BINFLOW_<SECTION>__<KEY> double-underscore form (see
            # internal/config); the secret access key is env-only and rides
            # binflow-secret (add the key shown in secret.yaml — never inline
            # it here).  The bucket must already exist: /healthz does a
            # HeadBucket→Put→Delete round-trip and reports storage=error on a
            # missing bucket.
            # - name: BINFLOW_STORAGE__BACKEND
            #   value: s3
            # - name: BINFLOW_STORAGE__S3__BUCKET
            #   value: binflow
            # - name: BINFLOW_STORAGE__S3__REGION
            #   value: us-east-1
            # - name: BINFLOW_STORAGE__S3__ENDPOINT
            #   value: http://minio.minio.svc.cluster.local:9000
            # - name: BINFLOW_STORAGE__S3__ACCESS_KEY_ID
            #   value: binflow
            # - name: BINFLOW_STORAGE__S3__USE_PATH_STYLE   # true for MinIO
            #   value: "true"
            # - name: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY   # env-only secret
            #   valueFrom:
            #     secretKeyRef:
            #       name: binflow-secret
            #       key: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY

            # ── OIDC identity provider (M6, ADR-0020) ────────────────────
            # Requires a server build with the auth wiring (T-157); older
            # builds fail-fast on unknown BINFLOW_AUTH__OIDC__* variables —
            # keep commented until then.  client_secret is env-only.
            # - name: BINFLOW_AUTH_OIDC_CLIENT_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: binflow-secret
            #       key: BINFLOW_AUTH_OIDC_CLIENT_SECRET
            # - name: BINFLOW_AUTH__OIDC__ISSUER_URL
            #   value: https://accounts.example.com
            # - name: BINFLOW_AUTH__OIDC__CLIENT_ID
            #   value: binflow
            # - name: BINFLOW_AUTH__OIDC__REDIRECT_URL
            #   value: https://binflow.example.com/binflow/api/v1/oidc/callback
            # - name: BINFLOW_AUTH__OIDC__USER_CLAIM
            #   value: preferred_username
            # - name: BINFLOW_AUTH__OIDC__GROUP_CLAIM
            #   value: groups
            # - name: BINFLOW_AUTH__OIDC__ADMIN_GROUP
            #   value: binflow-admins

            # ── LDAP identity provider (M6, ADR-0020) ─────────────────────
            # Same wiring caveat as OIDC.  bind_password is env-only; LDAP
            # users authenticate at POST /api/v1/session (no Bearer arm).
            # - name: BINFLOW_AUTH_LDAP_BIND_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: binflow-secret
            #       key: BINFLOW_AUTH_LDAP_BIND_PASSWORD
            # - name: BINFLOW_AUTH__LDAP__ENABLED
            #   value: "true"
            # - name: BINFLOW_AUTH__LDAP__URL
            #   value: ldap://ldap.example.com:389
            # - name: BINFLOW_AUTH__LDAP__BASE_DN
            #   value: dc=example,dc=com
            # - name: BINFLOW_AUTH__LDAP__BIND_DN
            #   value: cn=binflow,ou=services,dc=example,dc=com
            # - name: BINFLOW_AUTH__LDAP__USER_FILTER
            #   value: (&(objectClass=posixAccount)(uid=%s))
            # - name: BINFLOW_AUTH__LDAP__GROUP_FILTER
            #   value: (&(objectClass=posixGroup)(memberUid=%s))
            # - name: BINFLOW_AUTH__LDAP__ADMIN_GROUP
            #   value: cn=binflow-admins,ou=groups,dc=example,dc=com
            # - name: BINFLOW_AUTH__LDAP__START_TLS
            #   value: "true"

            # ── Addon circuit breaker (M10 T-283, ADR-0032 section 15.5) ──
            # OFF by default (unset = nothing disabled). Uncomment to switch
            # addon slots off globally: CSV of addon ids, values trimmed,
            # unknown ids tolerated (inert), case-sensitive. Restart-effective
            # — removing the entry and restarting restores everything; the
            # breaker never deletes data. Core ids (generic, docker, maven,
            # npm, pypi) are a degradation knob: the server WARNs at boot and
            # honors them anyway. 19 slots (M13): package-type = go, nuget,
            # cargo, conan, helm, helmoci, rpm, debian; feature = properties,
            # repo-operations, trashcan, ha, xray-integration, webhook (the
            # 19th slot, M13 T-362). There is NO license-related config key;
            # BINFLOW_M10_LICENSE_DIR is a tier-matrix TEST variable — the
            # strict env scan refuses the boot on it, so it never gets set
            # here.
            # - name: BINFLOW_ADDONS__DISABLED
            #   value: "nuget,go"

            # ── M13 operator knobs (T-362/T-368, restart-effective) ──────
            # Uncomment to diverge from the defaults. An image built from a
            # pre-M13 tree fail-fasts on these variables (unknown-env
            # refusal). webhook.allow_private_target defaults FALSE (the
            # SSRF deny posture, ADR-0041 decision 6 — the asymmetry against
            # replication's default-allow: webhook targets are REST-CRUD
            # dynamic). The folder_download six-field family and
            # trashcan.retention_days echo their RESOLVED values at
            # GET /binflow/api/v1/system/settings (admin token required).
            # chartsBaseUrl is NOT here: it is a per-repository field on
            # helm remote repositories (repositories API), not a config key.
            # - name: BINFLOW_WEBHOOK__ALLOW_PRIVATE_TARGET
            #   value: "false"
            # - name: BINFLOW_FOLDER_DOWNLOAD__ENABLED
            #   value: "true"
            # - name: BINFLOW_FOLDER_DOWNLOAD__ENABLED_FOR_ANONYMOUS
            #   value: "false"
            # - name: BINFLOW_FOLDER_DOWNLOAD__MAX_DOWNLOAD_SIZE_MB
            #   value: "1024"
            # - name: BINFLOW_FOLDER_DOWNLOAD__MAX_FILES
            #   value: "5000"
            # - name: BINFLOW_FOLDER_DOWNLOAD__MAX_CONCURRENT_REQUESTS
            #   value: "10"
            # - name: BINFLOW_FOLDER_DOWNLOAD__ENABLED_EMPTY_DIRECTORIES
            #   value: "false"
            # - name: BINFLOW_TRASHCAN__RETENTION_DAYS
            #   value: "14"

            # ── binstore.yaml storage chain (M11 T-306 / ADR-0036) ────────
            # Hand the storage chain to a standalone binstore.yaml mounted
            # next to the (env-only or mounted) binflow.yaml. Three pieces,
            # all or none — see binstore-configmap.yaml.example in this
            # directory for the file shape and the full priority notes:
            #   1. this BINFLOW_HOME env (file discovery root);
            #   2. the volumeMount + volume at the bottom of this file;
            #   3. the ConfigMap from binstore-configmap.yaml.example.
            # PRIORITIES while the file owns the chain (ADR-0036 d5/d6):
            #   - the S3 env block above is IGNORED with a WARN — declare
            #     bucket/endpoint/... in binstore.yaml instead;
            #   - BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY still applies (the
            #     env-only secret always reaches the live S3 provider);
            #   - data_dir/session_ttl/gc_* are not chain keys and stay put.
            # - name: BINFLOW_HOME
            #   value: /etc/binflow

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /var/lib/binflow
            # binstore.yaml chain (M11 T-306) — uncomment together with the
            # BINFLOW_HOME env above and the config volume at the bottom of
            # this file; shape + priority notes in
            # binstore-configmap.yaml.example (not in kustomization.yaml on
            # purpose: the base stays chain-embedded until you opt in).
            #- name: binstore
            #  mountPath: /etc/binflow/binstore.yaml
            #  subPath: binstore.yaml
            #  readOnly: true

          # ── Probes (distroless — no shell, use exec probes) ─────────
          # K8s runs the healthcheck-probe binary that ships inside the
          # distroless image.  For the alpine variant, switch to httpGet.
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck-probe
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck-probe
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # startupProbe is optional — uncomment for slow-starting clusters:
          # startupProbe:
          #   exec:
          #     command:
          #       - /usr/local/bin/healthcheck-probe
          #   initialDelaySeconds: 3
          #   periodSeconds: 5
          #   timeoutSeconds: 3
          #   failureThreshold: 30

          # ── Resources (required by security baseline) ───────────────
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 512Mi

      # ── Volumes ──────────────────────────────────────────────────────
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: binflow-data
        # binstore.yaml chain (M11 T-306) — uncomment together with the
        # mount above and BINFLOW_HOME; apply the ConfigMap from
        # binstore-configmap.yaml.example first (kubectl apply -f
        # binstore-configmap.yaml.example after editing).
        #- name: binstore
        #  configMap:
        #    name: binflow-binstore

      # ── Termination grace period (aligns with server graceful_timeout) ─
      terminationGracePeriodSeconds: 35
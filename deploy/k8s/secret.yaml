# BinFlow K8s Secret — sample with explanatory comments.
#
# This file is a TEMPLATE.  Before applying, replace every placeholder value
# (everything between angle brackets) with real credentials.
#
# The Deployment references these values via secretKeyRef so that no secret
# material ever appears in the Pod spec.
#
# At minimum you must set:
#   BINFLOW_ADMIN_PASSWORD  — initial admin password (env-only, never in YAML config)
#
# Optional (remote proxy, M3+):
#   BINFLOW_REMOTE_CREDENTIALS_KEY  — AES-256-GCM key for encrypting remote repo passwords
#                                      (32 bytes, base64-encoded)
---
apiVersion: v1
kind: Secret
metadata:
  name: binflow-secret
  labels:
    app.kubernetes.io/name: binflow
    app.kubernetes.io/component: server
type: Opaque
stringData:
  # Admin bootstrap password.  Only used when the admin user does not yet exist
  # (first-run); after the admin password is changed via the API this value is
  # ignored.  The server logs a WARN when the documented default is detected.
  BINFLOW_ADMIN_PASSWORD: "<replace-with-a-strong-password>"

  # Remote credentials encryption key (M3+ remote proxy).  Generate with:
  #   openssl rand -base64 32
  # If you don't use remote repos, leave this commented out or set to an empty
  # string — the server will fail-fast only if remote repos with encrypted
  # passwords exist.
  BINFLOW_REMOTE_CREDENTIALS_KEY: ""
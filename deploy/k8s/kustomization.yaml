# BinFlow Kustomize overlay — base manifests for a vanilla Kustomize install.
#
# Usage:
#   kubectl apply -k deploy/k8s/
#
# To customize for your cluster, either:
#   a) Edit the files directly (simple), or
#   b) Create an overlay that references this base (GitOps-style).
#
# A minimal overlay would look like:
#   mkdir -p deploy/k8s/overlays/prod
#   cat > deploy/k8s/overlays/prod/kustomization.yaml <<EOF
#   apiVersion: kustomize.config.k8s.io/v1beta1
#   kind: Kustomization
#   resources:
#     - ../..
#   patches:
#     - target:
#         kind: Deployment
#         name: binflow
#       patch: |
#         - op: replace
#           path: /spec/replicas
#           value: 3
#     - target:
#         kind: Ingress
#         name: binflow
#       patch: |
#         - op: replace
#           path: /spec/rules/0/host
#           value: binflow.mycompany.com
#   EOF
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: binflow

resources:
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment once you have filled in ingress.yaml:
  # - ingress.yaml
  # binstore.yaml chain (M11 T-306): NOT active by default. Copy
  # binstore-configmap.yaml.example, edit, apply, and uncomment — plus the
  # three marked blocks in deployment.yaml (BINFLOW_HOME + mount + volume).
  # - binstore-configmap.yaml

# Common labels applied to all selected resources.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize

# Image digest pinning — uncomment and adjust after a specific build.
# images:
#   - name: binflow
#     newName: ghcr.io/lzwzzy/binflow
#     newTag: v1.0.0-distroless
# BinFlow UAT protocol matrix (T-469, user directive #10) — the GitHub
# Actions face of the per-protocol push/pull suite that runs after every UAT
# deploy. The matrix logic lives in ONE script — ci/protocol-matrix.sh —
# shared verbatim with the CircleCI `protocol_matrix` job; this workflow
# only supplies the toolchains and fans the legs out.
#
# Trigger: manual (workflow_dispatch) for now. The automatic post-deploy
# lane lives on CircleCI (which owns the deploy itself); the push:main
# trigger below is provided but stays commented until the account's Actions
# billing is healthy again (observed broken 2026-08-28: every job red at
# startup) and the double-run cost is accepted — same surface, same script.
#
# on:
#   push:
#     branches: [main]
#
# Secrets (Settings > Secrets and variables > Actions):
#   UAT_MATRIX_PASSWORD  REQUIRED — the UAT admin password
# Optional repo variables (Settings > Secrets and variables > Variables):
#   UAT_MATRIX_BASE      default https://uat.binflow.org (T-478 — https via
#                        the caddy TLS proxy; transition fallback env:
#                        http://52.79.109.153:8080 until DNS/cert are live)
#   UAT_MATRIX_USER      default admin
#
# Fan-out: one runner per leg (fail-fast off) — a red leg never masks the
# others, mirroring the CircleCI when:always steps.

name: protocol-matrix

on:
  workflow_dispatch:
    inputs:
      legs:
        description: "Comma list of legs (empty = all ten)"
        required: false
        default: ""

concurrency:
  group: protocol-matrix
  cancel-in-progress: false

env:
  BINFLOW_BASE: ${{ vars.UAT_MATRIX_BASE || 'https://uat.binflow.org' }}
  BINFLOW_USER: ${{ vars.UAT_MATRIX_USER || 'admin' }}
  BINFLOW_PASSWORD: ${{ secrets.UAT_MATRIX_PASSWORD }}

jobs:
  matrix:
    name: leg/${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [generic, maven, gradle, npm, pypi, docker, nuget, go, helm, conan]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Transition probe (the 5c36c80e lesson, GH face): the https default
      # strands every leg while DNS is still NXDOMAIN — probe and fall back
      # to the plain-HTTP IP form until it answers. An explicit
      # UAT_MATRIX_BASE variable skips the probe entirely.
      - name: Base URL transition probe
        run: |
          if [ -n "${{ vars.UAT_MATRIX_BASE }}" ]; then
            echo "UAT_MATRIX_BASE set explicitly — probe skipped"
            exit 0
          fi
          DOMAIN="${UAT_DOMAIN:-uat.binflow.org}"
          if curl -fsS -m 8 "https://${DOMAIN}/healthz" >/dev/null 2>&1; then
            echo "BINFLOW_BASE=https://${DOMAIN}" >> "$GITHUB_ENV"
          else
            echo "WARN: https://${DOMAIN} unreachable (DNS/TLS not live) — legs run against the plain-HTTP transition base"
            echo "BINFLOW_BASE=http://${{ vars.UAT_HOST || '52.79.109.153' }}:8080" >> "$GITHUB_ENV"
          fi

      # ubuntu-latest already carries: JDK+mvn 3.9, gradle, node, python3,
      # go, docker, cmake, g++. What it lacks: helm, conan, twine/build —
      # and its preinstalled dotnet (SDK 10) swallows restore failures
      # (MSB4181), so pin the docs anchor (dotnet 8) ahead of it.
      - name: Client toolchains (helm + conan/build/twine + dotnet 8)
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz | tar -xz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          python3 -m pip install --quiet --user conan build twine \
            || python3 -m pip install --quiet --user --break-system-packages conan build twine
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin dotnet 8 (the docs/user/integrations/nuget.md anchor)
        if: matrix.leg == 'nuget'
        run: |
          sudo rm -rf /usr/share/dotnet
          echo "removed system dotnet; remaining:"; command -v dotnet || echo "(none in PATH yet)"
      - name: Install dotnet 8 (the docs anchor)
        if: matrix.leg == 'nuget'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The docker leg needs the daemon to trust the UAT registry only when
      # it is plain HTTP (T-478: an https registry must stay on verified
      # TLS — same conditional the CircleCI leg job runs).
      - name: Docker daemon — trust the UAT registry (plain-HTTP bases only)
        if: matrix.leg == 'docker'
        run: |
          if printf '%s' "$BINFLOW_BASE" | grep -q '^https://'; then
            echo "https UAT base — no insecure-registries needed (public CA chain)"
            if [ -f /etc/docker/daemon.json ]; then
              sudo rm -f /etc/docker/daemon.json
              sudo systemctl restart docker
              echo "removed stale insecure-registries daemon.json"
            fi
          else
            REG="$(printf '%s' "$BINFLOW_BASE" | sed -e 's|^https\{0,1\}://||')"
            sudo mkdir -p /etc/docker
            printf '{"insecure-registries":["%s"]}\n' "$REG" | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
          fi
          docker info | grep -A3 'Insecure Registries'

      - name: Run leg — ${{ matrix.leg }}
        env:
          # matrix.leg is workflow-defined (not event input); SELECTED_LEGS
          # carries the dispatcher's leg filter — both reach the shell via
          # env, never via inline interpolation.
          LEG: ${{ matrix.leg }}
          SELECTED_LEGS: ${{ github.event.inputs.legs }}
          # runner.* is step-level only; the workdir rides with the leg.
          BINFLOW_MATRIX_WORK: ${{ runner.temp }}/matrix-work
          BINFLOW_MATRIX_REPORT: ${{ runner.temp }}/matrix-work/report.log
        run: |
          mkdir -p "$BINFLOW_MATRIX_WORK"
          if [ -n "${SELECTED_LEGS:-}" ]; then
            case ",$SELECTED_LEGS," in
              *",$LEG,"*) ;;
              *) echo "leg $LEG not selected (inputs: $SELECTED_LEGS) — skip"; exit 0 ;;
            esac
          fi
          bash ci/protocol-matrix.sh --strict-tools --leg "$LEG"

      - name: Report
        if: always()
        env:
          BINFLOW_MATRIX_WORK: ${{ runner.temp }}/matrix-work
          BINFLOW_MATRIX_REPORT: ${{ runner.temp }}/matrix-work/report.log
        run: bash ci/protocol-matrix.sh --report || true

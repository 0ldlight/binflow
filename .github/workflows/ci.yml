# BinFlow CI (T-7). Runs the Makefile targets unchanged so local and CI share
# one entrypoint. GOPROXY mirrors goproxy.cn because proxy.golang.org is
# unreachable from this network (ADR-0005); the mirror is a fetch fallback only,
# the dependency set itself is gated by the ADR-0005 whitelist.
# Go version here must match the `go` directive in go.mod (kept in sync by T-7).
# Trigger policy (user directive 2026-08-28, synced with .circleci/config.yml):
# main-branch pushes ONLY — pull_request events were removed so both CI
# systems fire on exactly the same surface. workflow_dispatch (L026-4) is the
# manual-only e2e surface: it never fires on a push, so the automatic surface
# is unchanged; a dispatch run executes ONLY the e2e job (ci, its test lanes,
# and release-dryrun are push-gated), mirroring the CircleCI run_e2e parameter.
name: ci

on:
  push:
    branches: [main]
  # L026-4 (2026-09-17): the e2e debt-family gate, GitHub face. Same posture
  # as .circleci/config.yml's run_e2e parameter (default false): the e2e job
  # below does NOT run on the main-push path until its known-red debt family
  # is paid down — runs #121/#122/#123 all reddened/cancelled on it (45m
  # timeout burn). To run it meanwhile: Actions tab -> ci -> Run workflow ->
  # tick run_e2e. Reopen conditions below, at the e2e job's `if:`.
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the e2e suite (known-red debt family — see the e2e job note)"
        type: boolean
        default: false

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  ci:
    # L026-4: push-only — a workflow_dispatch run (the manual e2e surface)
    # must not re-burn the ci gate suite; see `on:` above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # T-522: OpenAPI drift gate — fern/openapi/binflow.json is generated
      # by tools/openapi-spec/build_spec.py; the committed artifact must
      # match the generator output byte-for-byte (the 2026-09-20 de-brand
      # pass hand-edited the json without the generator — the rot class
      # this catches). Same Makefile target as the CircleCI face and local
      # runs: one command, no surface drift. Needs only python3 + git
      # (ubuntu-latest ships both), so it runs before any toolchain setup.
      - name: OpenAPI spec drift gate
        run: make spec-check

      # T-526: Fern en-pages ratchet — the English docs surface (T-521) may
      # only grow. Fails on count drift in EITHER direction: a drop is
      # coverage loss, a rise requires bumping fern/en-pages.count (make
      # fern-en-baseline) so the new floor is locked in. Same Makefile
      # target as the CircleCI face and local runs: one command, no surface
      # drift. bash+find only — runs before any toolchain setup, <0.1s.
      - name: Fern en-pages ratchet
        run: make fern-en-ratchet

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      # Console toolchain (T-89, ADR-0014 decision 4): node is a BUILD-time
      # dependency only — `make build` alone stays node-free on the committed
      # placeholder shell; CI builds the real SPA first so the tested and
      # shipped binary embeds it.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Console lint + typecheck
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Console audit (high-severity gate, ADR-0014 D4)
        working-directory: web
        run: npm audit --audit-level=high

      - name: Build console into internal/console/dist
        run: make console

      - name: Show toolchain
        run: |
          go version
          grep '^go ' go.mod

      # lint delegates to the Makefile (single entrypoint); the -race test
      # suite moved OFF this job (T-552 / BIN-34) into the parallel `test`
      # lane matrix below — the structural closeout of the TEST_TIMEOUT
      # doubling sequence. Every other leg here keeps its original order.
      - name: Lint
        run: make lint

      # GC concurrency stress (ADR-0031 / architecture section 14.2 point 6
      # and section 14.5-5): the T-232 race legs — uploads (and
      # upload→delete streams) racing grace=0 APPLY sweeps, invariant = a
      # committed reference's blob is never physically deleted. These run
      # with repetition as their OWN step so a flaky interleave cannot hide
      # inside the bulk suite. ORDERING HARD RULE (satisfied, then permanent):
      # this gate landed BEFORE T-268 restored e2e default parallelism
      # (--workers=1 convention lifted 2026-08-25). The coupling is permanent
      # — removing or weakening this step requires re-serializing e2e in the
      # same change set. The Go-level race gate and the e2e job below
      # (T-350) are complements: this one pins the engine invariant, the
      # e2e job is the UI-plane authority.
      - name: GC concurrency stress (ADR-0031 §14.2-6)
        run: >
          go test -race -count=3 -timeout 20m
          -run 'TestGCApplyRacingUploadsZeroGraceNeverDeletesReferenced|TestGCInFlightUploadMidSweepHold|TestGCHoldRefcountSurvivesConcurrentDedup|TestGCHeldBlobSurvivesZeroGraceApply|TestRepoUploadsRacingZeroGraceSweep'
          ./internal/storage/ ./internal/repo/

      - name: Build (zero CGo, ADR-0005)
        run: |
          CGO_ENABLED=0 go build ./...
          make build

  # Test lanes (T-552 / BIN-34) — the structural closeout of the Test
  # budget sequence on this face. History, all main-push runs:
  #   10m -> 30m (run 33881407081): the shared runner executes the race
  #     suite ~2x slower than idle metal (repo alone 772s); the 20m wall
  #     tripped mid-suite with every package healthy — capacity, not rot.
  #   30m -> 60m (run 36411042188): httpapi ~1300s nominal (72% of 30m)
  #     plus a uniform runner-wide slowdown (R3-untouched auth +26% /
  #     search +91%), no single hung test — capacity again. First green
  #     at 60m: run 36431243387 (2026-09-28, merge #167; Test step 27m13s,
  #     httpapi 1056s of it, suite per-package sum ~70m over 4 vCPUs).
  # GOVERNANCE (R4 dual review, Reviewer B): the doubling sequence STOPS at
  # 60m — no third raise, ever. Suite growth is answered with LANES (add
  # or split one), never a bigger TEST_TIMEOUT.
  # Shape: one lane per heavy package on its own runner — internal/httpapi,
  # internal/repo, internal/auth, internal/search — plus the light lane
  # whose package set is the COMPLEMENT of those four over the Makefile's
  # universe (go list ./... minus web/): a new package lands in the light
  # lane automatically, so the union of lanes can never silently miss one.
  # Per-package timings (run 36431243387): httpapi 1056s / repo 747s /
  # auth 313s / search 144s; heaviest light-lane members replication 183s,
  # adapter/npm 161s, remote 159s. Every lane builds the real console
  # first (T-89): the pre-split Test step compiled against the real-SPA
  # embed — placeholder-vs-real is a semantics change (the CircleCI
  # build-job shard ruling). fail-fast: false — one red lane must not
  # cancel its siblings; attribution stays per-lane on the commit status
  # (matrix check names: test (httpapi) ... test (light)).
  test:
    # Pin the check name to `test (<lane>)`; without an explicit name
    # GitHub appends every matrix value (`test (httpapi, ./internal/httpapi)`),
    # drifting from the names the T-552 lane split was specified with.
    name: test (${{ matrix.lane }})
    # Same trigger posture as the ci job: push-only — a workflow_dispatch
    # run (the manual e2e surface) must not burn the lanes.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: httpapi
            pkgs: ./internal/httpapi
          - lane: repo
            pkgs: ./internal/repo
          - lane: auth
            pkgs: ./internal/auth
          - lane: search
            pkgs: ./internal/search
          # light: the computed complement of the four heavy lanes — pkgs
          # stays empty and the Test lane step derives the list via go list.
          - lane: light
            pkgs: ""
    runs-on: ubuntu-latest
    env:
      LANE_PKGS: ${{ matrix.pkgs }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      # Console embed parity with the ci job (T-89): tests compile against
      # the real SPA, not the committed placeholder shell. The npm cache
      # keeps this cheap on warm runs (run 36431243387: make console 12s).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build console into internal/console/dist
        run: make console

      - name: Test lane
        run: |
          if [ -z "$LANE_PKGS" ]; then
            # go list emits newline-separated paths; make's $(shell go list
            # $(PKGS)) cannot take raw newlines (R5 Reviewer A blocking:
            # make 3.81 chokes malformed-path, make 4.x sh-splits and the
            # guard would pass on the FIRST package alone — 35 of 36
            # silently dropping out of the main-push race coverage).
            # Collapse to the space-separated form the Makefile target (and
            # T-552's local verification) actually exercises.
            LANE_PKGS="$(go list ./... | grep -v '/binflow/web/' \
              | grep -v -E '/(httpapi|repo|auth|search)$' | tr '\n' ' ')"
          fi
          echo "lane ${{ matrix.lane }}: $LANE_PKGS"
          make test-pkgs PKGS="$LANE_PKGS" TEST_TIMEOUT=60m

  # E2E — the full Playwright suite on a dedicated runner (T-350, FR-113.6 /
  # K46). This job is the AUTHORITATIVE signal for the e2e load-flake family
  # (T-327 §7 protocol + T-329 observation 4): the flakes are load-induced
  # stragglers — axe scans and polling budgets starving under colocated
  # dev-machine load (parallel agents, builds, other e2e runs) — so a runner
  # nothing else shares is the environment the 180s per-test budget was
  # sized for. The local protocol stays "serial rerun green = pass"
  # (web/README.md); when local and CI disagree, CI wins and the local red
  # is an isolation finding, not a product regression.
  #
  # Shape: build the real binary (SPA embedded via make console, the same
  # T-89 strategy as the ci job), boot it on defaults, seed through the REAL
  # REST plane (seed-m8/m9/m10 — the same convergent seeds QA runs), then a
  # bare `npx playwright test` = all three projects (chromium + m9 + m10),
  # every spec exactly once. Workers pinned to 2 — below the config's
  # local floor of 4 on purpose: a first landing on shared-tier runner
  # hardware keeps headroom in the axe-heavy legs' 300s budget; raise it
  # only with three consecutive green main runs as evidence.
  #
  # Trigger posture (L024-2 -> L026-4): GATED OFF the main-push path. The
  # suite carries ~55 known-red legs at HEAD (the fe-rewrite spec debt —
  # census in reports/agents/L025-2.md: bucket A 25 legs pinning the OLD
  # console's implementation details, bucket B 8 legs on the develop-tail
  # console drift, bucket C 18 pre-rewrite rot incl. data-dependent
  # design-baseline goldens). Runs #121/#122/#123 all reddened on this job
  # (the 45m timeout kills it mid-Playwright). Mirrors the CircleCI
  # run_e2e parameter (default false since L024-2). PR-granularity runs
  # remain deliberately out (the 2026-08-28 one-CI-surface directive).
  #
  # REOPEN (conductor decision, not a silent flip): when the L026-2 spec
  # re-derivation ticket lands green AND the L025-2 census buckets A(25) +
  # B(8) + C(18) are zeroed (conductor-confirmed), DELETE the `if:` line
  # below — the job returns to always-on main-push. Same moment on the
  # CircleCI face: flip the run_e2e default to true there (its parameters
  # note carries the same conditions). Until then the job runs only via
  # workflow_dispatch with run_e2e=true (the `on:` block above).
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: http://127.0.0.1:8080
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Same embed strategy as the ci job: the placeholder shell would test
      # a console that never ships. make console runs web's npm ci itself.
      # The docs face rides the committed internal/docs/dist embed (the
      # docs-site rebuild was retired 2026-09-16, L024-2 — fern is the docs
      # surface now); t146-docs.spec still asserts the real mount.
      - name: Build console into internal/console/dist
        run: make console

      - name: Build server
        run: make build

      - name: Install Playwright browser (chromium)
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Boot on defaults: :8080, ./data in the workspace, admin/password
      # (the credentials every seed and spec assumes when ADMIN_PW is unset).
      # No binflow.yaml anywhere — the FR-6-AC5 bare-binary form, which also
      # exercises the default-boot storage-chain resolution in CI.
      - name: Boot BinFlow (defaults + env)
        run: |
          nohup ./bin/binflow-server serve > "$RUNNER_TEMP/binflow.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/binflow.pid"
          for i in $(seq 1 60); do
            if curl -fsS "$BASE/healthz" > /dev/null 2>&1; then
              echo "binflow healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "binflow never became healthy; log tail:"
          tail -50 "$RUNNER_TEMP/binflow.log" || true
          exit 1

      - name: Seed (m8 + m9 + m10, real REST plane)
        working-directory: web
        run: |
          node scripts/seed-m8.mjs
          node scripts/seed-m9.mjs
          node scripts/seed-m10.mjs

      - name: Playwright (all three projects, dedicated runner)
        working-directory: web
        run: npx playwright test --workers=2

      - name: Stop BinFlow
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/binflow.pid" ] && kill "$(cat "$RUNNER_TEMP/binflow.pid")" 2>/dev/null || true

      - name: Server log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/binflow.log" || true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            web/test-results
            ${{ runner.temp }}/binflow.log
          retention-days: 7

  # Release dry-run (T-127, FR-34-AC1/AC3): full six-platform snapshot via
  # the same Makefile entrypoint, zero credentials — Q1/DoD 7 keep every
  # publish face outside CI. `make release-snapshot` self-verifies (six
  # archives + checksums + 40MB gate), so the job fails on any breach; the
  # ls just makes the artifact list visible in the log. goreleaser installs
  # itself on demand, pinned in .tool-versions (same pattern as lint).
  release-dryrun:
    # L026-4: push-only, same reason as the ci job above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser reads commit metadata (tags at GA)

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      # Embed the real SPA so the size gate sees honest numbers (the
      # placeholder shell would under-report; T-89 strategy).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build console into internal/console/dist
        run: make console

      # L024-2 (2026-09-16): docs-site rebuild retired — the release embeds
      # the committed internal/docs/dist face (fern is the docs surface).
      - name: Release snapshot (six platforms, zero CGo)
        run: make release-snapshot

      - name: Show dist
        run: ls -l dist

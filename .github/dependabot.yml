version: 2
updates:
  # Dependency bumps flow into develop (the validated integration branch),
  # never straight into main — main is the UAT source and only receives
  # tested trees via develop merges. See 2026-09-04 MUI 7→9 incident.
  # Go module — the server, adapters, and search engine
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor:
        update-types: [minor, patch]

  # Console (React + Vite + MUI)
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dev-minor:
        dependency-type: development
        update-types: [minor, patch]

  # Docs site
  - package-ecosystem: npm
    directory: /docs-site
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # GitHub Actions workflows (when present)
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <title>go 包型图标（品牌色版，wire 值 go）</title>
  <!-- Go 官方青（#00ADD8）斜体 GO + 速度线；仅作包型识别。K56 生产化：GO 由 text 转
       monoline path（与 mono 版同骨架，stroke 2.3 圆帽 + skewX(-8) 斜体），零字体依赖 -->
  <path d="M1.8 9.6h3.2M0.8 12.4h4.2" stroke="#00ADD8" stroke-width="1.6" stroke-linecap="round"/>
  <g transform="translate(1.6 0) skewX(-8)" stroke="#00ADD8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.7 12H12.45A2.45 2.45 0 1 1 11.23 9.88"/>
    <path d="M14.95 12A2.45 2.45 0 0 1 19.85 12A2.45 2.45 0 0 1 14.95 12"/>
  </g>
</svg>

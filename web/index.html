<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BinFlow modular brand/favicon/PWA wiring. Vite prefixes public URLs;
         wire-brand-assets.mjs moves the built files to immutable /binflow/assets/. -->
    <meta name="theme-color" content="#18181B" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="mask-icon" href="/brand/safari-pinned-tab.svg" color="#18181B" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/manifest.json" />
    <title>BinFlow Console</title>
  </head>
  <body>
    <!-- The SPA mount point the e2e smoke spec keys on (W01: id="root"). -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

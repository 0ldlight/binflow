apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "binflow.fullname" . }}
  labels:
    {{- include "binflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "binflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "binflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "binflow.serviceAccountName" . }}
      # Suppress K8s-generated service environemnt variables (e.g.
      # BINFLOW_SERVICE_HOST) which BinFlow's config parser would
      # treat as unknown BINFLOW_ env vars and fail on startup.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "binflow.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: BINFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "binflow.fullname" . }}-secret
                  key: BINFLOW_ADMIN_PASSWORD
          {{- if .Values.config.baseUrl }}
            - name: BINFLOW_BASE_URL
              value: {{ .Values.config.baseUrl | quote }}
          {{- end }}
          {{- /*
            ADR-0009: admin password via env only, never in ConfigMap.
            ConfigMap (binflow.yaml) is mounted at /etc/binflow/binflow.yaml.
          */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
            - name: config
              mountPath: /etc/binflow/binflow.yaml
              subPath: binflow.yaml
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "binflow.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "binflow.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
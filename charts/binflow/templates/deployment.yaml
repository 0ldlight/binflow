apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "binflow.fullname" . }}
  labels:
    {{- include "binflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "binflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "binflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "binflow.serviceAccountName" . }}
      # Suppress K8s-generated service environemnt variables (e.g.
      # BINFLOW_SERVICE_HOST) which BinFlow's config parser would
      # treat as unknown BINFLOW_ env vars and fail on startup.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "binflow.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: BINFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "binflow.fullname" . }}-secret
                  key: BINFLOW_ADMIN_PASSWORD
            # Load the mounted config: with BINFLOW_HOME set and no
            # ./binflow.yaml in the workdir, serve resolves the config to
            # /etc/binflow/binflow.yaml (the ConfigMap below). Without this
            # the mount was inert decoration.
            - name: BINFLOW_HOME
              value: /etc/binflow
            {{- if .Values.config.s3.enabled }}
            # S3 secret key — env-only (ADR-0009), never in the ConfigMap.
            - name: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.s3.existingSecret is required when config.s3.enabled=true — create it with: kubectl create secret generic binflow-s3 --from-literal=BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY=<key>" .Values.config.s3.existingSecret }}
                  key: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY
            {{- end }}
            {{- if .Values.config.oidc.enabled }}
            # OIDC client secret — env-only (ADR-0020).
            - name: BINFLOW_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.oidc.existingSecret is required when config.oidc.enabled=true — create it with: kubectl create secret generic binflow-oidc --from-literal=BINFLOW_AUTH_OIDC_CLIENT_SECRET=<secret>" .Values.config.oidc.existingSecret }}
                  key: BINFLOW_AUTH_OIDC_CLIENT_SECRET
            {{- end }}
            {{- if .Values.config.ldap.enabled }}
            # LDAP bind password — env-only (ADR-0020).
            - name: BINFLOW_AUTH_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.ldap.existingSecret is required when config.ldap.enabled=true — create it with: kubectl create secret generic binflow-ldap --from-literal=BINFLOW_AUTH_LDAP_BIND_PASSWORD=<password>" .Values.config.ldap.existingSecret }}
                  key: BINFLOW_AUTH_LDAP_BIND_PASSWORD
            {{- end }}
          {{- /*
            ADR-0009: secrets (admin password, S3 secret key, OIDC client
            secret, LDAP bind password) ride env vars sourced from Secrets;
            the ConfigMap (binflow.yaml) mounted at /etc/binflow carries only
            non-secret configuration (T-170: storage.s3 + auth.oidc/ldap).
          */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
            - name: config
              mountPath: /etc/binflow/binflow.yaml
              subPath: binflow.yaml
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "binflow.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "binflow.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
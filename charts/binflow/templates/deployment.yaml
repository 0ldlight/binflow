{{- /* M11 T-306 / ADR-0036 render-time guards (see _helpers.tpl — invoked
      here AND in configmap.yaml because Helm's render order is not
      guaranteed). */}}
{{- include "binflow.binstoreValidate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "binflow.fullname" . }}
  labels:
    {{- include "binflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, never RollingUpdate (T-376): SQLite WAL + the serve.lock are
  # single-writer — a rolling update briefly coexists old and new pods on
  # the same RWO PVC and the incoming pod CrashLoops on "serve.lock is
  # held by another process" (observed live: every helm upgrade that
  # changes the pod template hangs at Pending termination while the old
  # pod keeps serving the OLD config). Same posture as the raw manifests
  # (deploy/k8s/deployment.yaml).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "binflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Config checksum (T-376): the server reads binflow.yaml (and
        # binstore.yaml) only at BOOT, and a ConfigMap content change alone
        # does not change the pod template — without this annotation a
        # `helm upgrade` that only flips config values (the M13 knob
        # families are restart-effective by design) silently keeps the OLD
        # values until a manual pod deletion. The checksum makes any
        # rendered-config change a rollout.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "binflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "binflow.serviceAccountName" . }}
      # Suppress K8s-generated service environemnt variables (e.g.
      # BINFLOW_SERVICE_HOST) which BinFlow's config parser would
      # treat as unknown BINFLOW_ env vars and fail on startup.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "binflow.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: BINFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "binflow.fullname" . }}-secret
                  key: BINFLOW_ADMIN_PASSWORD
            # Load the mounted config: with BINFLOW_HOME set and no
            # ./binflow.yaml in the workdir, serve resolves the config to
            # /etc/binflow/binflow.yaml (the ConfigMap below). Without this
            # the mount was inert decoration.
            - name: BINFLOW_HOME
              value: /etc/binflow
            {{- if .Values.masterKey.existingSecret }}
            # Instance master key (M11, env-only): seals remote-repository
            # credentials, replication secrets, auth_configs and GPG
            # keypairs as enc:v1 rows (T-305/T-319). Once any sealed row
            # exists the boot fail-fasts without the same key.
            - name: BINFLOW_REMOTE_CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masterKey.existingSecret }}
                  key: BINFLOW_REMOTE_CREDENTIALS_KEY
            {{- end }}
            {{- if and .Values.config.binstore.enabled (has "s3" .Values.config.binstore.providers) }}
            # S3 secret key for the binstore.yaml chain — env-only
            # (ADR-0009 decision 4): the secret always reaches the live S3
            # provider even though binstore.yaml owns every other S3 knob.
            - name: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.binstore.s3.existingSecret is required when the binstore chain includes s3 — create it with: kubectl create secret generic binflow-s3 --from-literal=BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY=<key>" .Values.config.binstore.s3.existingSecret }}
                  key: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY
            {{- end }}
            {{- if .Values.config.s3.enabled }}
            # S3 secret key — env-only (ADR-0009), never in the ConfigMap.
            - name: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.s3.existingSecret is required when config.s3.enabled=true — create it with: kubectl create secret generic binflow-s3 --from-literal=BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY=<key>" .Values.config.s3.existingSecret }}
                  key: BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY
            {{- end }}
            {{- if .Values.config.oidc.enabled }}
            # OIDC client secret — env-only (ADR-0020).
            - name: BINFLOW_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.oidc.existingSecret is required when config.oidc.enabled=true — create it with: kubectl create secret generic binflow-oidc --from-literal=BINFLOW_AUTH_OIDC_CLIENT_SECRET=<secret>" .Values.config.oidc.existingSecret }}
                  key: BINFLOW_AUTH_OIDC_CLIENT_SECRET
            {{- end }}
            {{- if .Values.config.ldap.enabled }}
            # LDAP bind password — env-only (ADR-0020).
            - name: BINFLOW_AUTH_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.ldap.existingSecret is required when config.ldap.enabled=true — create it with: kubectl create secret generic binflow-ldap --from-literal=BINFLOW_AUTH_LDAP_BIND_PASSWORD=<password>" .Values.config.ldap.existingSecret }}
                  key: BINFLOW_AUTH_LDAP_BIND_PASSWORD
            {{- end }}
          {{- /*
            ADR-0009: secrets (admin password, S3 secret key, OIDC client
            secret, LDAP bind password, instance master key) ride env vars
            sourced from Secrets; the ConfigMap (binflow.yaml + binstore.yaml)
            mounted at /etc/binflow carries only non-secret configuration
            (T-170: storage.s3 + auth.oidc/ldap; T-325: binstore chain).
          */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
            - name: config
              mountPath: /etc/binflow/binflow.yaml
              subPath: binflow.yaml
              readOnly: true
            {{- if .Values.config.binstore.enabled }}
            # binstore.yaml (M11 T-306 / ADR-0036): mounted next to
            # binflow.yaml — BINFLOW_HOME=/etc/binflow above is what makes
            # the server discover it there. It owns the storage chain; the
            # chart renders no chain keys into binflow.yaml while it exists.
            - name: config
              mountPath: /etc/binflow/binstore.yaml
              subPath: binstore.yaml
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "binflow.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "binflow.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
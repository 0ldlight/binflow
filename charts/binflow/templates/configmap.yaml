apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "binflow.fullname" . }}-config
  labels:
    {{- include "binflow.labels" . | nindent 4 }}
{{- /* M11 T-306 / ADR-0036 render-time guards (see _helpers.tpl — invoked
      here AND in deployment.yaml because Helm's render order is not
      guaranteed). */}}
{{- include "binflow.binstoreValidate" . }}
data:
  binflow.yaml: |
    # BinFlow server configuration (generated by Helm chart; S3/OIDC/LDAP
    # pass-through added in T-170; M7/M9/M10 keys caught up in T-295;
    # binstore.yaml dual-source model in T-325).
    # Section and key names mirror the strict schema in internal/config
    # (unknown keys fail-fast at boot):
    # server / storage(.s3) / logging / security / auth(.oidc,.ldap) /
    # replication / webhook / folder_download / trashcan / addons.
    # Managed keys are rendered EXPLICITLY, defaults
    # included — the lesson of T-183: silent key absence reads as a silent
    # default, so the effective posture of every chart-managed key is
    # visible in this file.
    # Secrets never enter this file (ADR-0009) — they ride env vars sourced
    # from Kubernetes Secrets (see deployment.yaml).
    server:
      base_url: {{ .Values.config.baseUrl | quote }}
    storage:
      data_dir: {{ .Values.config.dataDir }}
      {{- /* int64 cast: Helm values round-trip ints as float64, and the
            raw YAML would render 600 as 600 — safe here, but keep the cast
            for consistency with the s3 block and future-proofing. */}}
      gc_hold_ttl_seconds: {{ .Values.config.storage.gcHoldTtlSeconds | int64 }}
      {{- if .Values.config.binstore.enabled }}
      # The storage CHAIN is owned by binstore.yaml (config.binstore, M11
      # T-306 / ADR-0036): backend/s3 chain keys are deliberately absent
      # here — Q5 branch ②, the file wins silently. data_dir and
      # gc_hold_ttl_seconds are NOT chain keys and stay in this file.
      # While binstore.yaml owns the chain, any chain-scoped env var
      # (BINFLOW_STORAGE__BACKEND, BINFLOW_STORAGE__S3__*) is ignored with
      # a WARN; only BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY still applies.
      {{- else if .Values.config.s3.enabled }}
      backend: s3
      # S3 backend (M6): secret_access_key is env-only
      # (BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY via config.s3.existingSecret).
      s3:
        bucket: {{ .Values.config.s3.bucket | quote }}
        region: {{ .Values.config.s3.region | quote }}
        endpoint: {{ .Values.config.s3.endpoint | quote }}
        access_key_id: {{ .Values.config.s3.accessKeyId | quote }}
        use_path_style: {{ .Values.config.s3.usePathStyle }}
        {{- if .Values.config.s3.bucketPrefix }}
        bucket_prefix: {{ .Values.config.s3.bucketPrefix | quote }}
        {{- end }}
        {{- if .Values.config.s3.uploadPartSize }}
        {{- /* int64 cast: Helm values round-trip ints as float64, and the
              raw YAML would render 5.24288e+06 — the server's strict
              decoder rejects a float where an int is expected. */}}
        upload_part_size: {{ .Values.config.s3.uploadPartSize | int64 }}
        {{- end }}
        {{- if .Values.config.s3.uploadConcurrency }}
        upload_concurrency: {{ .Values.config.s3.uploadConcurrency | int64 }}
        {{- end }}
      {{- else }}
      backend: disk
      {{- end }}
    logging:
      level: {{ .Values.config.logLevel }}
    security:
      anonymous_access: {{ .Values.config.security.anonymousAccess }}
    auth:
      # Token-minting posture (M7 T-219 / ADR-0027): rendered explicitly so
      # the step-up stance is visible (T-183 lesson). token_step_up=false is
      # the server default — an unconfigured boot keeps the pre-M7 posture.
      token_step_up: {{ .Values.config.auth.tokenStepUp }}
      token_step_up_grant_ttl_seconds: {{ .Values.config.auth.tokenStepUpGrantTtlSeconds | int64 }}
      {{- if .Values.config.oidc.enabled }}
      # OIDC identity provider (M6 / ADR-0020): requires a server build with
      # the auth wiring. client_secret is env-only
      # (BINFLOW_AUTH_OIDC_CLIENT_SECRET via config.oidc.existingSecret).
      oidc:
        enabled: {{ .Values.config.oidc.enabled }}
        issuer_url: {{ .Values.config.oidc.issuerUrl | quote }}
        client_id: {{ .Values.config.oidc.clientId | quote }}
        redirect_url: {{ .Values.config.oidc.redirectUrl | quote }}
        {{- if .Values.config.oidc.scopes }}
        scopes:
          {{- toYaml .Values.config.oidc.scopes | nindent 10 }}
        {{- end }}
        {{- if .Values.config.oidc.userClaim }}
        user_claim: {{ .Values.config.oidc.userClaim | quote }}
        {{- end }}
        {{- if .Values.config.oidc.groupClaim }}
        group_claim: {{ .Values.config.oidc.groupClaim | quote }}
        {{- end }}
        {{- if .Values.config.oidc.adminGroup }}
        admin_group: {{ .Values.config.oidc.adminGroup | quote }}
        {{- end }}
        {{- if .Values.config.oidc.readOnlyGroup }}
        readonly_group: {{ .Values.config.oidc.readOnlyGroup | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.config.ldap.enabled }}
      # LDAP identity provider (M6 / ADR-0020): login-endpoint bind only.
      # bind_password is env-only (BINFLOW_AUTH_LDAP_BIND_PASSWORD via
      # config.ldap.existingSecret).
      ldap:
        enabled: {{ .Values.config.ldap.enabled }}
        url: {{ .Values.config.ldap.url | quote }}
        base_dn: {{ .Values.config.ldap.baseDn | quote }}
        {{- if .Values.config.ldap.bindDn }}
        bind_dn: {{ .Values.config.ldap.bindDn | quote }}
        {{- end }}
        {{- if .Values.config.ldap.userFilter }}
        user_filter: {{ .Values.config.ldap.userFilter | quote }}
        {{- end }}
        {{- if .Values.config.ldap.userIdAttr }}
        user_id_attr: {{ .Values.config.ldap.userIdAttr | quote }}
        {{- end }}
        {{- if .Values.config.ldap.groupFilter }}
        group_filter: {{ .Values.config.ldap.groupFilter | quote }}
        {{- end }}
        {{- if .Values.config.ldap.groupBaseDn }}
        group_base_dn: {{ .Values.config.ldap.groupBaseDn | quote }}
        {{- end }}
        {{- if .Values.config.ldap.groupNameAttr }}
        group_name_attr: {{ .Values.config.ldap.groupNameAttr | quote }}
        {{- end }}
        {{- if .Values.config.ldap.adminGroup }}
        admin_group: {{ .Values.config.ldap.adminGroup | quote }}
        {{- end }}
        {{- if .Values.config.ldap.readOnlyGroup }}
        readonly_group: {{ .Values.config.ldap.readOnlyGroup | quote }}
        {{- end }}
        pool_size: {{ .Values.config.ldap.poolSize | int64 }}
        start_tls: {{ .Values.config.ldap.startTls }}
        # TLS posture pair (T-186 keys, chart catch-up T-194): rendered
        # explicitly so the effective certificate-verification stance is
        # visible in the rendered ConfigMap (lesson of T-183: silent key
        # absence reads as a silent default). skip_tls_verify=true logs a
        # WARN at boot — evaluation only, never production.
        skip_tls_verify: {{ .Values.config.ldap.skipTlsVerify }}
      {{- end }}
    # Push-replication SSRF posture (T-210 / ADR-0025 decision 4): rendered
    # explicitly — allow_private_target=true is the server default, but the
    # effective screening posture of the replication plane must be visible
    # (T-183 lesson).
    replication:
      allow_private_target: {{ .Values.config.replication.allowPrivateTarget }}
    # Webhook SSRF posture (M13 T-362 / ADR-0041 decision 6): rendered
    # explicitly — the default is DENY (false), the deliberate asymmetry
    # against replication above (webhook targets are REST-CRUD dynamic);
    # the effective screening posture of the webhook plane must be visible
    # (T-183 lesson).
    webhook:
      allow_private_target: {{ .Values.config.webhook.allowPrivateTarget }}
    # Directory-zip knobs (M13 T-368 / FR-118.1, six fields) and the
    # trashcan retention window (FR-118.2): rendered explicitly so the
    # effective knob posture is visible (T-183 lesson). The resolved
    # values echo at GET /binflow/api/v1/system/settings. chartsBaseUrl is
    # deliberately ABSENT here: it is a per-repository field on helm
    # remote repositories (set via the repositories API), not a global
    # config key.
    folder_download:
      enabled: {{ .Values.config.folderDownload.enabled }}
      enabled_for_anonymous: {{ .Values.config.folderDownload.enabledForAnonymous }}
      max_download_size_mb: {{ .Values.config.folderDownload.maxDownloadSizeMb | int64 }}
      max_files: {{ .Values.config.folderDownload.maxFiles | int64 }}
      max_concurrent_requests: {{ .Values.config.folderDownload.maxConcurrentRequests | int64 }}
      enabled_empty_directories: {{ .Values.config.folderDownload.enabledEmptyDirectories }}
    trashcan:
      retention_days: {{ .Values.config.trashcan.retentionDays | int64 }}
    # Addon circuit breaker (M10 T-283, ADR-0032 / architecture section
    # 15.5): disabled is a CSV of addon ids, restart-effective, deletes
    # nothing. Rendered explicitly — the breaker's OFF state ("" = nothing
    # disabled) must be visible, not silently absent (T-183 lesson). A core
    # package-type id (generic, docker, maven, npm, pypi) in the list is a
    # degradation knob: the server WARNs at boot and honors it anyway.
    # There is NO license-related config key (the license plane has none);
    # BINFLOW_M10_LICENSE_DIR is a tier-matrix TEST env var and must never
    # be set on the server — the strict env scan would refuse the boot.
    addons:
      disabled: {{ .Values.config.addons.disabled | quote }}
  {{- if .Values.config.binstore.enabled }}
  {{- /* Guards already ran (binflow.binstoreValidate, _helpers.tpl);
        $dual only steers the migration block below. */}}
  {{- $dual := eq (join "," .Values.config.binstore.providers) "filestore,s3" }}
  # Standalone storage-chain file (M11 T-306 / ADR-0036). Mounted next to
  # binflow.yaml (see deployment.yaml) — the server discovers it there and
  # it owns the storage chain. No plaintext secret key is legal anywhere in
  # this file (recursive scan, line-pointed refusal): the S3 secret rides
  # BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY via config.binstore.s3.existingSecret.
  binstore.yaml: |
    version: 1
    chain:
    {{- if has "filestore" .Values.config.binstore.providers }}
      - type: filestore
    {{- end }}
    {{- if has "s3" .Values.config.binstore.providers }}
      - type: s3
        bucket: {{ .Values.config.binstore.s3.bucket | quote }}
        region: {{ .Values.config.binstore.s3.region | quote }}
        endpoint: {{ .Values.config.binstore.s3.endpoint | quote }}
        access_key_id: {{ .Values.config.binstore.s3.accessKeyId | quote }}
        use_path_style: {{ .Values.config.binstore.s3.usePathStyle }}
        {{- if .Values.config.binstore.s3.bucketPrefix }}
        bucket_prefix: {{ .Values.config.binstore.s3.bucketPrefix | quote }}
        {{- end }}
        {{- if .Values.config.binstore.s3.uploadPartSize }}
        upload_part_size: {{ .Values.config.binstore.s3.uploadPartSize | int64 }}
        {{- end }}
        {{- if .Values.config.binstore.s3.uploadConcurrency }}
        upload_concurrency: {{ .Values.config.binstore.s3.uploadConcurrency | int64 }}
        {{- end }}
    {{- end }}
    {{- if $dual }}
    migration:
      mode: {{ .Values.config.binstore.migration.mode }}
      {{- if .Values.config.binstore.migration.concurrency }}
      concurrency: {{ .Values.config.binstore.migration.concurrency | int64 }}
      {{- end }}
    {{- end }}
  {{- end }}

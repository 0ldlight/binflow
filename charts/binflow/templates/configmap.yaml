apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "binflow.fullname" . }}-config
  labels:
    {{- include "binflow.labels" . | nindent 4 }}
data:
  binflow.yaml: |
    # BinFlow server configuration (generated by Helm chart).
    base_url: {{ .Values.config.baseUrl | quote }}
    data_dir: {{ .Values.config.dataDir }}
    log_level: {{ .Values.config.logLevel }}
    security:
      anonymous_access: {{ .Values.config.security.anonymousAccess }}
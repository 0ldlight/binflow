{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "binflow.fullname" . }}
  labels:
    {{- include "binflow.labels" . | nindent 4 }}
  annotations:
    {{- /*
      ADR-0010: /v2/ is a root-level exception handled by the BinFlow server
      itself. The ingress does NOT rewrite paths — all requests pass through
      as-is. Both / and /v2/ are routed to the same backend without rewrite
      annotations.
    */}}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* Ensure both / and /v2/ paths are present for direct passthrough */}}
          {{- $hasRoot := false }}
          {{- $hasV2 := false }}
          {{- range .paths }}
          {{- if eq .path "/" }}{{ $hasRoot = true }}{{ end }}
          {{- if eq .path "/v2/" }}{{ $hasV2 = true }}{{ end }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "binflow.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- if not $hasRoot }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "binflow.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- if not $hasV2 }}
          - path: /v2/
            pathType: Prefix
            backend:
              service:
                name: {{ include "binflow.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
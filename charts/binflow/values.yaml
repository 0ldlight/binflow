# BinFlow Helm Chart — default values (GA v1.0.0).

# -- Number of replicas. Single replica only (HA is a M6+ feature);
#    values.schema.json enforces maximum:1.
replicaCount: 1

image:
  # -- Container image repository.
  repository: ghcr.io/lzwzzy/binflow
  # -- Overrides the image tag (defaults to Chart appVersion-distroless).
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- String to partially override the fullname template (will be prefixed).
nameOverride: ""
# -- String to fully override the fullname template.
fullnameOverride: ""

# -- ServiceAccount for the BinFlow pod.
serviceAccount:
  # -- Whether to create a ServiceAccount.
  create: true
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- The name of the ServiceAccount to use. If not set and create is true,
  #    a name is generated using the fullname template.
  name: ""

# -- Pod annotations.
podAnnotations: {}
# -- Pod security context.
podSecurityContext: {}
  # fsGroup: 10001

# -- Container security context.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 10001

# -- Service configuration.
service:
  # -- Service type. ClusterIP for internal-only; NodePort/LoadBalancer for
  #    external access. docker push/pull works with NodePort + dind.
  type: ClusterIP
  # -- HTTP port for the BinFlow server.
  port: 8080
  # -- NodePort port (only used when type=NodePort).
  nodePort: null

# -- Ingress configuration (optional, disabled by default).
ingress:
  # -- Whether to create an Ingress resource.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Annotations for the Ingress.
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts.
  hosts:
    - host: binflow.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration.
  tls: []
  #  - secretName: binflow-tls
  #    hosts:
  #      - binflow.local

# -- Resource requests/limits for the BinFlow container.
resources: {}
  # We recommend 256Mi-1Gi memory and 100m-1 CPU for typical workloads.
  # limits:
  #   cpu: 1
  #   memory: 1Gi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# -- Horizontal Pod Autoscaler (disabled by default — single replica constraint).
hpa:
  # -- Whether to create an HPA resource.
  enabled: false
  # -- Minimum replicas.
  minReplicas: 1
  # -- Maximum replicas (must be 1 — single replica constraint).
  maxReplicas: 1
  # -- Target CPU utilization percentage for autoscaling.
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage for autoscaling.
  targetMemoryUtilizationPercentage: null

# -- Node selector for the BinFlow pod.
nodeSelector: {}
# -- Tolerations for the BinFlow pod.
tolerations: []
# -- Affinity for the BinFlow pod.
affinity: {}

# -- Persistent Volume Claim configuration for the Blob data directory.
#    BinFlow stores blobs + SQLite DB + sessions under dataDir.
#    RWO is required (single-writer constraint; multi-reader is OK via WAL).
persistence:
  # -- Whether to create a PVC. If false, an emptyDir is used (data lost on pod restart).
  enabled: true
  # -- PVC access mode.
  accessMode: ReadWriteOnce
  # -- PVC size. Adjust based on expected artifact storage.
  size: 20Gi
  # -- Storage class name.
  storageClass: ""
  # -- Existing PVC claim name (if set, no new PVC is created).
  existingClaim: ""
  # -- Annotations for the PVC.
  annotations: {}

# -- BinFlow server configuration. Values here are rendered into configmap.yaml
#    and mounted at /etc/binflow/binflow.yaml. Secrets (admin password) go into
#    secret.yaml and are NOT stored in the ConfigMap.
config:
  # -- Base URL for the server (used for realm generation, redirects, etc.).
  #    Example: "https://registry.example.com/binflow"
  baseUrl: ""
  # -- Data directory inside the container.
  dataDir: /var/lib/binflow
  # -- Log level: debug, info, warn, error.
  logLevel: info
  # -- Whether to enable anonymous read access to content paths.
  security:
    anonymousAccess: true

  # -- S3 object-storage backend (M6, T-152/T-164/T-170). When enabled the
  #    chart renders storage.backend: s3 plus a storage.s3 section into the
  #    mounted binflow.yaml (key names mirror internal/config S3Config).
  #    secret_access_key is env-only (ADR-0009): it is NEVER a value here —
  #    create a Secret holding BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY and point
  #    existingSecret at it:
  #      kubectl create secret generic binflow-s3 \
  #        --from-literal=BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY=<key>
  s3:
    # -- Switch the blob backend from disk (PVC) to S3.
    enabled: false
    # -- Bucket name. The bucket must already exist (the chart does not
    #    create it) — /healthz's HeadBucket probe reports unhealthy otherwise.
    bucket: binflow
    # -- Region (AWS region or MinIO-compatible region spelling).
    region: us-east-1
    # -- S3-compatible endpoint URL, e.g.
    #    http://minio.minio.svc.cluster.local:9000 or https://s3.amazonaws.com.
    endpoint: ""
    # -- Access key ID (not secret; the secret key lives in existingSecret).
    accessKeyId: ""
    # -- Path-style addressing: true for MinIO, false for AWS virtual-host.
    usePathStyle: true
    # -- Optional key prefix for all stored objects (e.g. "binflow-prod").
    bucketPrefix: ""
    # -- Multipart upload part size in bytes (default 5 MiB).
    uploadPartSize: 5242880
    # -- Concurrent multipart part uploads (default 4).
    uploadConcurrency: 4
    # -- Name of an existing Secret with key
    #    BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY. Required when s3.enabled=true.
    existingSecret: ""

  # -- OIDC identity provider (M6, ADR-0020). Requires a server build with
  #    the auth wiring mounted (T-157); on older builds the strict config
  #    decoder fail-fasts on the auth.oidc section — keep disabled until
  #    then. Key names mirror internal/auth OIDCConfig. client_secret is
  #    env-only: create a Secret holding BINFLOW_AUTH_OIDC_CLIENT_SECRET and
  #    point existingSecret at it:
  #      kubectl create secret generic binflow-oidc \
  #        --from-literal=BINFLOW_AUTH_OIDC_CLIENT_SECRET=<secret>
  oidc:
    # -- Render the auth.oidc section and inject the client secret.
    enabled: false
    # -- OpenID Connect issuer URL (required when enabled), e.g.
    #    https://accounts.example.com
    issuerUrl: ""
    # -- OAuth2 client ID assigned by the provider (required when enabled).
    clientId: ""
    # -- Callback URL, e.g.
    #    https://binflow.example.com/binflow/api/v1/oidc/callback
    redirectUrl: ""
    # -- Requested scopes; empty = server default [openid, profile, email].
    scopes: []
    # -- JWT claim used as username; empty = server default
    #    (preferred_username).
    userClaim: ""
    # -- JWT claim for group membership; empty = server default (groups).
    groupClaim: ""
    # -- Group whose members are granted admin; empty = no claim-inferred
    #    admin mapping.
    adminGroup: ""
    # -- Group whose members are granted readonly_admin (M7, ADR-0026
    #    decision 6); empty = no mapping.
    readOnlyGroup: ""
    # -- Name of an existing Secret with key BINFLOW_AUTH_OIDC_CLIENT_SECRET.
    #    Required when oidc.enabled=true.
    existingSecret: ""

  # -- LDAP identity provider (M6, ADR-0020). Same wiring caveat as oidc
  #    above; key names mirror internal/auth LDAPConfig. bind_password is
  #    env-only: create a Secret holding BINFLOW_AUTH_LDAP_BIND_PASSWORD:
  #      kubectl create secret generic binflow-ldap \
  #        --from-literal=BINFLOW_AUTH_LDAP_BIND_PASSWORD=<password>
  ldap:
    # -- Render the auth.ldap section and inject the bind password.
    enabled: false
    # -- LDAP server URL: ldap://host:389 or ldaps://host:636.
    url: ""
    # -- Search base DN, e.g. dc=example,dc=com.
    baseDn: ""
    # -- Service-account DN for user search; empty = direct user bind
    #    (uid=<username>,<baseDn>).
    bindDn: ""
    # -- User search filter template; first %s is the login username.
    #    Empty = server default (uid=%s).
    userFilter: ""
    # -- Attribute mapping to the BinFlow username; empty = uid.
    userIdAttr: ""
    # -- Group search filter template; empty = no group search.
    groupFilter: ""
    # -- Group search base DN; empty = server default (falls back to baseDn,
    #    PRD FR-55). Set it when groups live in a separate subtree.
    groupBaseDn: ""
    # -- Attribute holding the group name; empty = cn.
    groupNameAttr: ""
    # -- DN of a group whose members are granted admin; empty = no mapping.
    adminGroup: ""
    # -- DN of a group whose members are granted readonly_admin (M7,
    #    ADR-0026 decision 6); empty = no mapping.
    readOnlyGroup: ""
    # -- Idle LDAP connection pool size (server default 5).
    poolSize: 5
    # -- StartTLS on ldap:// connections (ignored for ldaps://).
    startTls: false
    # -- Skip TLS certificate verification. Evaluation only: the server logs
    #    a WARN at boot when enabled. Default false — production must verify
    #    against the system trust store (there is no CA-bundle config key).
    skipTlsVerify: false
    # -- Name of an existing Secret with key BINFLOW_AUTH_LDAP_BIND_PASSWORD.
    #    Required when ldap.enabled=true.
    existingSecret: ""

  # -- Addon circuit breaker (M10 T-283, ADR-0032 / architecture section
  #    15.5): the operator's global breaker over the addon slots, including
  #    the five core package types (a core id in the list is a degradation
  #    knob — the server WARNs at boot and honors it anyway). Rendered into
  #    the mounted binflow.yaml as addons.disabled.
  addons:
    # -- CSV of addon ids to switch off ("" = nothing disabled). CSV, not a
    #    list: one string spells the whole set, matching Artifactory's
    #    addons.disabled form. Values are trimmed; unknown ids are tolerated
    #    (inert set entries); addon ids are case-sensitive. Restart-effective:
    #    the value is consumed once at startup, so removing an entry and
    #    restarting restores everything — the breaker never deletes data.
    #    Addon ids (19 slots, M13): core = generic, docker, maven, npm, pypi;
    #    package-type = go, nuget, cargo, conan, helm, helmoci, rpm, debian;
    #    feature = properties, repo-operations, trashcan, ha,
    #    xray-integration, webhook (the 19th slot, M13 T-362).
    disabled: ""

  # -- Push-replication SSRF posture (T-210 / ADR-0025 decision 4). Rendered
  #    into the mounted binflow.yaml as replication.allow_private_target.
  replication:
    # -- Allow replication target URLs that resolve to private (RFC 1918 /
    #    loopback / link-local) hosts. Default true — every realistic
    #    replication target (datacenter-to-datacenter, same-host) is a
    #    private address. Setting false is an explicit opt-in to the tighter
    #    posture: the engine then rejects private target URLs while still
    #    enforcing scheme/host sanity and re-screening per hop. This key only
    #    toggles the private-address leg of the SSRF screening list.
    allowPrivateTarget: true

  # -- Webhook SSRF posture (M13 T-362 / ADR-0041 decision 6). Rendered into
  #    the mounted binflow.yaml as webhook.allow_private_target.
  webhook:
    # -- Allow webhook subscription target URLs that resolve to private
    #    (RFC 1918 / loopback / link-local) hosts. Default FALSE — the
    #    deliberate asymmetry against replication.allow_private_target
    #    above: webhook targets are REST-CRUD dynamic (the classic SSRF
    #    escalation surface), so deny is the safe default. Setting true is
    #    an explicit opt-in for receivers on private networks.
    allowPrivateTarget: false

  # -- Directory-zip knob family (M13 T-368 / FR-118.1, the K52 snake_case
  #    ruling). Rendered into the mounted binflow.yaml as the folder_download
  #    section — six fields, all explicit (T-183 lesson). Defaults are the
  #    spec column of repo-operations.md section 2.1 = the M12 as-built with
  #    the master switch now spelled: enabled=false, anonymous=false,
  #    1024 MB / 5000 files / 10 concurrent, empty directories off. The
  #    resolved values echo at GET /binflow/api/v1/system/settings.
  folderDownload:
    # -- Master switch for the folder (directory) download endpoint. Default
    #    false — the M12 as-built (folder download off).
    enabled: false
    # -- Allow anonymous principals the folder-download endpoint. Default
    #    false; only read when enabled=true.
    enabledForAnonymous: false
    # -- Maximum zipped download size in MB (env spelling must stay > 0;
    #    0 = unlimited is a YAML-only spelling).
    maxDownloadSizeMb: 1024
    # -- Maximum number of files in one folder download.
    maxFiles: 5000
    # -- Maximum concurrent folder-download requests.
    maxConcurrentRequests: 10
    # -- Include empty directories in the zip. Default false.
    enabledEmptyDirectories: false

  # -- Trashcan retention window (M13 T-368 / FR-118.2). Rendered into the
  #    mounted binflow.yaml as trashcan.retention_days.
  trashcan:
    # -- Days a soft-deleted node stays restorable before the hourly purge
    #    cron drops it. Default 14 = the M12 as-built (the
    #    default-unchanged red line).
    retentionDays: 14

  # -- Standalone storage-chain file binstore.yaml (M11 T-306 / ADR-0036).
  #    When enabled the chart renders a SECOND ConfigMap key, binstore.yaml,
  #    mounted at /etc/binflow/binstore.yaml (next to the mounted
  #    binflow.yaml — the server discovers it there, no extra wiring).
  #    While binstore.yaml owns the storage chain:
  #      - the embedded storage section renders NO chain keys (backend/s3) —
  #        spelling them in both places is a semantic-divergence boot refusal
  #        (Q5 branch ③), so this is enforced, not advised;
  #      - every chain-scoped env var (BINFLOW_STORAGE__BACKEND,
  #        BINFLOW_STORAGE__S3__*) would be IGNORED with a WARN — the chart
  #        sets none of them;
  #      - BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY still applies (env-only
  #        secret, ADR-0009 decision 4 — it always reaches the live S3
  #        provider);
  #      - data_dir / gc_hold_ttl_seconds stay in binflow.yaml (they are not
  #        chain keys and never participate in the coexistence verdict).
  #    Mutually exclusive with config.s3.enabled.
  binstore:
    # -- Declare the storage chain via binstore.yaml instead of the embedded
    #    storage section (mutually exclusive with config.s3.enabled — the
    #    chart refuses to render both).
    enabled: false
    # -- Ordered provider chain: [filestore], [s3], or [filestore, s3] (the
    #    dual migration chain — filestore must come first; any other order,
    #    duplicate provider, or reserved slot (cache-fs/azure/gs) refuses
    #    the boot with a line-pointed error).
    providers: [filestore]
    migration:
      # -- Migration mode for the dual chain: bypass | dual-write |
      #    completed. REQUIRED when providers=[filestore, s3]; must stay
      #    empty for single-provider chains (the migration block is only
      #    legal on the dual chain).
      mode: ""
      # -- Migration concurrency (positive integer; 0 = omit the key and
      #    take the server default).
      concurrency: 0
    # -- S3 provider parameters (only read when the chain includes s3). Key
    #    names mirror the s3 provider block of binstore.yaml, which is the
    #    embedded storage.s3 schema verbatim (ADR-0009/0036 decision 2).
    #    secret_access_key is env-only: create a Secret holding
    #    BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY and point existingSecret at it
    #    (required when the chain includes s3).
    s3:
      # -- Bucket name. Must already exist (the chart does not create it) —
      #    /healthz's HeadBucket probe reports unhealthy otherwise.
      bucket: binflow
      # -- Region (AWS region or MinIO-compatible spelling).
      region: us-east-1
      # -- S3-compatible endpoint URL, e.g.
      #    http://minio.minio.svc.cluster.local:9000 or https://s3.amazonaws.com.
      endpoint: ""
      # -- Access key ID (not secret; the secret key lives in existingSecret).
      accessKeyId: ""
      # -- Path-style addressing: true for MinIO, false for AWS virtual-host.
      usePathStyle: true
      # -- Optional key prefix for all stored objects.
      bucketPrefix: ""
      # -- Multipart upload part size in bytes (default 5 MiB).
      uploadPartSize: 5242880
      # -- Concurrent multipart part uploads (default 4).
      uploadConcurrency: 4
      # -- Name of an existing Secret with key
      #    BINFLOW_STORAGE_S3_SECRET_ACCESS_KEY. Required when the binstore
      #    chain includes s3.
      existingSecret: ""

  # -- Storage GC knobs beyond the basics. Rendered into the mounted
  #    binflow.yaml under the storage section.
  storage:
    # -- GC hold TTL in seconds (M9 T-256 / ADR-0031): how long an
    #    unreleased in-flight GC hold protects a blob. Domain [60, infinity)
    #    enforced at boot (out-of-domain refuses the boot). Default 600 =
    #    the server default; 0 would mean "engine default" — the chart
    #    always spells the effective value explicitly (T-183 lesson).
    gcHoldTtlSeconds: 600

  # -- Auth token-minting posture (M7 T-219 / ADR-0027). Rendered into the
  #    mounted binflow.yaml under the auth section.
  auth:
    # -- Arm the second-factor gate on POST /api/security/token: a non-admin
    #    web-session caller must then present step_up_password (local/LDAP)
    #    or step_up_grant (OIDC). Default false — an unconfigured boot keeps
    #    the pre-M7 posture byte-for-byte; enterprise deployments are
    #    advised to enable it.
    tokenStepUp: false
    # -- Lifetime of one OIDC mint grant, in seconds. Domain [60, 3600]
    #    enforced at boot regardless of the step-up switch. Default 300.
    tokenStepUpGrantTtlSeconds: 300

# -- Admin password for the initial admin user. This is stored in a Kubernetes
#    Secret and injected as the BINFLOW_ADMIN_PASSWORD environment variable.
#    Change this in production.
admin:
  password: "password"

# -- Instance master key (M11, env-only): BINFLOW_REMOTE_CREDENTIALS_KEY,
#    the base64 32-byte AES-256-GCM master key (openssl rand -base64 32)
#    that seals, as enc:v1 rows, remote-repository credentials (ADR-0012),
#    replication secrets, admin-managed auth_configs (T-305) and GPG
#    keypairs (T-319, ADR-0038). Never a chart value (ADR-0009): point
#    existingSecret at a Secret you created:
#      kubectl create secret generic binflow-master-key \
#        --from-literal=BINFLOW_REMOTE_CREDENTIALS_KEY=$(openssl rand -base64 32)
#    Boot posture: without the key the instance still boots (nothing sealed
#    yet), but once ANY sealed row exists the boot fail-fasts until the same
#    key returns — set it before creating keypairs/auth configs/remote
#    credentials, and back it up like a password you cannot reset.
masterKey:
  # -- Name of an existing Secret carrying key
  #    BINFLOW_REMOTE_CREDENTIALS_KEY. Empty = the env var is not injected
  #    (no master key; fine for a fresh, unsealed instance).
  existingSecret: ""
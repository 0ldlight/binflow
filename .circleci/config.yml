# BinFlow — CircleCI pipeline (UAT track)
#
# Directive (BOARD 2026-08-26 21:10): CircleCI CI/CD deploying to
# 52.79.109.153 as the UAT environment, docs service included (embedded
# in the binary — single-artifact deploys, same posture as the Jenkins
# test-env chain).
#
# Gitflow mapping (BOARD 2026-08-26 20:45):
#   develop -> Jenkins on the VM test env (172.16.58.129)
#   main    -> this pipeline -> UAT (52.79.109.153)
#
# Prerequisites configured in CircleCI project settings (user actions):
#   - Project linked to github.com/lzwzzy/binflow
#   - SSH key for the UAT host uploaded; its fingerprint in $UAT_SSH_FP
#   - $UAT_HOST (default 52.79.109.153), $UAT_USER (default ubuntu),
#     $UAT_HOME (default /opt/binflow-uat)

version: 2.1

executors:
  go:
    docker:
      - image: cimg/go:1.26-node
    resource_class: medium
  node:
    docker:
      - image: cimg/node:22.16
    resource_class: medium

commands:
  checkout_full:
    steps:
      - checkout

jobs:
  build:
    executor: go
    steps:
      - checkout_full
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
      - run:
          name: Download Go modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths: ["/go/pkg/mod"]
      - run:
          name: Build console + docs + server (embedded)
          command: |
            make console
            make docs
            make build
      - run:
          name: Vet + lint + fast tests
          command: |
            # T-432 structure conformance: make vet carries the web/ node_modules
            # exclusion — bare `go vet ./...` would descend into it after
            # `make console` populated it two steps earlier.
            make vet
            make lint
            go test ./internal/... ./cmd/... -count=1 -short
      - run:
          # T-325: parity with the Jenkins chain's stamp step — bare
          # `make build` leaves version=dev/dev (Q4/T-127), and the deploy
          # smoke asserts the version to prove the swap took. The label is
          # built here AND passed to uat-deploy.sh; they must stay in sync
          # (same expression, same job).
          name: Version stamp (uat label)
          command: |
            LABEL="uat.${CIRCLE_SHA1:0:7}"
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${LABEL} -X main.revision=${CIRCLE_SHA1:0:7}" \
              -o bin/binflow-server ./cmd/binflow-server
            ./bin/binflow-server --version 2>/dev/null | head -1 || true
      - persist_to_workspace:
          root: .
          paths: [bin/]

  deploy_uat:
    executor: go
    steps:
      - checkout_full
      - attach_workspace:
          at: .
      - run:
          name: Install UAT SSH deploy key
          command: |
            # Primary path: UAT_SSH_KEY_B64 holds the base64-encoded private
            # key (set as a CircleCI project env var — easier than the SSH
            # Keys UI which requires a pre-uploaded fingerprint).
            # Fallback: add_ssh_keys picks up any key uploaded via the UI.
            # The deploy script discovers whichever file lands in ~/.ssh/.
            if [ -n "${UAT_SSH_KEY_B64:-}" ]; then
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              printf '%s' "${UAT_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_ed25519_uat
              chmod 600 ~/.ssh/id_ed25519_uat
              echo "UAT deploy key written from UAT_SSH_KEY_B64."
            else
              echo "UAT_SSH_KEY_B64 not set; relying on add_ssh_keys project key."
            fi
      # No fingerprint filter: add_ssh_keys does not expand env vars in the
      # fingerprints list, so an env-var value would be treated as a literal
      # string and match nothing. Omitting the filter loads all SSH keys
      # uploaded to the project (only the UAT deploy key exists), which is
      # equivalent and always correct.
      - add_ssh_keys
      - run:
          name: Ship binary + systemd unit + smoke to UAT
          command: |
            bash deploy/ci/uat-deploy.sh \
              "${UAT_HOST:-52.79.109.153}" \
              "${UAT_USER:-ubuntu}" \
              "${UAT_HOME:-/opt/binflow-uat}" \
              "uat.${CIRCLE_SHA1:0:7}"

  # E2E — the Playwright suite on this pipeline's own runner (T-361, FR-121
  # AC2 / L21 前半). Mirror of the GitHub Actions e2e job (T-350), which
  # stayed the AUTHORITATIVE signal for the e2e load-flake family until the
  # GitHub account's Actions billing blocked job starts (observed 2026-08-28
  # onward: "recent account payments have failed or your spending limit
  # needs to be increased" — every job red at startup, zero steps run).
  # This job re-homes the same recipe on the CI surface that still runs:
  # the workspace binary from `build` (real SPA + docs embedded — the same
  # artifact deploy_uat ships), a defaults boot (admin/password, ./data in
  # the ephemeral job workspace), the three convergent REST seeds QA runs
  # (m8/m9/m10), then a bare `npx playwright test --workers=2` = all three
  # projects, every spec exactly once. Workers stay pinned to 2 — the same
  # first-landing posture as T-350; raise only on three consecutive green
  # main runs of BOTH e2e jobs as evidence.
  #
  # Trigger posture: main-only via the same branch-filter shape as
  # deploy_uat (the 2026-08-28 one-CI-surface directive). Like deploy_uat
  # it rides the build job's workspace rather than rebuilding — one
  # artifact, one truth.
  e2e:
    executor: go
    environment:
      BASE: http://127.0.0.1:8080
    steps:
      - checkout_full
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - web-deps-v1-{{ checksum "web/package-lock.json" }}
      # The runner only needs web/node_modules for the Playwright runner
      # itself; the SPA under test is already embedded in the workspace
      # binary (build ran make console + make docs).
      - run:
          name: Console deps (Playwright runner)
          command: cd web && npm ci
      - save_cache:
          key: web-deps-v1-{{ checksum "web/package-lock.json" }}
          paths: [ "~/project/web/node_modules" ]
      - run:
          name: Install Playwright browser (chromium)
          command: cd web && npx playwright install --with-deps chromium
      # Boot on defaults: :8080, ./data in the job workspace (ephemeral —
      # every run starts from a bare instance, same as the GHA job), no
      # binflow.yaml anywhere (the FR-6-AC5 bare-binary form).
      - run:
          name: Boot BinFlow (defaults + env)
          command: ./bin/binflow-server serve > "$HOME/server.log" 2>&1
          background: true
      - run:
          name: Wait for healthz (60s)
          command: |
            for i in $(seq 1 60); do
              if curl -fsS "$BASE/healthz" > /dev/null 2>&1; then
                echo "binflow healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "binflow never became healthy; log tail:"
            tail -50 "$HOME/server.log" || true
            exit 1
      - run:
          name: Seed (m8 + m9 + m10, real REST plane)
          command: |
            cd web
            node scripts/seed-m8.mjs
            node scripts/seed-m9.mjs
            node scripts/seed-m10.mjs
      - run:
          name: Playwright (all three projects, workers=2)
          no_output_timeout: 30m
          command: cd web && npx playwright test --workers=2
      - run:
          name: Server log on failure
          when: on_fail
          command: tail -200 "$HOME/server.log" || true

  # T-469 (user directive #10, issued twice): after every UAT deploy, run a
  # push+pull roundtrip for EVERY package protocol against the live UAT with
  # the real client toolchains. The matrix itself lives in ONE script —
  # ci/protocol-matrix.sh — shared verbatim with the GitHub Actions face
  # (.github/workflows/protocol-matrix.yml); this job only installs the
  # toolchains, trusts the plain-HTTP UAT registry on the docker daemon, and
  # invokes per-leg steps (when: always — one red leg never masks the rest).
  #
  # Machine executor on purpose: the docker leg needs a daemon whose
  # insecure-registries we can configure (docker-executor jobs get a managed
  # remote daemon with no daemon.json access), and the JVM/.NET/conan
  # toolchains install natively on the VM.
  #
  # Project secrets (Settings > Environment Variables; none are defaults):
  #   UAT_MATRIX_BASE       http://52.79.109.153:8080 (falls back to this)
  #   UAT_MATRIX_USER       admin (falls back)
  #   UAT_MATRIX_PASSWORD   REQUIRED — the UAT admin password ($:? guard)
  protocol_matrix:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout_full
      - run:
          name: Matrix env into BASH_ENV (every later step sources it)
          # (printf lines, not a heredoc: the config processor requires
          # escaping bare '<<' in v2.1+ — simpler to avoid it entirely)
          command: |
            mkdir -p "$HOME/project/ci/.matrix-work"
            printf '%s\n' \
              'export BINFLOW_BASE="${UAT_MATRIX_BASE:-http://52.79.109.153:8080}"' \
              'export BINFLOW_USER="${UAT_MATRIX_USER:-admin}"' \
              'export BINFLOW_PASSWORD="${UAT_MATRIX_PASSWORD:?UAT_MATRIX_PASSWORD secret missing in CircleCI project env}"' \
              'export BINFLOW_MATRIX_WORK="$HOME/project/ci/.matrix-work"' \
              'export BINFLOW_MATRIX_REPORT="$HOME/project/ci/.matrix-work/report.log"' \
              'export PATH="$HOME/.dotnet:$HOME/.local/bin:$PATH"' \
              >> "$BASH_ENV"
            . "$BASH_ENV"
      - run:
          name: Client toolchains (mvn 3.9 / JDK17 / node22 / go1.26 / helm4 / dotnet8 / conan2 / build+twine)
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-17-jdk-headless python3-venv python3-pip \
              cmake g++ unzip zip jq >/dev/null
            # maven 3.9.9 — the docs/user/integrations/maven.md anchor.
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz \
              | sudo tar -xz -C /opt
            sudo ln -sf /opt/apache-maven-3.9.9/bin/mvn /usr/local/bin/mvn
            # node 22 (npm leg; apt's is too old for the fixture chain)
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - >/dev/null
            sudo apt-get install -y -qq nodejs >/dev/null
            # go — same line as go.mod's directive
            curl -fsSL "https://go.dev/dl/go1.26.6.linux-amd64.tar.gz" | sudo tar -xz -C /usr/local
            # helm 4.2.4 — the docs/user/integrations/helm-charts.md anchor
            curl -fsSL https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz | tar -xz
            sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
            # dotnet SDK 8 — the docs/user/integrations/nuget.md anchor
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet" >/dev/null
            # conan 2 + pypi build/twine — the docs/user/integrations anchors
            pip3 install --quiet --user conan build twine
      - run:
          name: Docker daemon — trust the plain-HTTP UAT registry
          command: |
            REG="$(printf '%s' "${UAT_MATRIX_BASE:-http://52.79.109.153:8080}" | sed -e 's|^https\{0,1\}://||')"
            sudo mkdir -p /etc/docker
            printf '{"insecure-registries":["%s"]}\n' "$REG" | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
            docker info | grep -A3 'Insecure Registries'
      - run:
          name: matrix leg — generic
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg generic
      - run:
          name: matrix leg — maven
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg maven
      - run:
          name: matrix leg — gradle
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg gradle
      - run:
          name: matrix leg — npm
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg npm
      - run:
          name: matrix leg — pypi
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg pypi
      - run:
          name: matrix leg — docker
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg docker
      - run:
          name: matrix leg — nuget
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg nuget
      - run:
          name: matrix leg — go
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg go
      - run:
          name: matrix leg — helm
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg helm
      - run:
          name: matrix leg — conan
          when: always
          command: bash ci/protocol-matrix.sh --strict-tools --leg conan
      - run:
          name: Matrix report
          when: always
          command: bash ci/protocol-matrix.sh --report

workflows:
  version: 2
  uat:
    jobs:
      - build:
          filters:
            branches:
              only: [main]
      - deploy_uat:
          requires: [build]
          filters:
            branches:
              only: [main]
      # T-469: every successful UAT deploy is followed by the full protocol
      # push/pull matrix against the instance it just shipped (user
      # directive #10). deploy_uat's own smoke (version stamp + docs face)
      # stays the deploy gate; this job is the protocol-depth gate.
      - protocol_matrix:
          requires: [deploy_uat]
          filters:
            branches:
              only: [main]
      - e2e:
          requires: [build]
          filters:
            branches:
              only: [main]

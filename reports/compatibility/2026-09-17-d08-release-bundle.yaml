bugs_fixed:
  - id: BUG-1
    case: c27-assemble-syntax-error
    surface: "AQL E1 语法错锚点（共享面：/api/search/aql 与 /api/release/bundle 同源）"
    symptom: "items.find(bogus-syntax( 的残段 B 报 `-syntax(`（词法器在 `-` 处死），A 报 `bogus-syntax(`（语法失败处）"
    root_cause: "lexAll 全量预词法——词法错误恒抢在更早位置的语法错误前上浮；A 是流式拉取 token"
    fix: "internal/search：lexAll 失败时返回已词法前缀，newParser 用合成 EOF 重跑前缀、前缀语法错误优先（否则报词法锚点）"
    tests: internal/search/parse_error_anchor_test.go（三臂：语法先于词法/前缀完整/未闭合构造）
  - id: BUG-2
    case: c22-v2-audit-get
    surface: "GET /api/v2/audit 405 缺 Allow 头"
    fix: "internal/httpapi/release_bundle_v2.go handleV2AuditMethodNotAllowed 补 `Allow: POST,OPTIONS`（p22 逐字）"
    tests: release_bundle_v2_test.go TestV2AuditFamily 扩 Allow 断言
  - id: BUG-3
    case: "c43-system-repo-side-effect / c55(修复前 400 卡死)"
    surface: "release-bundles 系统仓不可经 B 自身 DELETE 清除"
    symptom: "DELETE /api/repositories/release-bundles → 400 invalid repository type \"releasebundles\"（round1 实测，系统仓成永久残留）"
    root_cause: "DeleteRepo 的 D3 删仓校验对域自有行跑管理面包型矩阵——该行由 bundle.EnsureSystemRepo 直写（设计上在矩阵之外）"
    fix: "internal/repo/service.go DeleteRepo：PackageType==bundle.PackageTypeReleaseBundles 豁免矩阵校验（未知包型行仍拒——纵深未弱化）"
    tests: internal/repo/system_repo_delete_test.go（系统行可删+外来行仍拒）
  - id: BUG-4
    case: c07-head-missing
    surface: "HEAD /api/release/bundles/{name}/{version} 404 缺 Content-Type"
    symptom: "A 无 body 404 仍镜像 GET 面 CT（application/json 无 charset），B 不发"
    fix: "internal/httpapi/bundle.go handleBundleHead 404 臂补 Content-Type: application/json"
    tests: bundle_wire_test.go p07 块扩 CT 断言
divergent_cases:
  - id: c42-store-bad-project
    verdict: DIVERGENT
    class: pending_ruling（候选 known-divergence 登记）
    evidence: >-
      同一请求（PUT /release/store?projectKey=l027qnope + {"signedJwsBundle":"garbage"}）A 端
      非确定两形：p49 wire+round2 = 404 Access 联查消息；round4-6+复探 6 连发 = 500 JWS 解析
      （臂序竞态/时效态）。B 确定性实现 p49 锚（404 联查消息逐字）。建议：B 维持 p49 形，
      A 竞态登记 known-divergence（本票不改 B）。
  - id: c53-permissions-any-family
    verdict: DIVERGENT
    class: pending_ruling（相邻域——安全/权限 REST 面，非 D08 六行）
    evidence: >-
      GET /api/security/permissions 的 Any 家族投影 A=['Any Remote','Anything'] B=[]。
      D08-R06 本质断言（ANY DISTRIBUTION 非 REST 实体）双端一致成立：Any Distribution/
      Any Local 单查双端 404、名单均无该行。残差是 B 缺 Any Remote/Anything 两个合成预置
      目标的 REST 呈现——属权限目标族（spec §10.7 p61/p62 锚），建议路由安全域 owner 评估。
  - id: c55-system-repo-delete
    verdict: DIVERGENT
    class: pending_ruling（相邻域——repositories 管理面，非 D08 六行）
    evidence: >-
      DELETE /api/repositories/{key} 响应信封：A JSON 报告体 {repoKey,statusMsg,
      deletedArtifactsCount,success}（普通仓同形——l027q-delprobe 实证非 D08 特有）、
      B text/plain "Repository … deleted successfully."。D08 特有部分（系统仓可 DELETE 清除）
      已随 BUG-3 修复双端一致；信封形态建议路由仓库管理域 owner（repositories.go:834）。
